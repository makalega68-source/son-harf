name: SonHarfIOS
options:
  bundleIdPrefix: com.sonharf
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.sonharf.game.ios
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  SonHarfIOS:
    type: application
    platform: iOS
    sources:
      - path: SonHarfIOS
    settings:
      base:
        INFOPLIST_FILE: SonHarfIOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
