<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Son Harf • Operasyon</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#090d18;color:#eef2ff;margin:0}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:#12192a;border:1px solid #27314a;border-radius:18px;padding:18px;margin:12px 0}input,button{padding:12px;border-radius:12px;border:1px solid #34405d;background:#0c1220;color:#fff}button{cursor:pointer;background:#635bff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{background:#0c1220;padding:14px;border-radius:14px}.muted{color:#9aa6c1}pre{white-space:pre-wrap}</style></head><body><div class="wrap"><h1>Son Harf • Sistem Sağlığı</h1><p class="muted">Yalnız admin hesabı. Tüm onarım işlemleri audit log'a yazılır.</p><div id="login" class="card"><input id="email" type="email" placeholder="Admin e-posta"><input id="password" type="password" placeholder="Şifre"><button onclick="login()">Giriş</button><p id="msg"></p></div><div id="panel" hidden><div class="card"><button onclick="health()">Sağlığı Yenile</button> <button onclick="maintenance()">Bakım Çalıştır</button><div id="metrics" class="grid"></div></div><div class="card"><h3>Özellik Anahtarları</h3><button onclick="flag('matchmaking_enabled',true)">Eşleşme Aç</button> <button onclick="flag('matchmaking_enabled',false)">Eşleşme Kapat</button> <button onclick="flag('chat_enabled',true)">Chat Aç</button> <button onclick="flag('chat_enabled',false)">Chat Kapat</button> <button onclick="flag('trivia_enabled',true)">Quiz Aç</button> <button onclick="flag('trivia_enabled',false)">Quiz Kapat</button></div><div class="card"><h3>Maç Onarımı</h3><input id="room" placeholder="Room UUID"><button onclick="closeRoom()">Maçı Güvenle Kapat</button></div><div class="card"><pre id="log"></pre></div></div></div><script>
const URL='https://bzdtftzdjtjoqhtcqtxb.supabase.co';const KEY='sb_publishable_e0SbZKPDCfEcRlxaJsXC7g_D9xkaDjf';const sb=supabase.createClient(URL,KEY);
const out=x=>document.getElementById('log').textContent=JSON.stringify(x,null,2);
async function login(){let {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}let {data}=await sb.rpc('is_admin');if(!data){await sb.auth.signOut();msg.textContent='Bu hesap admin değil.';return}login.hidden=true;panel.hidden=false;health()}
async function health(){let {data,error}=await sb.rpc('admin_system_health');if(error)return out(error);metrics.innerHTML=Object.entries(data).map(([k,v])=>`<div class=metric><b>${k}</b><br>${v}</div>`).join('')}
async function maintenance(){let {data,error}=await sb.rpc('admin_run_maintenance');out(error||data);health()}
async function flag(k,v){let {error}=await sb.rpc('admin_set_config',{p_key:k,p_value:v});out(error||{ok:true,key:k,value:v})}
async function closeRoom(){let {error}=await sb.rpc('admin_close_room',{p_room_id:room.value,p_reason:'admin_closed'});out(error||{ok:true})}
</script></body></html>
