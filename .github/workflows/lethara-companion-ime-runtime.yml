name: Lethara Companion IME Runtime

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/lethara-companion-ime-runtime.yml'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/debug/AndroidManifest.xml'
      - 'app/src/debug/java/com/sonharf/game/MascotCompanionImeSmokeActivity.kt'
      - 'app/src/main/java/com/sonharf/game/MascotCompanionScreen.kt'
      - 'app/src/main/java/com/sonharf/game/MascotCardPreview.kt'
      - 'app/src/test/java/com/sonharf/game/LetharaReleaseContractTest.kt'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/lethara-companion-ime-runtime.yml'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/debug/AndroidManifest.xml'
      - 'app/src/debug/java/com/sonharf/game/MascotCompanionImeSmokeActivity.kt'
      - 'app/src/main/java/com/sonharf/game/MascotCompanionScreen.kt'
      - 'app/src/main/java/com/sonharf/game/MascotCardPreview.kt'
      - 'app/src/test/java/com/sonharf/game/LetharaReleaseContractTest.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-ime-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Enable KVM access for emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; emulator may be slow"
          fi

      - name: Verify production companion with Android IME
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p artifacts/companion-ime
            test -f app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 720x1600
            adb shell wm density 280
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb logcat -c

            adb shell am start -W -n com.sonharf.game/.MascotCompanionImeSmokeActivity
            timeout 25 sh -c "until adb logcat -d | grep -q 'MASCOT_COMPANION_SCREEN_READY'; do sleep 1; done"
            sleep 2

            adb shell uiautomator dump /sdcard/companion-before.xml >/dev/null
            adb pull /sdcard/companion-before.xml artifacts/companion-ime/companion-before.xml >/dev/null

            python3 - <<'PY' > /tmp/companion_tap.txt
            import re
            import xml.etree.ElementTree as ET

            root = ET.parse("artifacts/companion-ime/companion-before.xml").getroot()
            candidates = []
            for node in root.iter("node"):
                if node.attrib.get("package") != "com.sonharf.game":
                    continue
                cls = node.attrib.get("class", "")
                text = node.attrib.get("text", "")
                if cls == "android.widget.EditText" or "Yoldaşına bir şey söyle" in text or "Say something to your companion" in text:
                    candidates.append(node)
            if candidates:
                bounds = candidates[-1].attrib.get("bounds", "")
                m = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                if not m:
                    raise SystemExit("Unable to parse chat input bounds: " + bounds)
                l, t, r, b = map(int, m.groups())
                print((l + r) // 2, (t + b) // 2)
            else:
                # Fixed emulator fallback. The post-IME assertion below still has to find the real
                # application EditText, so this does not weaken the visibility gate.
                print(300, 1450)
            PY

            read TAP_X TAP_Y < /tmp/companion_tap.txt
            adb shell input tap "$TAP_X" "$TAP_Y"
            timeout 25 sh -c "until adb logcat -d | grep -q 'MASCOT_COMPANION_IME_VISIBLE=true'; do sleep 1; done"

            adb shell input text ime_smoke
            sleep 2
            adb shell uiautomator dump /sdcard/companion-ime.xml >/dev/null
            adb pull /sdcard/companion-ime.xml artifacts/companion-ime/companion-ime.xml >/dev/null
            adb logcat -d > artifacts/companion-ime/companion-logcat.txt
            adb exec-out screencap -p > artifacts/companion-ime/companion-ime.png

            python3 - <<'PY'
            import re
            import xml.etree.ElementTree as ET
            from pathlib import Path

            root = ET.parse("artifacts/companion-ime/companion-ime.xml").getroot()
            editable = []
            for node in root.iter("node"):
                if node.attrib.get("package") != "com.sonharf.game":
                    continue
                if node.attrib.get("class") == "android.widget.EditText":
                    editable.append(node)
            if not editable:
                raise SystemExit("Production companion EditText is missing while IME is visible")

            chat = editable[-1]
            bounds = chat.attrib.get("bounds", "")
            match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
            if not match:
                raise SystemExit("Unable to parse visible chat input bounds: " + bounds)
            left, top, right, bottom = map(int, match.groups())

            log = Path("artifacts/companion-ime/companion-logcat.txt").read_text(errors="replace")
            samples = re.findall(
                r"MASCOT_COMPANION_IME_VISIBLE=true root_height=(\d+) ime_bottom=(\d+) safe_bottom=(\d+)",
                log,
            )
            if not samples:
                raise SystemExit("IME-visible inset sample was not logged")
            root_height, ime_bottom, safe_bottom = map(int, samples[-1])
            if ime_bottom <= 0:
                raise SystemExit(f"IME reported visible with invalid inset: {ime_bottom}")
            if bottom > safe_bottom + 4:
                raise SystemExit(
                    f"Chat input is obscured by IME: input_bottom={bottom}, safe_bottom={safe_bottom}"
                )
            if right <= left or bottom <= top:
                raise SystemExit("Chat input has invalid visible bounds")
            print(
                "COMPANION_IME_LAYOUT_PASS "
                f"input=[{left},{top}][{right},{bottom}] "
                f"root_height={root_height} ime_bottom={ime_bottom} safe_bottom={safe_bottom}"
            )
            PY

            test "$(stat -c%s artifacts/companion-ime/companion-ime.png)" -gt 20000
            ! grep -Eqi 'FATAL EXCEPTION|Fatal signal|SIGABRT|SIGSEGV|ANR in com\.sonharf\.game|PostconditionPanic' artifacts/companion-ime/companion-logcat.txt

            adb shell input keyevent 4
            timeout 15 sh -c "until adb logcat -d | grep -q 'MASCOT_COMPANION_IME_VISIBLE=false'; do sleep 1; done"
            echo "LETHARA_COMPANION_IME_RUNTIME_PASS"

      - name: Upload companion IME evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Lethara-Companion-IME-Evidence
          path: artifacts/companion-ime/
          if-no-files-found: warn
          retention-days: 14
