name: Package 2 Auto Direction Patch

on:
  push:
    branches:
      - fix/word-siege-package2-auto-direction-20260831

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply Package 2 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/sonharf/game/WordSiegeExperience.kt')
          text = path.read_text()

          replacements = [
              ('    var horizontal by remember { mutableStateOf(true) }\n', ''),
              ('                    horizontal = horizontal,\n', ''),
              ('                    onHorizontal = { horizontal = it },\n', ''),
              ('    horizontal: Boolean,\n', ''),
              ('    onHorizontal: (Boolean) -> Unit,\n', ''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected fragment: {old!r}')
              text = text.replace(old, new, 1)

          old_submit = '''                    onSubmit = {\n                        if (placements.isEmpty()) {\n                            notice = sh("Önce raftan harf seçip tahtaya yerleştir.", "Place at least one rack tile on the board.")\n                        } else {\n                            runGameAction {\n                                backend.submitWordSiegeMove(\n                                    game.id,\n                                    placements.entries.sortedBy { it.key }.map { WordSiegePlacement(it.key, it.value) },\n                                    horizontal,\n                                )\n                            }\n                        }\n                    },\n'''
          new_submit = '''                    onSubmit = {\n                        if (placements.isEmpty()) {\n                            notice = sh("Önce raftan harf seçip tahtaya yerleştir.", "Place at least one rack tile on the board.")\n                        } else {\n                            val direction = detectWordSiegeDirection(game.board, placements.keys)\n                            if (direction == null) {\n                                notice = sh(\n                                    "Yeni taşlar aynı satırda veya aynı sütunda olmalı.",\n                                    "New tiles must be in one row or one column.",\n                                )\n                            } else {\n                                runGameAction {\n                                    backend.submitWordSiegeMove(\n                                        game.id,\n                                        placements.entries.sortedBy { it.key }.map { WordSiegePlacement(it.key, it.value) },\n                                        direction == WordSiegeDirection.HORIZONTAL,\n                                    )\n                                }\n                            }\n                        }\n                    },\n'''
          if old_submit not in text:
              raise SystemExit('submit block not found')
          text = text.replace(old_submit, new_submit, 1)

          old_controls = '''                    Row(\n                        Modifier.fillMaxWidth(),\n                        verticalAlignment = Alignment.CenterVertically,\n                        horizontalArrangement = Arrangement.spacedBy(if (tight) 4.dp else 6.dp),\n                    ) {\n                        FilterChip(\n                            selected = horizontal,\n                            onClick = { onHorizontal(true) },\n                            enabled = canAct,\n                            modifier = Modifier.height(if (tight) 30.dp else 32.dp),\n                            label = {\n                                Text(\n                                    sh("YATAY", "HORIZONTAL"),\n                                    fontSize = if (tight) 8.sp else 9.sp,\n                                    fontWeight = FontWeight.Bold,\n                                )\n                            },\n                            leadingIcon = { Icon(Icons.Rounded.SwapHoriz, null, Modifier.size(if (tight) 14.dp else 15.dp)) },\n                            colors = FilterChipDefaults.filterChipColors(\n                                selectedContainerColor = SiegeBlueSoft,\n                                selectedLabelColor = MainUi.Blue,\n                            ),\n                        )\n                        FilterChip(\n                            selected = !horizontal,\n                            onClick = { onHorizontal(false) },\n                            enabled = canAct,\n                            modifier = Modifier.height(if (tight) 30.dp else 32.dp),\n                            label = {\n                                Text(\n                                    sh("DİKEY", "VERTICAL"),\n                                    fontSize = if (tight) 8.sp else 9.sp,\n                                    fontWeight = FontWeight.Bold,\n                                )\n                            },\n                            leadingIcon = { Icon(Icons.Rounded.SwapVert, null, Modifier.size(if (tight) 14.dp else 15.dp)) },\n                            colors = FilterChipDefaults.filterChipColors(\n                                selectedContainerColor = SiegePurpleSoft,\n                                selectedLabelColor = SiegePurple,\n                            ),\n                        )\n                        Spacer(Modifier.weight(1f))\n                        Text(\n                            sh("Torba ${game.bag.length}", "Bag ${game.bag.length}"),\n                            color = MainUi.Muted,\n                            fontSize = if (tight) 8.sp else 9.sp,\n                            fontWeight = FontWeight.SemiBold,\n                        )\n                    }\n'''
          new_controls = '''                    Row(\n                        Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.End,\n                        verticalAlignment = Alignment.CenterVertically,\n                    ) {\n                        Text(\n                            sh("Torba ${game.bag.length}", "Bag ${game.bag.length}"),\n                            color = MainUi.Muted,\n                            fontSize = if (tight) 8.sp else 9.sp,\n                            fontWeight = FontWeight.SemiBold,\n                        )\n                    }\n'''
          if old_controls not in text:
              raise SystemExit('manual direction UI block not found')
          text = text.replace(old_controls, new_controls, 1)
          path.write_text(text)

          helper = Path('app/src/main/java/com/sonharf/game/WordSiegeDirection.kt')
          helper.write_text('''package com.sonharf.game\n\nimport com.sonharf.game.data.WordSiegeCellDto\n\ninternal enum class WordSiegeDirection { HORIZONTAL, VERTICAL }\n\ninternal fun detectWordSiegeDirection(\n    board: List<WordSiegeCellDto>,\n    placementIndices: Collection<Int>,\n): WordSiegeDirection? {\n    val indices = placementIndices.distinct().sorted()\n    if (indices.isEmpty() || indices.any { it !in 0..80 }) return null\n\n    if (indices.size > 1) {\n        val anchor = indices.first()\n        val sameRow = indices.all { it / 9 == anchor / 9 }\n        val sameColumn = indices.all { it % 9 == anchor % 9 }\n        return when {\n            sameRow -> WordSiegeDirection.HORIZONTAL\n            sameColumn -> WordSiegeDirection.VERTICAL\n            else -> null\n        }\n    }\n\n    val index = indices.single()\n    val horizontalSpan = existingSpan(board, index, horizontal = true)\n    val verticalSpan = existingSpan(board, index, horizontal = false)\n    return when {\n        horizontalSpan == 0 && verticalSpan == 0 -> null\n        horizontalSpan >= verticalSpan -> WordSiegeDirection.HORIZONTAL\n        else -> WordSiegeDirection.VERTICAL\n    }\n}\n\nprivate fun existingSpan(board: List<WordSiegeCellDto>, index: Int, horizontal: Boolean): Int {\n    val row = index / 9\n    val column = index % 9\n    var count = 0\n\n    fun occupied(target: Int): Boolean = board.getOrNull(target)?.letter != null\n\n    if (horizontal) {\n        var c = column - 1\n        while (c >= 0 && occupied(row * 9 + c)) { count++; c-- }\n        c = column + 1\n        while (c <= 8 && occupied(row * 9 + c)) { count++; c++ }\n    } else {\n        var r = row - 1\n        while (r >= 0 && occupied(r * 9 + column)) { count++; r-- }\n        r = row + 1\n        while (r <= 8 && occupied(r * 9 + column)) { count++; r++ }\n    }\n    return count\n}\n''')

          test = Path('app/src/test/java/com/sonharf/game/WordSiegeDirectionTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package com.sonharf.game\n\nimport com.sonharf.game.data.WordSiegeCellDto\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertNull\nimport org.junit.Test\n\nclass WordSiegeDirectionTest {\n    private fun board(vararg occupied: Int): List<WordSiegeCellDto> =\n        List(81) { index -> WordSiegeCellDto(letter = if (index in occupied) "A" else null) }\n\n    @Test\n    fun multipleTilesInSameRowAreHorizontal() {\n        assertEquals(WordSiegeDirection.HORIZONTAL, detectWordSiegeDirection(board(), listOf(36, 38)))\n    }\n\n    @Test\n    fun multipleTilesInSameColumnAreVertical() {\n        assertEquals(WordSiegeDirection.VERTICAL, detectWordSiegeDirection(board(), listOf(22, 40)))\n    }\n\n    @Test\n    fun mixedRowsAndColumnsAreInvalid() {\n        assertNull(detectWordSiegeDirection(board(), listOf(36, 46)))\n    }\n\n    @Test\n    fun existingLetterMaySitBetweenNewHorizontalTiles() {\n        assertEquals(WordSiegeDirection.HORIZONTAL, detectWordSiegeDirection(board(37), listOf(36, 38)))\n    }\n\n    @Test\n    fun singleTileUsesHorizontalExistingWord() {\n        assertEquals(WordSiegeDirection.HORIZONTAL, detectWordSiegeDirection(board(36, 37, 38), listOf(39)))\n    }\n\n    @Test\n    fun singleTileUsesVerticalExistingWord() {\n        assertEquals(WordSiegeDirection.VERTICAL, detectWordSiegeDirection(board(13, 22, 31), listOf(40)))\n    }\n\n    @Test\n    fun isolatedSingleTileHasNoForcedDirection() {\n        assertNull(detectWordSiegeDirection(board(), listOf(40)))\n    }\n\n    @Test\n    fun singleTileAtCrossingUsesLongerExistingAxis() {\n        assertEquals(WordSiegeDirection.HORIZONTAL, detectWordSiegeDirection(board(37, 38, 39, 31), listOf(40)))\n    }\n}\n''')
          PY
      - name: Verify Package 2 scope
        shell: bash
        run: |
          ! grep -q 'var horizontal by remember' app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          ! grep -q 'sh("YATAY", "HORIZONTAL")' app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          ! grep -q 'sh("DİKEY", "VERTICAL")' app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          grep -q 'detectWordSiegeDirection(game.board, placements.keys)' app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          grep -q 'existingLetterMaySitBetweenNewHorizontalTiles' app/src/test/java/com/sonharf/game/WordSiegeDirectionTest.kt
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Commit tested Package 2 changes
        shell: bash
        run: |
          rm .github/workflows/package2-auto-direction-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegeExperience.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeDirection.kt \
                  app/src/test/java/com/sonharf/game/WordSiegeDirectionTest.kt \
                  .github/workflows/package2-auto-direction-patch.yml
          git commit -m "fix(word-siege): detect move direction automatically"
          git push
