name: Session Heartbeat Patch

on:
  push:
    branches: [ fix/session-heartbeat-resilience-20260920 ]
    paths:
      - 'tools/session-heartbeat-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-heartbeat-resilience-20260920
          fetch-depth: 0
      - name: Apply exact source patch
        run: python tools/apply_session_heartbeat_patch.py
      - name: Validate patched sources
        run: |
          git diff --check
          grep -n 'heartbeatRoom(id)' app/src/main/java/com/sonharf/game/data/OnlineGameBackend.kt
          grep -n 'PASSWORD_RECOVERY_STATE_KEY' app/src/main/java/com/sonharf/game/MainActivity.kt
          grep -n 'setIntent(Intent(intent).apply { data = null })' app/src/main/java/com/sonharf/game/MainActivity.kt
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/data/OnlineGameBackend.kt \
                  app/src/main/java/com/sonharf/game/MainActivity.kt
          git commit -m "Restore Premier heartbeat and recovery recreation safety [skip ci]"
          git push origin HEAD:fix/session-heartbeat-resilience-20260920
