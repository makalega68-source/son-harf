name: Native Dark One Shot Patch

on:
  push:
    branches:
      - ui/native-dark-professional-20260921

permissions:
  contents: write

jobs:
  patch-large-ui-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Native Compose UI patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Guard failed: expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Guard failed: expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          shell = "app/src/main/java/com/sonharf/game/PremiumAdultApp.kt"
          replace_once(shell, "val scheme = lightColorScheme(", "val scheme = darkColorScheme(")
          replace_once(shell, "MaterialTheme(colorScheme = scheme) {", "MaterialTheme(colorScheme = scheme, typography = AppTypography) {")
          replace_once(shell, "Box(Modifier.fillMaxSize().padding(padding)) {", "Box(Modifier.fillMaxSize().padding(padding).imePadding()) {")
          replace_once(
              shell,
              """NavigationBar(\n        containerColor = SonHarfTheme.NavigationSurface,\n        tonalElevation = 0.dp,\n        windowInsets = NavigationBarDefaults.windowInsets,\n    ) {""",
              """NavigationBar(\n        modifier = Modifier.height(64.dp),\n        containerColor = SonHarfTheme.NavigationSurface,\n        tonalElevation = 0.dp,\n        windowInsets = WindowInsets(0, 0, 0, 0),\n    ) {""",
          )
          replace_once(
              shell,
              """            Icon(icon, null, tint = SonHarfTheme.Primary, modifier = Modifier.size(20.dp))\n            Text(label, color = SonHarfTheme.TextPrimary, fontSize = 9.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center, maxLines = 1)""",
              """            if (label == \"Lig\" || label == \"League\") {\n                PackageLeagueBadge(Modifier.size(22.dp))\n            } else {\n                Icon(icon, null, tint = SonHarfTheme.Primary, modifier = Modifier.size(20.dp))\n            }\n            Text(label, color = SonHarfTheme.TextPrimary, fontSize = 9.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center, maxLines = 1)""",
          )

          home = "app/src/main/java/com/sonharf/game/PremiumHomePolish.kt"
          replace_once(
              home,
              "colors = ButtonDefaults.buttonColors(containerColor = Color.White, contentColor = SonHarfTheme.Primary)",
              "colors = ButtonDefaults.buttonColors(containerColor = SonHarfTheme.Primary, contentColor = SonHarfTheme.OnPrimary)",
          )
          replace_once(
              home,
              """                    Surface(shape = RoundedCornerShape(12.dp), color = SonHarfTheme.Purple.copy(alpha = .11f)) {\n                        Icon(Icons.Rounded.EmojiEvents, null, tint = SonHarfTheme.Purple, modifier = Modifier.padding(8.dp).size(20.dp))\n                    }""",
              """                    PackageLeagueBadge(Modifier.size(36.dp), tint = SonHarfTheme.Lavender)""",
          )

          siege = "app/src/main/java/com/sonharf/game/WordSiegeExperience.kt"
          replace_once(
              siege,
              "import androidx.compose.foundation.lazy.items\n",
              "import androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.text.KeyboardActions\nimport androidx.compose.foundation.text.KeyboardOptions\n",
          )
          replace_once(
              siege,
              "import androidx.compose.ui.text.font.FontWeight\n",
              "import androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.input.ImeAction\n",
          )
          replace_once(
              siege,
              "internal val SiegePurpleSoft: Color get() = if (SonHarfCosmetics.darkArenaTheme) MainUi.SurfaceSoft else Color(0xFFF0ECFF)",
              "internal val SiegePurpleSoft: Color get() = MainUi.SurfaceSoft",
          )
          replace_once(siege, "private val SiegeTile = Color(0xFFFFE3A5)", "private val SiegeTile: Color get() = SonHarfTheme.GameTile")
          replace_once(siege, "private val SiegeTileBorder = Color(0xFFD99818)", "private val SiegeTileBorder: Color get() = SonHarfTheme.GameTileBorder")
          replace_once(siege, "private val SiegeLightTileText = Color(0xFF2F2A1F)", "private val SiegeLightTileText: Color get() = SonHarfTheme.TextPrimary")
          replace_once(siege, "private val SiegeLightTileMuted = Color(0xFF5D4B20)", "private val SiegeLightTileMuted: Color get() = SonHarfTheme.TextSecondary")
          replace_all(siege, "else -> Color(0xFFFFF1C9)", "else -> MainUi.Tile")
          replace_once(
              siege,
              "Column(Modifier.heightIn(min = 220.dp, max = 430.dp)) {",
              "Column(Modifier.heightIn(min = 220.dp, max = 430.dp).imePadding()) {",
          )
          replace_once(
              siege,
              """                OutlinedTextField(\n                    value = input,\n                    onValueChange = onInput,\n                    modifier = Modifier.fillMaxWidth(),\n                    singleLine = true,\n                    enabled = !busy,\n                    placeholder = { Text(sh(\"Mesaj yaz…\", \"Type a message…\")) },""",
              """                OutlinedTextField(\n                    value = input,\n                    onValueChange = onInput,\n                    modifier = Modifier.fillMaxWidth(),\n                    singleLine = true,\n                    enabled = !busy,\n                    keyboardOptions = KeyboardOptions(imeAction = ImeAction.Send),\n                    keyboardActions = KeyboardActions(onSend = { if (input.isNotBlank() && !busy) onSend() }),\n                    placeholder = { Text(sh(\"Mesaj yaz…\", \"Type a message…\")) },""",
          )

          social = "app/src/main/java/com/sonharf/game/MainSocialScreen.kt"
          replace_all(social, "focusedContainerColor = Color.White", "focusedContainerColor = MainUi.SurfaceRaised")
          replace_all(social, "color = Color(0xFFE8F1EB)", "color = MainUi.SurfaceRaised")
          replace_all(social, "Color(0xFF567A64)", "SonHarfTheme.Primary")

          styles = Path("app/src/main/res/values/styles.xml")
          text = styles.read_text()
          for old, new in [
              ("#F4F2EC", "#141923"),
              ("#F8F7F2", "#171D2A"),
              ("<item name=\"android:windowLightStatusBar\">true</item>", "<item name=\"android:windowLightStatusBar\">false</item>"),
              ("<item name=\"android:windowLightNavigationBar\">true</item>", "<item name=\"android:windowLightNavigationBar\">false</item>"),
          ]:
              if old not in text:
                  raise SystemExit(f"Guard failed: {old!r} not found in styles.xml")
              text = text.replace(old, new)
          styles.write_text(text)
          PY

          git diff --check

      - name: Commit guarded UI integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremiumAdultApp.kt \
                  app/src/main/java/com/sonharf/game/PremiumHomePolish.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeExperience.kt \
                  app/src/main/java/com/sonharf/game/MainSocialScreen.kt \
                  app/src/main/res/values/styles.xml
          git commit -m "ui: integrate dark native shell, IME and Siege HUD styling"
          git push origin HEAD:ui/native-dark-professional-20260921
