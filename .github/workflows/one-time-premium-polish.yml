name: One-time premium game entry polish

on:
  push:
    branches:
      - claude/son-harf-game-screen-design-bhju07

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply premium game entry polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/son-harf-game-screen-design-bhju07
          fetch-depth: 0
          persist-credentials: true

      - name: Apply focused UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          premier = Path('app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt')
          text = premier.read_text()

          old = '    val isPro = me?.isVip == true\n'
          if old not in text:
              raise SystemExit('Premier isPro anchor missing')
          text = text.replace(old, '', 1)

          old = '''                if (!veryCompact) {
                      Spacer(Modifier.height(primaryGap))
                      PremierHistoryDrawer(words, language, isPro)
                  }
          '''
          if old not in text:
              raise SystemExit('Premier history call anchor missing')
          text = text.replace(old, '''                Spacer(Modifier.height(primaryGap))
                  PremierHistoryDrawer(words, language)
          ''', 1)

          pattern = re.compile(
              r'@Composable\nprivate fun PremierHistoryDrawer\(words: List<GameWordDto>, language: String, isPro: Boolean\) \{.*?\n\}\n\n@Composable\nprivate fun PremierHowToDialog',
              re.S,
          )
          replacement = '''@Composable
          private fun PremierHistoryDrawer(words: List<GameWordDto>, language: String) {
              if (words.isEmpty()) {
                  Text(
                      pt(language, "İlk zinciri sen başlatabilirsin.", "You can start the first chain."),
                      color = PremierUi.Muted,
                      fontSize = 10.sp,
                  )
                  return
              }
              Surface(
                  modifier = Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(15.dp),
                  color = PremierUi.Surface,
                  border = BorderStroke(1.dp, PremierUi.Border),
              ) {
                  Column(Modifier.fillMaxWidth().padding(vertical = 8.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      Row(Modifier.fillMaxWidth().padding(horizontal = 11.dp), verticalAlignment = Alignment.CenterVertically) {
                          Icon(Icons.Rounded.History, null, tint = PremierUi.Ocean, modifier = Modifier.size(13.dp))
                          Spacer(Modifier.width(5.dp))
                          Text(
                              pt(language, "OYNANAN KELİMELER (${words.size})", "PLAYED WORDS (${words.size})"),
                              color = PremierUi.OceanDeep,
                              fontSize = 9.sp,
                              fontWeight = FontWeight.Black,
                          )
                      }
                      LazyRow(
                          Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(7.dp),
                          contentPadding = PaddingValues(horizontal = 10.dp),
                      ) {
                          items(words.reversed(), key = { it.id }) { entry ->
                              Surface(
                                  shape = RoundedCornerShape(11.dp),
                                  color = PremierUi.Ice,
                                  border = BorderStroke(1.dp, PremierUi.Border),
                              ) {
                                  Text(
                                      premierUpper(entry.normalizedWord.ifBlank { entry.word }, language),
                                      Modifier.padding(horizontal = 10.dp, vertical = 6.dp),
                                      color = PremierUi.OceanDeep,
                                      fontSize = 10.sp,
                                      fontWeight = FontWeight.Black,
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun PremierHowToDialog'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Premier history function replacement count={count}')
          premier.write_text(text)

          siege = Path('app/src/main/java/com/sonharf/game/WordSiegeExperience.kt')
          text = siege.read_text()
          old = '''        item {
                      Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                          Image(
                              painter = painterResource(R.drawable.kelime_kusatma_logo_hd),
                              contentDescription = sh("Kelime Tahtı logosu", "Kelime Tahtı logo"),
                              modifier = Modifier.size(96.dp),
                              contentScale = ContentScale.Fit,
                          )
                      }
                  }
          '''
          if old not in text:
              raise SystemExit('Word Siege logo block anchor missing')
          new = '''        item {
                      Surface(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(20.dp),
                          color = SiegePurpleSoft,
                          border = BorderStroke(1.dp, SiegePurple.copy(alpha = .18f)),
                      ) {
                          Row(Modifier.fillMaxWidth().padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                              Surface(shape = RoundedCornerShape(14.dp), color = SiegePurple.copy(alpha = .12f)) {
                                  Icon(Icons.Rounded.GridView, null, Modifier.padding(10.dp).size(24.dp), tint = SiegePurple)
                              }
                              Spacer(Modifier.width(10.dp))
                              Column(Modifier.weight(1f)) {
                                  Text(sh("TAKTİK ALAN SAVAŞI", "TACTICAL TERRITORY BATTLE"), color = MainUi.Text, fontSize = 12.sp, fontWeight = FontWeight.Black)
                                  Text(sh("Kelime kur • bölge ele geçir • haritayı yönet", "Build words • capture territory • control the map"), color = MainUi.Muted, fontSize = 9.sp)
                              }
                          }
                      }
                  }
          '''
          text = text.replace(old, new, 1)
          siege.write_text(text)

          brand = Path('app/src/test/java/com/sonharf/game/BrandStartupRegressionTest.kt')
          text = brand.read_text()
          old = '        assertTrue(siegeHub.contains("painterResource(R.drawable.kelime_kusatma_logo_hd)"))\n'
          if old not in text:
              raise SystemExit('Brand siege logo assertion missing')
          text = text.replace(old, '        assertFalse(siegeHub.contains("painterResource(R.drawable.kelime_kusatma_logo_hd)"))\n', 1)
          brand.write_text(text)

          arena_test = Path('app/src/test/java/com/sonharf/game/GameEntryArenaRegressionTest.kt')
          arena_test.write_text('''package com.sonharf.game

          import java.io.File
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class GameEntryArenaRegressionTest {
              @Test
              fun everyGameHasItsOwnIndependentEntryDestination() {
                  val shell = File("src/main/java/com/sonharf/game/PremiumUnifiedProApp.kt").readText()
                  val entries = File("src/main/java/com/sonharf/game/PremiumGameEntryScreens.kt").readText()

                  assertTrue(shell.contains("SIEGE_ENTRY, LAST_LETTER_ENTRY, LETTER_PATH_ENTRY"))
                  assertTrue(shell.contains("onPrimary = { destination = PremiumDestination.SIEGE_ENTRY }"))
                  assertTrue(shell.contains("onLastLetter = { destination = PremiumDestination.LAST_LETTER_ENTRY }"))
                  assertTrue(shell.contains("onLetterPath = { destination = PremiumDestination.LETTER_PATH_ENTRY }"))
                  assertTrue(entries.contains("PremiumSiegeEntryScreen"))
                  assertTrue(entries.contains("PremiumLastLetterEntryScreen"))
                  assertTrue(entries.contains("PremiumLetterPathEntryScreen"))
                  assertFalse(shell.contains("PremiumGameCenter("))
                  assertFalse(entries.contains("ARENA MERKEZİ"))
              }

              @Test
              fun eachEntryOffersTurkishAndEnglishWithoutLogoArtwork() {
                  val entries = File("src/main/java/com/sonharf/game/PremiumGameEntryScreens.kt").readText()

                  assertTrue(entries.contains("LanguageOption(\"tr\""))
                  assertTrue(entries.contains("LanguageOption(\"en\""))
                  assertTrue(entries.contains("TÜRKÇE DÜELLOYU BAŞLAT"))
                  assertTrue(entries.contains("TÜRKÇE KUŞATMAYA GİR"))
                  assertTrue(entries.contains("TÜRKÇE ROTAYI BAŞLAT"))
                  assertFalse(entries.contains("painterResource"))
                  assertFalse(entries.contains("R.drawable"))
              }

              @Test
              fun entriesExposeActualGameIdentityAndRules() {
                  val entries = File("src/main/java/com/sonharf/game/PremiumGameEntryScreens.kt").readText()

                  assertTrue(entries.contains("TAKTİK ALAN SAVAŞI"))
                  assertTrue(entries.contains("10 + 10"))
                  assertTrue(entries.contains("15→13→11"))
                  assertTrue(entries.contains("LetterPathPreview"))
              }
          }
          ''')

          history_test = Path('app/src/test/java/com/sonharf/game/SonHarfPlayedWordsVisibilityTest.kt')
          history_test.write_text('''package com.sonharf.game

          import java.io.File
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class SonHarfPlayedWordsVisibilityTest {
              @Test
              fun playedWordsAreVisibleToEveryPlayerOnEveryScreenSize() {
                  val screen = File("src/main/java/com/sonharf/game/PremierWordDuelScreen.kt").readText()

                  assertTrue(screen.contains("PremierHistoryDrawer(words, language)"))
                  assertTrue(screen.contains("OYNANAN KELİMELER"))
                  assertTrue(screen.contains("PLAYED WORDS"))
                  assertFalse(screen.contains("PremierHistoryDrawer(words, language, isPro)"))
                  assertFalse(screen.contains("PRO • Tüm oynanan kelimeler"))
                  assertFalse(screen.contains("PRO ÖZELLİĞİ"))
                  assertFalse(screen.contains("if (!veryCompact) {\\n                    Spacer(Modifier.height(primaryGap))\\n                    PremierHistoryDrawer"))
              }
          }
          ''')

      - name: Commit focused fixes
        shell: bash
        run: |
          git rm .github/workflows/one-time-premium-polish.yml
          git config user.name "son-harf-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeExperience.kt \
                  app/src/test/java/com/sonharf/game/BrandStartupRegressionTest.kt \
                  app/src/test/java/com/sonharf/game/GameEntryArenaRegressionTest.kt \
                  app/src/test/java/com/sonharf/game/SonHarfPlayedWordsVisibilityTest.kt
          git commit -m "Apply premium game entry polish"
          git push origin HEAD:claude/son-harf-game-screen-design-bhju07
