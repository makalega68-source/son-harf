name: Kelime Tahti Source Finalizer

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/kelime-tahti-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Kelime Tahti app source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def required_replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f"Required text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding='utf-8')

          required_replace(
              'app/src/main/AndroidManifest.xml',
              'android:label="Kelime Tahtı"',
              'android:label="@string/app_name"',
          )
          Path('app/src/main/res/values/strings.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Kelime Tahtı</string>\n</resources>\n',
              encoding='utf-8',
          )
          required_replace(
              'app/src/main/java/com/sonharf/game/MainActivity.kt',
              'Text(sh("SON HARF hazırlanıyor…", "Preparing SON HARF…"),',
              'Text(sh("Kelime Tahtı hazırlanıyor…", "Preparing Kelime Tahtı…"),',
          )
          required_replace(
              'app/src/main/java/com/sonharf/game/SonHarfBrandLogo.kt',
              'text = "SON",',
              'text = "KELİME",',
          )
          required_replace(
              'app/src/main/java/com/sonharf/game/SonHarfBrandLogo.kt',
              'text = " HARF",',
              'text = " TAHTI",',
          )

          runtime_root = Path('app/src/main/java/com/sonharf/game')
          for p in runtime_root.rglob('*.kt'):
              if p.name == 'UnifiedProApp.kt':
                  continue
              text = p.read_text(encoding='utf-8')
              updated = (text
                  .replace('KELİME KUŞATMASI', 'KELİME TAHTI')
                  .replace('Kelime Kuşatması', 'Kelime Tahtı')
                  .replace('WORD SIEGE', 'KELİME TAHTI')
                  .replace('Word Siege', 'Kelime Tahtı'))
              if updated != text:
                  p.write_text(updated, encoding='utf-8')

          required_replace('app/build.gradle.kts', 'versionCode = 30', 'versionCode = 31')
          required_replace('app/build.gradle.kts', 'versionName = "0.9.14"', 'versionName = "0.9.15"')

          # Update only tests whose old assertions directly conflict with the new app-name contract.
          for test_path in [
              'app/src/test/java/com/sonharf/game/BrandStartupRegressionTest.kt',
              'app/src/test/java/com/sonharf/game/KelimeKusatmasiPrimaryProductContractTest.kt',
          ]:
              p = Path(test_path)
              text = p.read_text(encoding='utf-8')
              text = text.replace(
                  'manifest.contains("android:label=\\\"Kelime Tahtı\\\"")',
                  'manifest.contains("android:label=\\\"@string/app_name\\\"")',
              )
              text = text.replace(
                  'title = sh(\\\"KELİME KUŞATMASI\\\", \\\"WORD SIEGE\\\")',
                  'title = sh(\\\"KELİME TAHTI\\\", \\\"KELİME TAHTI\\\")',
              )
              p.write_text(text, encoding='utf-8')
          PY

          # Source-level regression contract before committing.
          grep -Fq '<string name="app_name">Kelime Tahtı</string>' app/src/main/res/values/strings.xml
          grep -Fq 'android:label="@string/app_name"' app/src/main/AndroidManifest.xml
          grep -Fq 'Text(sh("Kelime Tahtı hazırlanıyor…", "Preparing Kelime Tahtı…"),' app/src/main/java/com/sonharf/game/MainActivity.kt
          grep -Fq 'text = "KELİME",' app/src/main/java/com/sonharf/game/SonHarfBrandLogo.kt
          grep -Fq 'text = " TAHTI",' app/src/main/java/com/sonharf/game/SonHarfBrandLogo.kt
          grep -Fq 'PremiumUnifiedProApp(' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -Fq '"SAVAŞA GİR"' app/src/main/java/com/sonharf/game/PremiumHomeV3.kt
          grep -Fq 'it.kind == "profile_frame"' app/src/main/java/com/sonharf/game/EconomyShopScreen.kt
          grep -Fq 'SonHarfCosmetics.applyAndPersist(context, nextEquipped)' app/src/main/java/com/sonharf/game/ProfileOwnedThemesSection.kt
          grep -Fq 'SonHarfCosmetics.restore(context)' app/src/main/java/com/sonharf/game/StableV1App.kt
          ! grep -Fq 'KELİME KUŞATMASI' app/src/main/java/com/sonharf/game/PremiumUnifiedProApp.kt
          ! grep -Fq 'Kelime Kuşatması' app/src/main/java/com/sonharf/game/EconomyShopScreen.kt
          grep -Fq 'versionCode = 31' app/build.gradle.kts
          grep -Fq 'versionName = "0.9.15"' app/build.gradle.kts
          git diff --check
          git status --short
      - name: Commit Kelime Tahti app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "release: finalize Kelime Tahtı branding"
          git push origin HEAD:main
