name: Mini 3D Mascot Build

on:
  push:
    branches: [ feat/mini-3d-mascot-20260822 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mini-3d-mascot-20260822
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Visibility contract checks
        run: |
          set -euxo pipefail
          grep -q 'MiniMascotGlobalOverlay()' app/src/main/java/com/sonharf/game/MainActivity.kt
          grep -q 'MiniMascot3D' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'MiniMood.HAPPY' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'MiniMood.SAD' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'MiniMood.STREAK' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'MiniMood.COLLECT' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'setZOrderOnTop(true)' app/src/main/java/com/sonharf/game/MiniMascot3D.kt
          grep -q 'backend.submitWord(active.id, submitted)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --warning-mode all
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all
      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Mini3D-Visible-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Mini3D-Visible-Test-APK
          path: SonHarf-Mini3D-Visible-Test.apk
          if-no-files-found: error
