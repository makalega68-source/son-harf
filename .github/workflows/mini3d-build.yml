name: Mini 3D Mascot Build

on:
  push:
    branches: [ feat/mini-3d-mascot-20260822 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mini-3d-mascot-20260822
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Contract checks
        run: |
          set -euxo pipefail
          grep -q 'MiniMascotMatchOverlay()' app/src/main/java/com/sonharf/game/SketchGameOverlayV9.kt
          grep -q 'GLSurfaceView.Renderer' app/src/main/java/com/sonharf/game/MiniMascot3D.kt
          grep -q 'EYE_BLUE' app/src/main/java/com/sonharf/game/MiniMascot3D.kt
          grep -q 'MiniMood.HAPPY' app/src/main/java/com/sonharf/game/MiniMascotMatchOverlay.kt
          grep -q 'MiniMood.SAD' app/src/main/java/com/sonharf/game/MiniMascotMatchOverlay.kt
          grep -q 'MiniMood.STREAK' app/src/main/java/com/sonharf/game/MiniMascotMatchOverlay.kt
          grep -q 'MiniMood.COLLECT' app/src/main/java/com/sonharf/game/MiniMascotMatchOverlay.kt
          grep -q 'backend.submitWord(active.id, submitted)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'onGoodWord' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --warning-mode all
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all
      - name: Publish tested APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SonHarf-Mini3D-Test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SonHarf-Mini3D-Test.apk
          git diff --cached --quiet || git commit -m "Publish tested Mini 3D mascot APK [skip ci]"
          git pull --rebase origin feat/mini-3d-mascot-20260822
          git push origin HEAD:feat/mini-3d-mascot-20260822
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Mini3D-Test-APK
          path: dist/SonHarf-Mini3D-Test.apk
          if-no-files-found: error
