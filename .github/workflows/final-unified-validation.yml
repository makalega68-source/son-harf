name: Historical Admin SonHarf APK Rebuild

on:
  push:
    branches:
      - rebuild/historical-admin-sonharf-566e9a41
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 566e9a41c5f2c2e72488ba70d90ab53c04b0bf7c
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Verify exact historical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "566e9a41c5f2c2e72488ba70d90ab53c04b0bf7c"
          grep -q 'ClassicPremiumApp()' app/src/main/java/com/sonharf/game/GamePortalApp.kt
          grep -q 'ClassicScreen.ADMIN -> AdminConsoleScreen' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'TargetNeonGameScreen' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'backend.getAdminDashboard(); true' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'Icons.Rounded.AdminPanelSettings' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'onClick = if (isAdmin) onAdmin else onProfile' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: APK integrity checks
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-AdminPanel-Historical-566e9a41-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
