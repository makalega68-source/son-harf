name: Final Unified Validation

on:
  push:
    branches:
      - integration/final-unified-20260827
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Unified Pro source policy checks
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          test ! -f app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          test ! -f app/src/main/java/com/sonharf/game/LiveDuelRuntimeShell.kt
          grep -q 'UnifiedProApp(' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'SonHarfCosmetics.restore(context)' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'val Background: Color get() = SonHarfTheme.Background' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'val Surface: Color get() = SonHarfTheme.Surface' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'lightColorScheme(' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'darkColorScheme(' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          ! grep -q 'MageCat' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.VIP -> UnifiedProVipScreen' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'PremierWordDuelScreen()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          ! grep -q 'ReactiveMageCatOverlay()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          ! grep -q 'PremierBoosterOverlay()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          grep -q 'private const val PREMIER_TURN_SECONDS = 15' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -q 'premierRemainingTurnSeconds' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          ! grep -q 'com.sonharf.game.mascot' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          test ! -d app/src/main/java/com/sonharf/game/mascot
          test ! -f app/src/main/res/drawable-nodpi/mage_cat_runtime.webp
          test -s app/src/main/res/raw/warm_beginnings.mp3
          grep -q 'multiplier_count' app/src/main/java/com/sonharf/game/data/VipEntitlements.kt
          grep -q 'use_premier_multiplier_v1' app/src/main/java/com/sonharf/game/data/PremierBoosters.kt
          grep -q "interval '20 seconds'" supabase/migrations/20260908155955_unified_pro_boosters_and_turn20.sql
          test -f supabase/migrations/20260910142500_premier_turn_15_seconds.sql
          grep -q "interval '15 seconds'" supabase/migrations/20260910142500_premier_turn_15_seconds.sql
          grep -qi 'on delete restrict' supabase/migrations/20260908155955_unified_pro_boosters_and_turn20.sql
          grep -q 'competitive_booster_disabled' supabase/migrations/20260909113000_restore_premier_fair_play_v1.sql
          grep -q "'ranked_live_assist', false" supabase/migrations/20260909113000_restore_premier_fair_play_v1.sql

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: APK integrity checks
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          echo ">> [PASS] Unified Pro debug APK built and verified"

      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Unified-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
