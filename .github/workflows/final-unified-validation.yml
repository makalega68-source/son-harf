name: Final Unified Validation

on:
  push:
    branches:
      - integration/final-unified-20260827
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Source policy checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DAILY_CIPHER' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'MASTERY' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'SonHarfTopAdBanner' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'SonHarfTopAdBanner(visible = !isGameplay, isPremium = isPremium)' app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          grep -q 'HAFTANIN EN İYİLERİ' app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          grep -q 'KLASİK' app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          ! grep -q 'OYUNCU MERKEZİ' app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          test ! -f app/src/main/java/com/sonharf/game/MascotSystem.kt
          test ! -f app/src/main/java/com/sonharf/game/MascotLive3DStage.kt
          test ! -f app/src/main/java/com/sonharf/game/ChibiGameBehaviorDirector.kt
          if grep -R -n -E 'Mascot(HomeCompanion|Live3DStage|Runtime|Catalog)|Chibi(GameBehaviorDirector)?' app/src/main/java/com/sonharf/game --include='*.kt'; then
            echo "::error::Mascot runtime reference found in active app source"
            exit 1
          fi

      - name: Apply Word Siege UI stabilization
        run: |
          python scripts/apply_word_siege_ui_fix_20260905.py
          git diff --check

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: APK policy checks
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          if unzip -l "$APK" | grep -Ei '(mascot|chibi)'; then
            echo "::error::Mascot artifact leaked into active APK"
            exit 1
          fi
          echo ">> [PASS] Mascot-free debug APK is built"

      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Final-Unified-PreRuntime-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
