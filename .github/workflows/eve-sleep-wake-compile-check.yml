name: Eve Sleep Wake Compile Check

on:
  push:
    branches:
      - integration/eve-sleep-wake-layout-20260827
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-sleep-wake-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Compile and run unit tests only
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace --warning-mode all 2>&1 | tee eve-sleep-wake-compile.log

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-sleep-wake-compile-log
          path: eve-sleep-wake-compile.log
          if-no-files-found: warn
