name: UX Lock V2

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-lock-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply UX lock v2 repairs
        run: python3 scripts/apply_ux_lock_v2.py
      - name: Verify protected UX contracts
        run: |
          ! grep -Fq 'RegressionGuardOverlay()' app/src/main/java/com/sonharf/game/MainActivity.kt
          grep -Fq 'hintLocales = LocaleList(Locale(if (room.language == "tr") "tr-TR" else "en-US"))' app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
          grep -Fq 'wordInput = ""' app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
          grep -Fq 'provisional_word' supabase/migrations/20260820_gameplay_dictionary_fallback.sql
          grep -Fq 'playerProfile?.avatarPath' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -Fq 'KAZANAN' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -Fq 'navigationBarsPadding().verticalScroll' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -Fq 'Color(0xFFFF76A8)' app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
          grep -Fq 'Color(0xFF439EF2)' app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
      - name: Compile debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all
      - name: Commit tested repairs
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/MainActivity.kt \
                  app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt \
                  app/src/main/java/com/sonharf/game/BilBakalimFeature.kt \
                  app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt \
                  app/src/main/java/com/sonharf/game/data/OnlineGameBackend.kt
          git diff --cached --quiet || git commit -m "Apply protected UX lock v2 repairs [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-ux-lock-v2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
