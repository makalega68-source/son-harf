name: Frame Provenance Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-frame-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify repository drawables and exact catalog mapping
        run: python scripts/verify_frame_provenance.py
      - name: Verify Unified Pro committed runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          test ! -f app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          test ! -f app/src/main/java/com/sonharf/game/LiveDuelRuntimeShell.kt
          grep -q 'UnifiedProApp(' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'SonHarfCosmetics.restore(context)' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'SonHarfTopAdBanner(isPremium = isPro)' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          ! grep -RqiE 'ProfHammy|Prof\. Hammy|prof_hammy' app/src/main/java app/src/main/res
          grep -q 'val Background: Color get() = SonHarfTheme.Background' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'lightColorScheme(' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'darkColorScheme(' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          ! grep -q 'MageCat' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.GAME -> OnlineGameScreenV6()' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.SIEGE -> WordSiegeExperienceScreen' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.LETTER -> LetterLadderGameScreen' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'PremierWordDuelScreen()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          ! grep -q 'PremierBoosterOverlay()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          ! grep -q 'ReactiveMageCatOverlay()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          ! grep -q 'com.sonharf.game.mascot' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -q 'premierRemainingTurnSeconds' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          test ! -d app/src/main/java/com/sonharf/game/mascot
          test ! -f app/src/main/res/drawable-nodpi/mage_cat_runtime.webp
          test -f supabase/migrations/20260909113000_restore_premier_fair_play_v1.sql
      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Verify compiled APK pixels against immutable purchased-source manifest
        run: python scripts/verify_frame_provenance.py --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Upload provenance-verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Provenance-Verified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
