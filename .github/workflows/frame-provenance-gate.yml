name: Frame Provenance Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  verify-frame-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify repository drawables and exact catalog mapping
        run: python scripts/verify_frame_provenance.py
      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Verify compiled APK pixels against immutable purchased-source manifest
        run: python scripts/verify_frame_provenance.py --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Upload provenance-verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Provenance-Verified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
