name: Temp Audit Final

on:
  push:
    branches:
      - audit/full-game-functional-20260827
    paths:
      - '.github/workflows/temp-audit-final.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Final audit assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TargetNeonGameScreen(autoStartMatchmaking = autoStartMatchmaking)' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'fun TargetNeonGameScreen(autoStartMatchmaking: Boolean = false)' app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
          grep -q 'currentWinStreak' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          ! grep -q '#12.450' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          ! grep -q '18 dk' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          ! grep -q 'streak.coerceAtLeast(4)' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'private fun comboV9' app/src/main/java/com/sonharf/game/ComboOverlayV9.kt
      - name: Unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
