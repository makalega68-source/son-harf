name: Materialize Canva Premium Assets
on:
  push:
    branches: [integration/v2-premium-corrected-final-20260919]
    paths:
      - 'tools/canva_product_icon_url_20260919.txt'
      - '.github/workflows/materialize-canva-premium-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v2-premium-corrected-final-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Download real Canva artwork sheet
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat tools/canva_product_icon_url_20260919.txt)"
          hi="${url/height:500/height:1200}"
          hi="${hi/width:400/width:1200}"
          if ! curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 "$hi" -o /tmp/canva-premium-sheet.png; then
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 "$url" -o /tmp/canva-premium-sheet.png
          fi
          file /tmp/canva-premium-sheet.png
          test -s /tmp/canva-premium-sheet.png
      - name: Crop four verified Canva product artworks
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import hashlib, json
          src=Image.open('/tmp/canva-premium-sheet.png').convert('RGBA')
          w,h=src.size
          # The verified Canva page is a 2x2 icon sheet: stopwatch, letter grid, score card, PRO laurels.
          boxes={
            'premium_series_game_canva.webp': (0,0,w//2,h//2),
            'premium_letter_table_canva.webp': (w//2,0,w,h//2),
            'premium_score_calculator_canva.webp': (0,h//2,w//2,h),
            'premium_pro_canva.webp': (w//2,h//2,w,h),
          }
          out=Path('app/src/main/res/drawable-nodpi'); out.mkdir(parents=True,exist_ok=True)
          manifest={'source_canva_design_id':'DAHVlfbi7x4','source_sheet_size':[w,h],'assets':{}}
          for name,box in boxes.items():
            im=src.crop(box)
            # keep actual Canva pixels; square with transparent padding, then lossless WebP.
            side=max(im.size)
            canvas=Image.new('RGBA',(side,side),(0,0,0,0))
            canvas.alpha_composite(im,((side-im.width)//2,(side-im.height)//2))
            if side < 768:
              canvas=canvas.resize((768,768),Image.Resampling.LANCZOS)
            p=out/name
            canvas.save(p,'WEBP',lossless=True,method=6)
            b=p.read_bytes()
            manifest['assets'][name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'size':list(canvas.size)}
            if len(b) < 1000 or len(b) > 2_000_000: raise SystemExit(f'bad asset size: {name} {len(b)}')
          Path('docs/CANVA_PREMIUM_ASSETS_V2.json').parent.mkdir(parents=True,exist_ok=True)
          Path('docs/CANVA_PREMIUM_ASSETS_V2.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Commit materialized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/premium_*_canva.webp docs/CANVA_PREMIUM_ASSETS_V2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(canva): add verified premium product artwork'
          git push origin HEAD:integration/v2-premium-corrected-final-20260919
