name: Logo First UI Pack

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Apply guarded product fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f"guard failed: {path}")
              p.write_text(s.replace(old,new,count if count is not None else -1))

          auth='app/src/main/java/com/sonharf/game/RequiredAuthGate.kt'
          replace(auth,
          '''                Box(\n                    Modifier.size(88.dp).scale(pulse).background(Brush.radialGradient(listOf(SonHarfCyan, SonHarfPurple)), CircleShape),\n                    contentAlignment = Alignment.Center,\n                ) { Text("S↻H", color = Color.White, fontWeight = FontWeight.Black, fontSize = 30.sp) }''',
          '''                SonHarfBrandLogo(modifier = Modifier.scale(pulse), size = 118.dp)''')

          portal='app/src/main/java/com/sonharf/game/GamePortalApp.kt'
          replace(portal,
          '''        ClassicPremiumApp()\n        if (MascotPolicy.ENABLED && MascotPolicy.SKELETAL_ASSET_READY) {\n            MascotBehaviorBridge()\n            Mascot3DLayer(Modifier.fillMaxSize())\n        }''',
          '''        ClassicPremiumApp()\n        // Maskot entegrasyonu bir sonraki özel aşamaya ertelendi.''')

          prefs='app/src/main/java/com/sonharf/game/SonHarfPreferences.kt'
          replace(prefs,
          'fun language(context: Context): String = prefs(context).getString(LANGUAGE, "tr")?.takeIf { it in setOf("tr", "en") } ?: "tr"',
          'fun language(context: Context): String = "tr"')
          replace(prefs,
          '''    fun setLanguage(context: Context, value: String) {\n        val normalized = if (value.lowercase() == "en") "en" else "tr"\n        prefs(context).edit().putString(LANGUAGE, normalized).apply(); SonHarfUiState.language = normalized\n    }''',
          '''    fun setLanguage(context: Context, value: String) {\n        prefs(context).edit().putString(LANGUAGE, "tr").apply()\n        SonHarfUiState.language = "tr"\n    }''')

          home='app/src/main/java/com/sonharf/game/PremiumMasterHome.kt'
          replace(home,'modifier = modifier.height(300.dp)','modifier = modifier.height(250.dp)',1)
          p=Path(home); s=p.read_text()
          start=s.index('@Composable private fun MasterBilBakalimCard')
          end=s.index('@Composable private fun MasterDailySeries',start)
          new='''@Composable private fun MasterBilBakalimCard(modifier:Modifier,onPlay:()->Unit){\n    Card(onClick=onPlay,modifier=modifier.height(205.dp),shape=RoundedCornerShape(24.dp),colors=CardDefaults.cardColors(containerColor=Color.Transparent),border=BorderStroke(1.5.dp,MasterBlue2)){\n        Box(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Color(0xFFF4FDFF),Color(0xFFDDF6FF),Color.White))).padding(horizontal=14.dp,vertical=10.dp)){\n            Column(Modifier.fillMaxSize(),horizontalAlignment=Alignment.CenterHorizontally,verticalArrangement=Arrangement.SpaceEvenly){\n                Row(verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(8.dp)){ Text("💡",fontSize=25.sp); Text("BİL BAKALIM",color=MasterInk,fontSize=24.sp,fontWeight=FontWeight.Black,maxLines=1,softWrap=false) }\n                Text("Doğru cevaba en yakın tahmin kazanır!",modifier=Modifier.fillMaxWidth(),color=MasterInk,fontSize=10.sp,textAlign=TextAlign.Center,maxLines=1)\n                Surface(shape=RoundedCornerShape(14.dp),color=MasterSky,border=BorderStroke(1.dp,MasterLine)){ Text("TÜRKÇE  •  ENGLISH",Modifier.padding(horizontal=12.dp,vertical=5.dp),color=MasterBlue,fontSize=8.sp,fontWeight=FontWeight.Black,maxLines=1) }\n                Surface(shape=RoundedCornerShape(16.dp),color=MasterBlue){ Text("BUGÜNÜN MEYDAN OKUMASI",Modifier.padding(horizontal=11.dp,vertical=6.dp),color=Color.White,fontSize=8.sp,fontWeight=FontWeight.Black,maxLines=1,softWrap=false) }\n                Button(onClick=onPlay,modifier=Modifier.fillMaxWidth().height(42.dp),shape=RoundedCornerShape(16.dp),colors=ButtonDefaults.buttonColors(containerColor=MasterBlue),contentPadding=PaddingValues(horizontal=10.dp)){ Icon(Icons.Rounded.PlayArrow,null,modifier=Modifier.size(20.dp)); Spacer(Modifier.width(5.dp)); Text("HEMEN OYNA",fontWeight=FontWeight.Black,fontSize=12.sp,maxLines=1,softWrap=false) }\n            }\n        }\n    }\n}\n\n'''
          p.write_text(s[:start]+new+s[end:])

          Path('app/src/main/java/com/sonharf/game/SonHarfBrandLogo.kt').write_text('''package com.sonharf.game\n\nimport androidx.compose.foundation.Image\nimport androidx.compose.foundation.layout.size\nimport androidx.compose.runtime.Composable\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.res.painterResource\nimport androidx.compose.ui.unit.Dp\nimport androidx.compose.ui.unit.dp\n\n@Composable\nfun SonHarfBrandLogo(modifier: Modifier = Modifier, size: Dp = 52.dp) {\n    Image(\n        painter = painterResource(R.drawable.son_harf_brand_logo),\n        contentDescription = "Son Harf Maskot",\n        contentScale = ContentScale.Fit,\n        modifier = modifier.size(size),\n    )\n}\n''')
          PY
          rm -f .github/workflows/logo-first-ui-pack.yml

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '@drawable/son_harf_brand_logo' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/son_harf_brand_logo.webp
          grep -q 'R.drawable.son_harf_brand_logo' app/src/main/java/com/sonharf/game/SonHarfBrandLogo.kt
          grep -q 'SonHarfBrandLogo' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          ! grep -q 'S↻H' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          ! grep -q 'Mascot3DLayer(Modifier.fillMaxSize())' app/src/main/java/com/sonharf/game/GamePortalApp.kt
          ! grep -q 'MascotCardPreview' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'modifier.height(250.dp)' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'modifier.height(205.dp)' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'bilBakalimQuestionsEn' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -q 'TÜRKÇE' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -q 'ENGLISH' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt

      - name: Test and build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee logo-ui-build.log

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "son-harf-ci"
          git config user.email "son-harf-ci@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: unify approved logo and compact Turkish home UI"
          git push origin HEAD:${{ github.head_ref }}

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Logo-UI-Guncel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Logo-UI-Guncel-APK
          path: SonHarf-Logo-UI-Guncel.apk
