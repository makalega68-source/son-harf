name: Final UI Bil Bakalim Mascot

on:
  push:
    branches: [ fix/final-ui-bilbakalim-mascot-20260824 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: final-ui-bil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.event_name == 'push' || github.head_ref == 'fix/final-ui-bilbakalim-mascot-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-ui-bilbakalim-mascot-20260824
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Apply guarded final UI pack
        run: |
          if grep -q 'bilBakalimQuestionsEn' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt && \
             grep -q 'MascotCardPreview' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt && \
             grep -q 'modifier.height(250.dp)' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt; then
            echo "Final UI pack already applied; verification-only run."
          else
            python3 scripts/apply_final_ui_bilbakalim_pack.py
          fi

      - name: Contract checks
        run: |
          set -euxo pipefail
          grep -q 'SonHarfUiState.language = "tr"' app/src/main/java/com/sonharf/game/SonHarfPreferences.kt
          grep -q 'bilBakalimQuestionsEn' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -q 'TÜRKÇE' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -q 'ENGLISH' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -q 'BUGÜNÜN MEYDAN OKUMASI' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'modifier.height(300.dp)' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'modifier.height(250.dp)' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'MascotCardPreview' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'models/son_harf_white_pet_rigged.glb' app/src/main/java/com/sonharf/game/MascotPolicy.kt
          grep -q 'decode(remoteBytes) ?:' app/src/main/java/com/sonharf/game/SonHarfBrandLogo.kt

      - name: Test and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee final-ui-build.log

      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremiumMasterHome.kt \
                  app/src/main/java/com/sonharf/game/BilBakalimFeature.kt \
                  app/src/main/java/com/sonharf/game/SonHarfBrandLogo.kt \
                  app/src/main/java/com/sonharf/game/SonHarfPreferences.kt \
                  app/src/main/java/com/sonharf/game/MascotCardPreview.kt
          git diff --cached --quiet || git commit -m "Apply final Turkish UI Bil Bakalim mascot pack [skip ci]"
          git push

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Guncel-TR-EN-Maskot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Guncel-TR-EN-Maskot-APK
          path: SonHarf-Guncel-TR-EN-Maskot.apk
          if-no-files-found: error

      - name: Publish failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Final-UI-Failure-Log
          path: final-ui-build.log
          if-no-files-found: ignore
