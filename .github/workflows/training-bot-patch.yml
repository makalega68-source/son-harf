name: Training bot scoped patch
on:
  push:
    branches:
      - "feat/training-bots-ownership-20260831"
    paths:
      - ".github/workflows/training-bot-patch.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/training-bots-ownership-20260831"
      - name: Patch DTO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/sonharf/game/data/OnlineGameBackend.kt')
          t=p.read_text()
          old='    @SerialName("bot_name") val botName: String? = null,\n    @SerialName("bot_turn") val botTurn: Boolean = false,'
          new='    @SerialName("bot_name") val botName: String? = null,\n    @SerialName("bot_difficulty") val botDifficulty: String = "normal",\n    @SerialName("bot_turn") val botTurn: Boolean = false,'
          if old not in t: raise SystemExit('target missing')
          p.write_text(t.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/sonharf/game/data/OnlineGameBackend.kt
          git commit -m "feat(training): expose server bot difficulty"
          git push origin HEAD:feat/training-bots-ownership-20260831
