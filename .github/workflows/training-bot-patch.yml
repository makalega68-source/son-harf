name: Training bot scoped patch
on:
  push:
    branches:
      - "feat/training-bots-ownership-20260831"
    paths:
      - ".github/workflows/training-bot-patch.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/training-bots-ownership-20260831"
      - name: Apply staged patch
        run: python3 scripts/patch_online_training.py
      - name: Commit scoped edit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          git commit -m "feat(training): disclose Son Harf bot matches"
          git push origin HEAD:feat/training-bots-ownership-20260831
