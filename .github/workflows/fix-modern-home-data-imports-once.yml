name: Fix Modern Home Data Imports Once

on:
  push:
    branches:
      - ui/purchased-pack-quality-repair-20260921

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix exact data imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sonharf/game/ModernHomeScreen.kt')
          s = p.read_text()
          old = '''import com.sonharf.game.data.GrowthDashboardDto
          import com.sonharf.game.data.OnlineGameBackend
          import com.sonharf.game.data.ProfileDto
          import com.sonharf.game.data.WeeklyTopPlayerV210'''
          new = 'import com.sonharf.game.data.*'
          if old not in s:
              raise SystemExit('expected ModernHomeScreen import block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q '^import com.sonharf.game.data.\*$' app/src/main/java/com/sonharf/game/ModernHomeScreen.kt

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-modern-home-data-imports-once.yml
          git add app/src/main/java/com/sonharf/game/ModernHomeScreen.kt
          git commit -m "fix: resolve modern home backend extensions"
          git push origin HEAD:ui/purchased-pack-quality-repair-20260921
