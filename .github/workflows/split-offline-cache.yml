name: Split offline Android cache

on:
  push:
    branches: [recovery/import-80b5099]
    paths: [.github/workflows/split-offline-cache.yml]

permissions:
  actions: read
  contents: read

jobs:
  split-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing offline cache artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache"
          gh run download 34811491337 \
            --repo "$GITHUB_REPOSITORY" \
            --name android-offline-build-cache-8.14.4-agp8.12.1 \
            --dir "$RUNNER_TEMP/cache"
          test -s "$RUNNER_TEMP/cache/android-offline-cache.tar.zst"
          cat "$RUNNER_TEMP/cache/android-offline-cache.sha256"
          sha256sum -c "$RUNNER_TEMP/cache/android-offline-cache.sha256"

      - name: Split cache into connector-safe parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 300M -d -a 2 \
            "$RUNNER_TEMP/cache/android-offline-cache.tar.zst" \
            "$RUNNER_TEMP/parts/cache.part."
          cp "$RUNNER_TEMP/cache/android-offline-cache.sha256" "$RUNNER_TEMP/parts/"
          sha256sum "$RUNNER_TEMP/parts"/cache.part.* > "$RUNNER_TEMP/parts/parts.sha256"
          ls -lh "$RUNNER_TEMP/parts"
          test -f "$RUNNER_TEMP/parts/cache.part.00"
          test -f "$RUNNER_TEMP/parts/cache.part.01"
          test -f "$RUNNER_TEMP/parts/cache.part.02"
          test -f "$RUNNER_TEMP/parts/cache.part.03"

      - uses: actions/upload-artifact@v4
        with:
          name: offline-cache-part-00
          path: ${{ runner.temp }}/parts/cache.part.00
          compression-level: 0
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: offline-cache-part-01
          path: ${{ runner.temp }}/parts/cache.part.01
          compression-level: 0
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: offline-cache-part-02
          path: ${{ runner.temp }}/parts/cache.part.02
          compression-level: 0
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: offline-cache-part-03
          path: |
            ${{ runner.temp }}/parts/cache.part.03
            ${{ runner.temp }}/parts/android-offline-cache.sha256
            ${{ runner.temp }}/parts/parts.sha256
          compression-level: 0
          retention-days: 3
