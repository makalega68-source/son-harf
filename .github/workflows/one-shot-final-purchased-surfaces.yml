name: One-shot final purchased surfaces

on:
  push:
    branches:
      - ui/real-purchased-pack-full-overhaul-20260921

permissions:
  contents: write

jobs:
  patch-surfaces:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/real-purchased-pack-full-overhaul-20260921
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Remove synthetic loading percentage from patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch-final-purchased-surfaces.py')
          s = p.read_text()
          old = '            PurchasedProgress(0.45f, Modifier.fillMaxWidth())'
          new = '            PurchasedPanel(modifier = Modifier.fillMaxWidth(), asset = PurchasedUiAsset.PANEL_SMALL, contentPadding = PaddingValues(12.dp)) { Text(sh("PRO bilgileri yükleniyor…", "Loading PRO details…"), modifier = Modifier.fillMaxWidth(), color = Color(0xFF765746), fontSize = 10.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center) }'
          if old not in s:
              raise SystemExit('Synthetic PRO loading token not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Patch final active purchased surfaces
        run: python3 .github/scripts/patch-final-purchased-surfaces.py

      - name: Test and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit final purchased surfaces
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-final-purchased-surfaces.yml .github/scripts/patch-final-purchased-surfaces.py
          git add app/src/main/java/com/sonharf/game/PremiumHomePolish.kt app/src/main/java/com/sonharf/game/ProfileFramesV2.kt app/src/main/java/com/sonharf/game/UnifiedProVipScreen.kt app/src/test/java/com/sonharf/game/PurchasedFinalSurfaceContractTest.kt
          git commit -m "ui: finish purchased home store and pro surfaces"
          git push origin HEAD:ui/real-purchased-pack-full-overhaul-20260921
