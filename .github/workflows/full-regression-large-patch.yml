name: Full Regression Large Patch

on:
  push:
    branches: [ fix/full-regression-audit-20260920 ]
    paths:
      - 'tools/full-regression-large-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-regression-audit-20260920
          fetch-depth: 0
      - name: Apply exact-match gameplay patch
        run: python tools/apply_full_regression_large_patch.py
      - name: Validate patch syntax and contracts
        run: |
          git diff --check
          grep -n 'PremiumDestination.PRO' app/src/main/java/com/sonharf/game/PremiumUnifiedProApp.kt
          grep -n 'PremiumDestination.PRIVATE_ROOM' app/src/main/java/com/sonharf/game/PremiumUnifiedProApp.kt
          grep -n 'PRO ARAÇLARINI AÇ' app/src/main/java/com/sonharf/game/EconomyShopScreen.kt
          grep -n "Kelime Kuşatması'na davet edildi" app/src/main/java/com/sonharf/game/MainSocialScreen.kt
          grep -n '"siege" -> sh("Kelime Kuşatması", "Word Siege")' app/src/main/java/com/sonharf/game/PremiumAnalysisCenter.kt
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremiumUnifiedProApp.kt \
                  app/src/main/java/com/sonharf/game/EconomyShopScreen.kt \
                  app/src/main/java/com/sonharf/game/MainSocialScreen.kt \
                  app/src/main/java/com/sonharf/game/PremiumAnalysisCenter.kt
          git commit -m "Wire PRO tools into active runtime [skip ci]"
          git push origin HEAD:fix/full-regression-audit-20260920
