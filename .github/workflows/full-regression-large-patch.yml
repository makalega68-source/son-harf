name: Full Regression Large Patch

on:
  push:
    branches: [ fix/full-regression-audit-20260920 ]
    paths:
      - 'tools/full-regression-large-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-regression-audit-20260920
          fetch-depth: 0
      - name: Apply exact-match gameplay patch
        run: python tools/apply_full_regression_large_patch.py
      - name: Validate patch syntax and contracts
        run: |
          git diff --check
          grep -n 'for (attempt in 0 until 16)' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          ! grep -n 'return@repeat' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -n 'KELİME KUŞATMASI' app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          grep -n 'verifiedAccess = true' app/src/main/java/com/sonharf/game/WordSiegeEntryScreen.kt
          grep -n 'Kelime Kuşatması.*Android' app/src/main/java/com/sonharf/game/MainSettingsVipScreen.kt
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeExperience.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeSeriesScreen.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeEntryScreen.kt \
                  app/src/main/java/com/sonharf/game/GooglePlayProductsCard.kt \
                  app/src/main/java/com/sonharf/game/MainSettingsVipScreen.kt
          git commit -m "Fix rematch, Series access and active screen copy [skip ci]"
          git push origin HEAD:fix/full-regression-audit-20260920
