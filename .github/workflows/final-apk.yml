name: Final Son Harf APK

on:
  push:
    paths:
      - '.github/workflows/final-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Final.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Final-APK
          path: SonHarf-Final.apk
          if-no-files-found: error
