name: 3D Pet Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.pet_asset_chunks/**'
      - '.github/workflows/pet-3d-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct animated 3D pet asset
        shell: bash
        run: |
          mkdir -p app/src/main/assets/models
          cat .pet_asset_chunks/part_*.txt | tr -d '\n\r' | base64 -d > app/src/main/assets/models/sonharf_pet_white_walk.glb
          test -s app/src/main/assets/models/sonharf_pet_white_walk.glb
          ls -lh app/src/main/assets/models/sonharf_pet_white_walk.glb

      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SonHarf-3D-Pet-Test.apk
          sha256sum dist/SonHarf-3D-Pet-Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-3d-pet-apk
          path: dist/SonHarf-3D-Pet-Test.apk
          retention-days: 30
