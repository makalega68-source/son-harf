name: Kelime Kusatmasi Practice Viewport Fix

on:
  push:
    branches:
      - claude/kelime-tahti-home-redesign-7ojb7d
    paths:
      - '.github/workflows/kelime-kusatmasi-practice-viewport-fix.yml'
      - 'tools/fix_practice_board_kelime_viewport.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-practice-viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: claude/kelime-tahti-home-redesign-7ojb7d
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Apply practice viewport correction
        run: python3 tools/fix_practice_board_kelime_viewport.py

      - name: Unit tests and debug APK
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Commit verified practice viewport fix
        shell: bash
        run: |
          git config user.name "kelime-tahti-ci"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeBoardViewport.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeGameUi.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix practice board fullscreen zoom behavior"
            git push origin HEAD:claude/kelime-tahti-home-redesign-7ojb7d
          fi

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p final-apk
          cp app/build/outputs/apk/debug/app-debug.apk final-apk/Kelime-Tahti-Practice-Viewport-Fix.apk
          sha256sum final-apk/Kelime-Tahti-Practice-Viewport-Fix.apk > final-apk/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-tahti-practice-viewport-fix-apk
          path: final-apk/
          if-no-files-found: error
          retention-days: 7
