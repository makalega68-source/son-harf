name: Purchased UI Screen Patch Once

on:
  push:
    branches:
      - ui/real-purchased-pack-full-overhaul-20260921
    paths:
      - .github/workflows/purchased-ui-screen-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/real-purchased-pack-full-overhaul-20260921
          fetch-depth: 0
      - name: Apply exact visual-only patch
        run: python scripts/apply_purchased_ui_screen_patch.py
      - name: Verify protected gameplay contracts were not removed
        run: |
          grep -F 'WordSiegeBoardSpec.Size' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          grep -F 'WordSiegeFinalRules.currentTerritoryScore' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          grep -F 'for (move in 1 until LetterLadderEngine.MOVE_COUNT)' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          grep -F 'EmbeddedWordKeyboard(' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
      - name: Commit screen overhaul
        run: |
          if git diff --quiet; then
            echo 'No changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          git commit -m 'ui: reskin siege and letter path with purchased assets'
          git push origin HEAD:ui/real-purchased-pack-full-overhaul-20260921
