name: Purchased UI Siege Repair Once

on:
  push:
    branches:
      - ui/real-purchased-pack-full-overhaul-20260921
    paths:
      - .github/workflows/purchased-ui-screen-patch-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/real-purchased-pack-full-overhaul-20260921
          fetch-depth: 0
      - name: Repair exact siege composable structure
        run: python scripts/apply_purchased_ui_screen_patch.py
      - name: Verify protected gameplay and purchased UI contracts
        run: |
          grep -F 'delay(WORD_SIEGE_BOT_FALLBACK_DELAY_MS)' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          grep -F 'WordSiegePracticeScreen(' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          grep -F 'WordSiegeBoardSpec.Size' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          grep -F 'WordSiegeFinalRules.currentTerritoryScore' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          grep -F 'PurchasedUiAsset.ICON_SWORDS' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          grep -F 'HAMLEYİ ONAYLA' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
      - name: Commit repaired siege screen
        run: |
          if git diff --quiet; then
            echo 'No repair changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          git commit -m 'fix: restore siege composable structure and fallback'
          git push origin HEAD:ui/real-purchased-pack-full-overhaul-20260921
