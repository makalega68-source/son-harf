name: APK V2 Refresh Verify

on:
  push:
    branches:
      - ui/user-apk-v2-refresh-20260921
      - ui/native-dark-professional-20260921
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-v2-refresh-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-apk-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Verify exact APK-v2 source line
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          git merge-base --is-ancestor e66eec3b0d33e7419aa46686490a04dac57b680b HEAD
          grep -q 'PremiumAdultApp(onSignedOut' app/src/main/java/com/sonharf/game/StableV1App.kt
          test -f app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
          test -f app/src/main/java/com/sonharf/game/ProfileFramesV2.kt
          test -f app/src/main/java/com/sonharf/game/PremiumStoreScreen.kt
          ! grep -q 'TEMİZLE' app/src/main/java/com/sonharf/game/SharedInputPrimitives.kt
          ! grep -q 'CLEAR' app/src/main/java/com/sonharf/game/SharedInputPrimitives.kt

      - name: Verify native professional UI contract
        shell: bash
        run: |
          set -euo pipefail
          COLOR=app/src/main/java/com/sonharf/game/Color.kt
          SHELL=app/src/main/java/com/sonharf/game/PremiumAdultApp.kt
          SIEGE=app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          PACK=app/src/main/java/com/sonharf/game/NativePackVisuals.kt
          for token in 141923 1E2538 2ECC71 3498DB 9B59B6 E67E22 ECF0F1 95A5A6; do
            grep -q "$token" "$COLOR"
          done
          grep -q 'darkColorScheme' "$SHELL"
          grep -q 'typography = AppTypography' "$SHELL"
          grep -q 'height(64.dp)' "$SHELL"
          grep -q 'imePadding()' "$SHELL"
          grep -q 'ImeAction.Send' "$SIEGE"
          ! grep -q '0xFFFFE3A5' "$SIEGE"
          ! grep -q '0xFFD99818' "$SIEGE"
          grep -q 'ui_ranking_icon' "$PACK"
          grep -q 'ui_legacy_rank_frame' "$PACK"
          grep -q 'vfx_twinkle' "$PACK"
          test -f app/src/main/res/drawable-nodpi/ui_ranking_icon.webp
          test -f app/src/main/res/drawable-nodpi/ui_legacy_rank_frame.webp
          test -f app/src/main/res/drawable-nodpi/vfx_twinkle.png

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Kusatmasi-Native-Dark-Professional
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
