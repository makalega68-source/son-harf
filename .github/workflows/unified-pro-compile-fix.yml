name: Unified Pro Compile Fix

on:
  push:
    branches: ["reset/son-harf-game-clean-slate"]
    paths:
      - "ci/unified-pro-compile-fix-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reset/son-harf-game-clean-slate
          fetch-depth: 0

      - name: Remove remaining classic palette dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ladder = Path('app/src/main/java/com/sonharf/game/LetterLadderGame.kt')
          s = ladder.read_text()
          names = sorted(set(re.findall(r'MonsterUi\.([A-Za-z0-9_]+)', s)))
          allowed = {
              'Background','Surface','SurfaceRaised','SurfaceSoft','Text','Muted','Border',
              'Accent','AccentText','Live','Coral','Orange','Green','Gold'
          }
          unknown = set(names) - allowed
          if unknown:
              raise SystemExit(f'Unknown MonsterUi members in LetterLadderGame: {sorted(unknown)}')
          if 'MonsterUi.' not in s:
              raise SystemExit('No MonsterUi dependency found; refusing stale patch')
          s = s.replace('MonsterUi.', 'LetterLadderUi.')
          marker = 'internal data class LetterLadderPuzzle('
          palette = '''private object LetterLadderUi {
              val Background: Color get() = SonHarfTheme.Background
              val Surface: Color get() = SonHarfTheme.Surface
              val SurfaceRaised: Color get() = SonHarfTheme.Surface
              val SurfaceSoft: Color get() = SonHarfTheme.SurfaceSecondary
              val Text: Color get() = SonHarfTheme.TextPrimary
              val Muted: Color get() = SonHarfTheme.TextSecondary
              val Border: Color get() = SonHarfTheme.Border
              val Accent: Color get() = SonHarfTheme.PrimaryBlue
              val AccentText: Color get() = Color.White
              val Live: Color get() = SonHarfTheme.Error
              val Coral: Color get() = SonHarfTheme.Error
              val Orange: Color get() = SonHarfTheme.Warning
              val Green: Color get() = SonHarfTheme.Success
              val Gold: Color get() = SonHarfTheme.Warning
          }

          '''
          if marker not in s:
              raise SystemExit('LetterLadderPuzzle insertion marker not found')
          s = s.replace(marker, palette + marker, 1)
          if 'MonsterUi.' in s:
              raise SystemExit('Classic MonsterUi dependency remains in LetterLadderGame')
          ladder.write_text(s)

          overlay = Path('app/src/main/java/com/sonharf/game/PremierBoosterOverlay.kt')
          o = overlay.read_text()
          old = '.padding(horizontal = 14.dp, bottom = 214.dp)'
          new = '.padding(start = 14.dp, end = 14.dp, bottom = 214.dp)'
          if old not in o:
              raise SystemExit('Premier booster padding hook not found')
          o = o.replace(old, new, 1)
          overlay.write_text(o)
          PY

      - name: Commit compile fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/LetterLadderGame.kt app/src/main/java/com/sonharf/game/PremierBoosterOverlay.kt
          git diff --cached --check
          git commit -m "fix: detach Harf Yolu from retired classic palette"
          git push origin HEAD:reset/son-harf-game-clean-slate
