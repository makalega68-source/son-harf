name: Secure Match Patch Validation

on:
  push:
    branches: [ feature/secure-bonus-competition-20260903 ]
    paths:
      - 'tools/apply_secure_match_patch.py'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/secure-bonus-competition-20260903
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply exact-match patch
        run: python tools/apply_secure_match_patch.py
      - name: Static diff checks
        run: |
          git diff --check
          ! grep -n 'LightActionButton("★ BONUS".*{ }' app/src/main/java/com/sonharf/game/LightDuelUi.kt
          ! grep -n 'val options = listOf(question.optionA' app/src/main/java/com/sonharf/game/LightDuelUi.kt
          grep -n 'KeyboardType.Number' app/src/main/java/com/sonharf/game/LightDuelUi.kt
          grep -n 'submitVoiceWord' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
      - name: Unit tests and debug build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee secure-match-build.log
      - name: Commit verified source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt app/src/main/java/com/sonharf/game/LightDuelUi.kt
          git commit -m "Secure bonus voice and ranked fairness [skip ci]"
          git push origin HEAD:feature/secure-bonus-competition-20260903
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-secure-match-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: secure-match-validation-log
          path: secure-match-build.log
          if-no-files-found: error
