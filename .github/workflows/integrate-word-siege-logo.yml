name: Integrate Word Siege logo

on:
  push:
    branches: [ integrate-word-siege-logo ]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-word-siege-logo
          fetch-depth: 0
      - name: Apply logo integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          monster = Path('app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt')
          text = monster.read_text(encoding='utf-8')

          old = 'import androidx.compose.foundation.BorderStroke\n'
          new = 'import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.Image\n'
          assert old in text, 'Monster Image import anchor missing'
          text = text.replace(old, new, 1)

          old = 'import androidx.compose.ui.graphics.vector.ImageVector\n'
          new = 'import androidx.compose.ui.graphics.vector.ImageVector\nimport androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.res.painterResource\n'
          assert old in text, 'Monster resource import anchor missing'
          text = text.replace(old, new, 1)

          old = '                MonsterQuickCard(sh("KELİME\\nKUŞATMASI", "WORD\\nSIEGE"), sh("Alanı ele geçir", "Capture territory"), Icons.Rounded.GridView, MonsterUi.Gold, Modifier.weight(1f), onSiege)'
          new = '                MonsterSiegeQuickCard(Modifier.weight(1f), onSiege)'
          assert old in text, 'Monster siege card anchor missing'
          text = text.replace(old, new, 1)

          anchor = '''@Composable
          private fun MonsterQuickCard(title: String, subtitle: String, icon: ImageVector, accent: Color, modifier: Modifier, onClick: () -> Unit) {'''
          replacement = '''@Composable
          private fun MonsterSiegeQuickCard(modifier: Modifier, onClick: () -> Unit) {
              Surface(
                  modifier = modifier.height(128.dp).clickable(onClick = onClick),
                  shape = RoundedCornerShape(18.dp),
                  color = MonsterUi.SurfaceRaised,
                  border = BorderStroke(1.dp, MonsterUi.Border),
              ) {
                  Column(
                      Modifier.fillMaxSize().padding(11.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween,
                  ) {
                      Image(
                          painter = painterResource(R.drawable.kelime_kusatma_logo),
                          contentDescription = sh("Kelime Kuşatması", "Word Siege"),
                          modifier = Modifier.size(72.dp),
                          contentScale = ContentScale.Fit,
                      )
                      Text(
                          sh("Alanı ele geçir", "Capture territory"),
                          color = MonsterUi.Muted,
                          fontSize = 8.sp,
                          fontWeight = FontWeight.Bold,
                      )
                  }
              }
          }

          @Composable
          private fun MonsterQuickCard(title: String, subtitle: String, icon: ImageVector, accent: Color, modifier: Modifier, onClick: () -> Unit) {'''
          assert anchor in text, 'Monster quick card function anchor missing'
          text = text.replace(anchor, replacement, 1)
          monster.write_text(text, encoding='utf-8')

          siege = Path('app/src/main/java/com/sonharf/game/WordSiegeExperience.kt')
          text = siege.read_text(encoding='utf-8')

          old = 'import androidx.compose.foundation.BorderStroke\n'
          new = 'import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.Image\n'
          assert old in text, 'Siege Image import anchor missing'
          text = text.replace(old, new, 1)

          old = 'import androidx.compose.ui.graphics.Color\n'
          new = 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.res.painterResource\n'
          assert old in text, 'Siege resource import anchor missing'
          text = text.replace(old, new, 1)

          anchor = '''                IconButton(onClick = onRefresh, enabled = !loading) {
                      Icon(Icons.Rounded.Refresh, sh("Yenile", "Refresh"), tint = MainUi.Blue)
                  }
              }
          }

          item {
              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {'''
          replacement = '''                IconButton(onClick = onRefresh, enabled = !loading) {
                      Icon(Icons.Rounded.Refresh, sh("Yenile", "Refresh"), tint = MainUi.Blue)
                  }
              }
          }

          item {
              Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                  Image(
                      painter = painterResource(R.drawable.kelime_kusatma_logo),
                      contentDescription = sh("Kelime Kuşatması logosu", "Word Siege logo"),
                      modifier = Modifier.size(96.dp),
                      contentScale = ContentScale.Fit,
                  )
              }
          }

          item {
              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {'''
          assert anchor in text, 'Word Siege list header anchor missing'
          text = text.replace(anchor, replacement, 1)
          siege.write_text(text, encoding='utf-8')
          PY

          test -f app/src/main/res/drawable-nodpi/kelime_kusatma_logo.webp
          grep -q 'MonsterSiegeQuickCard' app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          grep -q 'R.drawable.kelime_kusatma_logo' app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          git diff --check

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-word-siege-logo.yml
          git add app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          git commit -m "Integrate Kelime Kusatma logo into game UI"
          git push origin HEAD:integrate-word-siege-logo
