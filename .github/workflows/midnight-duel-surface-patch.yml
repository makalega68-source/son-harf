name: Midnight Duel Surface Patch

on:
  push:
    branches:
      - feat/premium-style-private-room-bot-ui-20260831

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[midnight-surface-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-style-private-room-bot-ui-20260831
          fetch-depth: 0
      - name: Replace hardcoded light duel surfaces
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/sonharf/game/LightDuelUi.kt')
          s = p.read_text()
          replacements = [
              ('Brush.radialGradient(listOf(LBlueSoft, Color.White, Color(0xFFF8FAFD)))', 'Brush.radialGradient(listOf(LBlueSoft, LCard, LBg))'),
              ('Box(Modifier.fillMaxSize().clip(CircleShape).background(Color.White), contentAlignment = Alignment.Center)', 'Box(Modifier.fillMaxSize().clip(CircleShape).background(LCard), contentAlignment = Alignment.Center)'),
              ('focusedContainerColor = Color.White, unfocusedContainerColor = Color.White', 'focusedContainerColor = LCard, unfocusedContainerColor = LCard'),
              ('Brush.verticalGradient(listOf(Color.White, LBg, LBg.copy(alpha = .72f)))', 'Brush.verticalGradient(listOf(LCard, LBg, LBg.copy(alpha = .72f)))'),
              ('shape = CircleShape, color = Color.White, border = BorderStroke(3.dp', 'shape = CircleShape, color = LCard, border = BorderStroke(3.dp'),
              ('CardDefaults.cardColors(containerColor = Color.White)', 'CardDefaults.cardColors(containerColor = LCard)'),
              ('shape = RoundedCornerShape(15.dp), color = Color.White,', 'shape = RoundedCornerShape(15.dp), color = LCard,'),
              ('shape = RoundedCornerShape(20.dp), color = Color.White,', 'shape = RoundedCornerShape(20.dp), color = LCard,'),
              ('if (selected) LBlueSoft else Color.White', 'if (selected) LBlueSoft else LCard'),
              ('ButtonDefaults.outlinedButtonColors(containerColor = Color.White, contentColor = accent)', 'ButtonDefaults.outlinedButtonColors(containerColor = LCard, contentColor = accent)'),
              ('if (error) Color(0xFFFFF1F4) else Color.White', 'if (error) LRed.copy(alpha = .10f) else LCard'),
          ]
          for before, after in replacements:
              if before not in s:
                  raise SystemExit(f'Expected LightDuel pattern not found: {before}')
              s = s.replace(before, after)
          p.write_text(s)

          t = Path('app/src/test/java/com/sonharf/game/PremiumThemePrivateRoomContractTest.kt')
          ts = t.read_text()
          marker = '        assertTrue(src.contains("private val LBorder: Color get() = SonHarfCosmetics.gamePalette.border"))\n'
          extra = marker + '        assertFalse(src.contains("containerColor = Color.White"))\n        assertFalse(src.contains("Brush.verticalGradient(listOf(Color.White"))\n'
          if marker not in ts:
              raise SystemExit('Theme contract marker missing')
          t.write_text(ts.replace(marker, extra, 1))
      - name: Commit scoped patch
        run: |
          git config user.name "sonharf-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/LightDuelUi.kt app/src/test/java/com/sonharf/game/PremiumThemePrivateRoomContractTest.kt
          git commit -m "fix: complete midnight duel surface palette [midnight-surface-patch]"
          git push origin HEAD:feat/premium-style-private-room-bot-ui-20260831
