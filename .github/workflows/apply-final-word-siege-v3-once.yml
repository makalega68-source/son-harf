name: Apply Final Word Siege V3 Once

on:
  push:
    branches:
      - fix/final-word-siege-20260902

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip final-word-siege-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-word-siege-20260902
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 scripts/apply_final_word_siege_v2.py
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegePracticeEngine.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade final Word Siege mechanics [skip final-word-siege-v2] [skip final-word-siege-v3]"
            git push origin HEAD:fix/final-word-siege-20260902
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
