name: Premium Cyan UI

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_premium_cyan_ui.py'
      - '.github/workflows/premium-cyan-ui.yml'
      - 'ci/premium-cyan-ui-trigger.txt'

permissions:
  contents: write

jobs:
  migrate-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply premium cyan UI
        run: python3 scripts/apply_premium_cyan_ui.py
      - name: Test and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Publish migrated source and APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SonHarf-Premium-Cyan.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremiumMasterHome.kt \
                  app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt \
                  app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt \
                  app/src/main/java/com/sonharf/game/GamePortalApp.kt \
                  app/src/main/java/com/sonharf/game/SocialExperience.kt \
                  app/src/main/java/com/sonharf/game/EconomyShopScreen.kt \
                  app/src/main/java/com/sonharf/game/RewardCenterScreen.kt \
                  app/src/main/java/com/sonharf/game/LeaderboardExperience.kt \
                  app/src/main/java/com/sonharf/game/BilBakalimExcitementScreen.kt \
                  dist/SonHarf-Premium-Cyan.apk
          git diff --cached --quiet || git commit -m "Apply premium master home UI [skip ci]"
          git push
