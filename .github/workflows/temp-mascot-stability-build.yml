name: Temp Mascot Stability Build

on:
  push:
    branches:
      - fix/mascot-stability-chat-room-20260827
    paths:
      - '.github/workflows/temp-mascot-stability-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Verify stability patch scope
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'EveHomeFloatingCompanion(' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'EveHomeFixedCompanion(' app/src/main/java/com/sonharf/game/PremiumMasterHome.kt
          grep -q 'EveMascotRuntime.calm()' app/src/main/java/com/sonharf/game/EveHomeFixedCompanion.kt
          grep -q 'R.drawable.mascot_realm_bg' app/src/main/java/com/sonharf/game/EveForestScreen.kt
          grep -q 'requiredHeight' app/src/main/java/com/sonharf/game/EveForestScreen.kt
          grep -q 'signInAnonymously' app/src/main/java/com/sonharf/game/EveAiChatService.kt

      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify packaged assets
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/models/eve/eve.glb'
          unzip -l "$APK" | grep -q 'mascot_realm_bg.webp'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Mascot-Stability-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
