name: Recovery APK Build

on:
  workflow_dispatch:
  push:
    branches: [ recovery/all-updates-final-20260902 ]
    paths:
      - '.github/workflows/recovery-apk-build.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build-recovery-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Upload recovery APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Recovery-All-Updates
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
