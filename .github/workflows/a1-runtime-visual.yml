name: A1 Runtime Visual Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Build debug QA APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Run actual Compose screens on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p runtime-shots

            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.VisualQaActivity --es screen siege
            sleep 2
            adb exec-out screencap -p > runtime-shots/siege-center.png

            # Pan left/right/up/down/diagonal on the board viewport, capturing real runtime frames.
            adb shell input swipe 540 720 300 720 350
            adb exec-out screencap -p > runtime-shots/siege-pan-left.png
            adb shell input swipe 300 720 760 720 350
            adb exec-out screencap -p > runtime-shots/siege-pan-right.png
            adb shell input swipe 540 760 540 520 350
            adb exec-out screencap -p > runtime-shots/siege-pan-up.png
            adb shell input swipe 540 520 540 840 350
            adb exec-out screencap -p > runtime-shots/siege-pan-down.png
            adb shell input swipe 540 720 350 560 350
            adb exec-out screencap -p > runtime-shots/siege-pan-diagonal.png

            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.VisualQaActivity --es screen duel
            sleep 2
            adb exec-out screencap -p > runtime-shots/sonharf-duel.png

            # Basic process/runtime guard: activity must still be alive after rendering and gestures.
            adb shell dumpsys activity activities | grep -q 'com.sonharf.game/.VisualQaActivity'
      - uses: actions/upload-artifact@v4
        with:
          name: a1-runtime-screenshots
          path: runtime-shots/*.png
          if-no-files-found: error
          retention-days: 7
