name: Bil Bakalim Integration

on:
  push:
    branches: [ feature/bil-bakalim-v1 ]

permissions:
  contents: write

jobs:
  integrate-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[bil-bakalim-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bil-bakalim-v1
          fetch-depth: 0

      - name: Integrate Bil Bakalim, VIP chat and keyboard hints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Patch target not found: {label}")
              return text.replace(old, new, 1)

          classic_path = Path('app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt')
          classic = classic_path.read_text()
          classic = replace_once(
              classic,
              'HOME, PLAY, GAME, PROFILE, SHOP, HUB, LEAGUE, PROFILE_FULL, SHOP_FULL',
              'HOME, PLAY, GAME, BIL_BAKALIM, PROFILE, SHOP, HUB, LEAGUE, PROFILE_FULL, SHOP_FULL',
              'classic enum',
          )
          classic = replace_once(
              classic,
              'onQuickGame = { gameKey += 1; screen = ClassicScreen.GAME },\n                        onHub = { screen = ClassicScreen.HUB },',
              'onQuickGame = { gameKey += 1; screen = ClassicScreen.GAME },\n                        onBilBakalim = { screen = ClassicScreen.BIL_BAKALIM },\n                        onHub = { screen = ClassicScreen.HUB },',
              'classic home route callback',
          )
          classic = replace_once(
              classic,
              'ClassicScreen.GAME -> key(gameKey) { TargetNeonGameScreen() }\n                    ClassicScreen.HUB -> MetaHubScreen()',
              'ClassicScreen.GAME -> key(gameKey) { TargetNeonGameScreen() }\n                    ClassicScreen.BIL_BAKALIM -> BilBakalimStandaloneScreen { screen = ClassicScreen.HOME }\n                    ClassicScreen.HUB -> MetaHubScreen()',
              'classic Bil Bakalim route',
          )
          classic = replace_once(
              classic,
              'onQuickGame: () -> Unit,\n    onHub: () -> Unit,',
              'onQuickGame: () -> Unit,\n    onBilBakalim: () -> Unit,\n    onHub: () -> Unit,',
              'classic home signature',
          )
          classic = replace_once(
              classic,
              'item { ClassicHero(onQuickGame) }\n        item {\n            ClassicModeSelector(mode)',
              'item { ClassicHero(onQuickGame) }\n        item { BilBakalimHomeCard(onBilBakalim) }\n        item {\n            ClassicModeSelector(mode)',
              'classic home card',
          )
          classic_path.write_text(classic)

          target_path = Path('app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt')
          target = target_path.read_text()
          target = replace_once(
              target,
              'import androidx.compose.ui.text.input.ImeAction\nimport androidx.compose.ui.text.style.TextAlign',
              'import androidx.compose.ui.text.input.ImeAction\nimport androidx.compose.ui.text.input.KeyboardType\nimport androidx.compose.ui.text.intl.Locale\nimport androidx.compose.ui.text.intl.LocaleList\nimport androidx.compose.ui.text.style.TextAlign',
              'target keyboard imports',
          )
          target = replace_once(
              target,
              'var words by remember { mutableStateOf<List<GameWordDto>>(emptyList()) }\n    var wordInput by remember { mutableStateOf("") }',
              'var words by remember { mutableStateOf<List<GameWordDto>>(emptyList()) }\n    var chatMessages by remember { mutableStateOf<List<ChatMessageDto>>(emptyList()) }\n    var wordInput by remember { mutableStateOf("") }',
              'chat state',
          )
          target = replace_once(
              target,
              'var wordsJob by remember { mutableStateOf<Job?>(null) }\n    var matchJob by remember { mutableStateOf<Job?>(null) }',
              'var wordsJob by remember { mutableStateOf<Job?>(null) }\n    var chatJob by remember { mutableStateOf<Job?>(null) }\n    var matchJob by remember { mutableStateOf<Job?>(null) }',
              'chat job state',
          )
          target = replace_once(
              target,
              'roomJob?.cancel(); wordsJob?.cancel(); matchJob?.cancel(); matching = false',
              'roomJob?.cancel(); wordsJob?.cancel(); chatJob?.cancel(); matchJob?.cancel(); matching = false',
              'cancel chat observer',
          )
          target = replace_once(
              target,
              'wordsJob = scope.launch { backend.observeWords(r.id).catch { notice = friendly(it.message.orEmpty()) }.collect { words = it } }',
              'wordsJob = scope.launch { backend.observeWords(r.id).catch { notice = friendly(it.message.orEmpty()) }.collect { words = it } }\n        chatJob = scope.launch { backend.observeChat(r.id).catch { notice = friendly(it.message.orEmpty()) }.collect { chatMessages = it } }',
              'observe chat',
          )
          target = replace_once(
              target,
              'opponentName = if (active.isBot) "${active.botName ?: "KelimeBot"} BOT" else opponentProfile?.displayName ?: "Rakip",\n                words = words,',
              'opponentName = if (active.isBot) "${active.botName ?: "KelimeBot"} BOT" else opponentProfile?.displayName ?: "Rakip",\n                isVip = profile?.isVip == true,\n                words = words,\n                chatMessages = chatMessages,',
              'target arena vip/chat args',
          )
          target = replace_once(
              target,
              'onForfeit = { scope.launch { runCatching { backend.forfeit(active.id) }.onSuccess { room = it } } },\n                onExit = { roomJob?.cancel(); wordsJob?.cancel(); room = null; words = emptyList(); notice = "Yeni düelloya hazırsın" },',
              'onForfeit = { scope.launch { runCatching { backend.forfeit(active.id) }.onSuccess { room = it } } },\n                onSendChat = { text -> scope.launch { runCatching { backend.sendChat(active.id, text) }.onFailure { notice = friendly(it.message.orEmpty()) } } },\n                onExit = { roomJob?.cancel(); wordsJob?.cancel(); chatJob?.cancel(); room = null; words = emptyList(); chatMessages = emptyList(); notice = "Yeni düelloya hazırsın" },',
              'target arena chat callback',
          )
          target = replace_once(
              target,
              'opponentName: String,\n    words: List<GameWordDto>,\n    wordInput: String,',
              'opponentName: String,\n    isVip: Boolean,\n    words: List<GameWordDto>,\n    chatMessages: List<ChatMessageDto>,\n    wordInput: String,',
              'arena signature vip/chat data',
          )
          target = replace_once(
              target,
              'onTimeout: () -> Unit,\n    onForfeit: () -> Unit,\n    onExit: () -> Unit,',
              'onTimeout: () -> Unit,\n    onForfeit: () -> Unit,\n    onSendChat: (String) -> Unit,\n    onExit: () -> Unit,',
              'arena signature send chat',
          )
          target = replace_once(
              target,
              'val focus = LocalFocusManager.current\n\n    LaunchedEffect(room.turnDeadline',
              'val focus = LocalFocusManager.current\n    var showChat by remember { mutableStateOf(false) }\n    var showChain by remember { mutableStateOf(false) }\n    var showVipNotice by remember { mutableStateOf(false) }\n    var chatInput by remember { mutableStateOf("") }\n\n    LaunchedEffect(room.turnDeadline',
              'arena dialog states',
          )
          target = replace_once(
              target,
              'keyboardOptions = KeyboardOptions(imeAction = ImeAction.Send),',
              'keyboardOptions = KeyboardOptions(\n                keyboardType = KeyboardType.Text,\n                imeAction = ImeAction.Send,\n                showKeyboardOnFocus = true,\n                hintLocales = LocaleList(Locale(if (room.language == "tr") "tr-TR" else "en-US")),\n            ),',
              'game keyboard locale hint',
          )
          target = replace_once(
              target,
              'TargetPower("⤨", "KARIŞTIR", "2", TGcyan, Modifier.weight(1f))\n        }\n        Spacer(Modifier.weight(1f))',
              'TargetPower("⤨", "KARIŞTIR", "2", TGcyan, Modifier.weight(1f))\n        }\n        Spacer(Modifier.height(8.dp))\n        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            VipLockedAction("💬 SOHBET", isVip, { showChat = true }, { showVipNotice = true }, Modifier.weight(1f))\n            VipLockedAction("⛓ KELİME ZİNCİRİ", isVip, { showChain = true }, { showVipNotice = true }, Modifier.weight(1f))\n        }\n        Spacer(Modifier.weight(1f))',
              'vip arena actions',
          )
          target = replace_once(
              target,
              'Surface(modifier = Modifier.weight(1f), color = TGpanel, shape = RoundedCornerShape(12.dp)) { Text(notice, Modifier.padding(12.dp), color = TGmuted, fontSize = 9.sp, textAlign = TextAlign.Center) }\n        }\n    }\n}\n\n@Composable private fun TargetArenaPlayer',
              '''Surface(modifier = Modifier.weight(1f), color = TGpanel, shape = RoundedCornerShape(12.dp)) { Text(notice, Modifier.padding(12.dp), color = TGmuted, fontSize = 9.sp, textAlign = TextAlign.Center) }\n        }\n\n        if (showVipNotice) {\n            AlertDialog(\n                onDismissRequest = { showVipNotice = false },\n                confirmButton = { TextButton(onClick = { showVipNotice = false }) { Text("TAMAM") } },\n                title = { Text("VIP ÖZELLİĞİ") },\n                text = { Text("Oyun içi sohbet ve tam kelime zinciri VIP üyelerine özeldir.") },\n            )\n        }\n        if (showChain) {\n            AlertDialog(\n                onDismissRequest = { showChain = false },\n                confirmButton = { TextButton(onClick = { showChain = false }) { Text("KAPAT") } },\n                title = { Text("KELİME ZİNCİRİ") },\n                text = {\n                    LazyColumn(Modifier.fillMaxWidth().heightIn(max = 360.dp)) {\n                        items(words.takeLast(30)) { w ->\n                            Text(w.word.uppercase(), modifier = Modifier.fillMaxWidth().padding(vertical = 7.dp), color = TGtext, fontSize = 18.sp, fontWeight = FontWeight.Bold)\n                            HorizontalDivider(color = Color.White.copy(alpha = .08f))\n                        }\n                    }\n                },\n            )\n        }\n        if (showChat) {\n            AlertDialog(\n                onDismissRequest = { showChat = false },\n                confirmButton = { TextButton(onClick = { showChat = false }) { Text("KAPAT") } },\n                title = { Text("OYUN SOHBETİ") },\n                text = {\n                    Column(Modifier.fillMaxWidth().heightIn(max = 440.dp)) {\n                        LazyColumn(Modifier.weight(1f, fill = false).fillMaxWidth().heightIn(min = 120.dp, max = 300.dp)) {\n                            items(chatMessages.takeLast(40)) { message ->\n                                val mine = message.senderId == me\n                                Column(Modifier.fillMaxWidth().padding(vertical = 5.dp), horizontalAlignment = if (mine) Alignment.End else Alignment.Start) {\n                                    Text(if (mine) "Sen" else opponentName, color = if (mine) TGcyan else TGpink, fontSize = 9.sp, fontWeight = FontWeight.Bold)\n                                    Surface(color = if (mine) TGcyan.copy(alpha = .12f) else TGpink.copy(alpha = .12f), shape = RoundedCornerShape(10.dp)) {\n                                        Text(message.body, Modifier.padding(horizontal = 10.dp, vertical = 7.dp), color = TGtext, fontSize = 13.sp)\n                                    }\n                                }\n                            }\n                        }\n                        Spacer(Modifier.height(8.dp))\n                        OutlinedTextField(\n                            value = chatInput,\n                            onValueChange = { chatInput = it.take(300) },\n                            modifier = Modifier.fillMaxWidth(),\n                            singleLine = true,\n                            placeholder = { Text("Mesaj yaz…") },\n                            keyboardOptions = KeyboardOptions(\n                                keyboardType = KeyboardType.Text,\n                                imeAction = ImeAction.Send,\n                                showKeyboardOnFocus = true,\n                                hintLocales = LocaleList(Locale(if (room.language == "tr") "tr-TR" else "en-US")),\n                            ),\n                            keyboardActions = KeyboardActions(onSend = {\n                                val text = chatInput.trim()\n                                if (text.isNotEmpty()) { onSendChat(text); chatInput = "" }\n                            }),\n                        )\n                        Spacer(Modifier.height(6.dp))\n                        Button(\n                            onClick = { val text = chatInput.trim(); if (text.isNotEmpty()) { onSendChat(text); chatInput = "" } },\n                            enabled = chatInput.isNotBlank(),\n                            modifier = Modifier.fillMaxWidth(),\n                        ) { Text("GÖNDER") }\n                    }\n                },\n            )\n        }\n    }\n}\n\n@Composable private fun TargetArenaPlayer''',
              'vip dialogs',
          )
          target_path.write_text(target)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Compile and test debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all

      - name: Commit integrated source
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "[bil-bakalim-ci] Integrate Bil Bakalim home, VIP chat and locale keyboard"
            git push origin HEAD:feature/bil-bakalim-v1
          fi
