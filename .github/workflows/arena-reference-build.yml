name: Arena Reference Build

on:
  push:
    branches: [ feat/arena-reference-implementation-20260822 ]
    paths:
      - 'scripts/apply_arena_reference_upgrade.py'
      - '.github/workflows/arena-reference-build.yml'
      - 'app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt'
      - 'app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arena-reference-implementation-20260822
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Apply guarded arena upgrade
        run: python3 scripts/apply_arena_reference_upgrade.py

      - name: Regression contract checks
        run: |
          set -euxo pipefail
          grep -q 'backend.submitWord(active.id, submitted)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'backend.restartBotMatch(active.id)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'backend.requestRematch(active.id)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'ProfilePhotoAvatar(avatarPath, name, 60.dp' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'shape = RoundedCornerShape(14.dp)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'İYİ KELİME' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'onGoodWord' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'SİL' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'SERİ BONUSU' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'RAKİP BASKISI' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'Rating +' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt

      - name: Kotlin compile and unit-test task
        run: gradle :app:testDebugUnitTest --stacktrace --warning-mode all

      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all

      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt
          git diff --cached --quiet || git commit -m "Implement arena reference UI and working reactions"
          git pull --rebase origin feat/arena-reference-implementation-20260822
          git push origin HEAD:feat/arena-reference-implementation-20260822

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Arena-Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Arena-Test-APK
          path: SonHarf-Arena-Test.apk
          if-no-files-found: error
