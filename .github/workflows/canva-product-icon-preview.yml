name: Canva Product Icon Preview
on:
  push:
    branches: [integration/v2-premium-corrected-final-20260919]
    paths: ['tools/canva_product_icon_url_20260919.txt','.github/workflows/canva-product-icon-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Canva preview
        run: |
          mkdir -p preview
          curl --fail --location --retry 2 "$(cat tools/canva_product_icon_url_20260919.txt)" -o preview/product-icons.png
          file preview/product-icons.png
      - uses: actions/upload-artifact@v4
        with:
          name: canva-product-icon-preview
          path: preview/product-icons.png
          retention-days: 1
