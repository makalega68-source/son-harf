name: Apply Final Word Siege V2 Once

on:
  push:
    branches:
      - fix/final-word-siege-20260902

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip final-word-siege-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-word-siege-20260902
          fetch-depth: 0
      - name: Apply targeted final Word Siege patch
        run: python3 scripts/apply_final_word_siege_v2.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegePracticeEngine.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade final Word Siege mechanics [skip final-word-siege-v2]"
          git push origin HEAD:fix/final-word-siege-20260902
