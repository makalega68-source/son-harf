name: Temp mascot realm asset

on:
  push:
    branches:
      - feature/mascot-realm-background-20260827
    paths:
      - 'tmp/mascot_realm_bg.part*'
      - '.github/workflows/temp-mascot-realm-asset.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode mascot realm WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          cat tmp/mascot_realm_bg.part* | tr -d '\n\r ' | base64 --decode > app/src/main/res/drawable-nodpi/mascot_realm_bg.webp
          test "$(wc -c < app/src/main/res/drawable-nodpi/mascot_realm_bg.webp)" -eq 72196
          rm -f tmp/mascot_realm_bg.part*
          rmdir tmp 2>/dev/null || true
          rm -f .github/workflows/temp-mascot-realm-asset.yml

      - name: Commit decoded asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(maskot): add mascot realm forest background"
          git push
