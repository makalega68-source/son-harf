name: Harf Yolu Input Background Hotfix

on:
  push:
    branches:
      - codex/kelime-kusatmasi-premium-logo-20260918
    paths:
      - .github/workflows/harf-yolu-input-background-hotfix.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: codex/kelime-kusatmasi-premium-logo-20260918
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply Harf Yolu hotfix
        run: python3 .github/scripts/harf_yolu_hotfix.py

      - name: Verify hotfix source contracts
        shell: bash
        run: |
          grep -q 'FirstRunLanguageBackdrop(Modifier.fillMaxSize())' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          grep -q 'activeInput = input.uppercase(locale).takeIf { isActiveEntry }' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          grep -q 'enabled = !completed && !hintUsed' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          grep -q 'İPUCU 1/1' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          grep -q 'sarı işaretli harfi değiştir' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          grep -q 'viableNextMoveIndices' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          ! grep -q 'Modifier.fillMaxSize().background(LetterLadderUi.Background)' app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          grep -q 'for (move in 1 until LetterLadderEngine.MOVE_COUNT)' app/src/main/java/com/sonharf/game/LetterLadderGame.kt

      - name: Run Harf Yolu regression tests
        run: ./gradlew :app:testDebugUnitTest --tests com.sonharf.game.LetterLadderEngineTest --tests com.sonharf.game.LetterLadderUxRegressionTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit verified hotfix and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/harf-yolu-input-background-hotfix.yml .github/scripts/harf_yolu_hotfix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game/LetterLadderGame.kt app/src/test/java/com/sonharf/game/LetterLadderEngineTest.kt app/src/test/java/com/sonharf/game/LetterLadderUxRegressionTest.kt .github/workflows/harf-yolu-input-background-hotfix.yml .github/scripts/harf_yolu_hotfix.py
          git commit -m 'Harf Yolu giriş arka plan ve tek ipucunu düzelt'
          git push origin HEAD:codex/kelime-kusatmasi-premium-logo-20260918

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kelime-Kusatmasi-Harf-Yolu-Hotfix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Kusatmasi-Harf-Yolu-Hotfix-APK
          path: Kelime-Kusatmasi-Harf-Yolu-Hotfix.apk
          if-no-files-found: error
