name: Son Harf Calm Redesign Once

on:
  push:
    branches:
      - ui/professional-full-redesign-20260921
    paths:
      - .github/workflows/son-harf-calm-redesign-once.yml

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: ui/professional-full-redesign-20260921
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply scoped UI patch
        run: |
          python3 .github/scripts/apply_son_harf_calm_redesign.py
          python3 .github/scripts/fix_son_harf_redesign_compile.py

      - name: Verify only intended Kotlin file changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt"

      - name: Compile Son Harf production code
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Commit verified redesign
        shell: bash
        run: |
          git config user.name "openai-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          git commit -m "feat: redesign Son Harf match arena"
          git push origin HEAD:ui/professional-full-redesign-20260921
