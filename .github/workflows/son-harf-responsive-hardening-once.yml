name: Son Harf Responsive Hardening Once

on:
  push:
    branches:
      - ui/professional-full-redesign-20260921
    paths:
      - .github/workflows/son-harf-responsive-hardening-once.yml

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: ui/professional-full-redesign-20260921
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply responsive hardening and contract
        run: |
          python3 .github/scripts/son_harf_responsive_hardening_once.py
          python3 .github/scripts/son_harf_responsive_contract_once.py

      - name: Verify only intended files changed
        shell: bash
        run: |
          git status --short
          git diff --name-only | sort > /tmp/actual.txt
          git ls-files --others --exclude-standard | sort >> /tmp/actual.txt
          sort -u -o /tmp/actual.txt /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          app/src/test/java/com/sonharf/game/SonHarfResponsiveLayoutContractTest.kt
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile Son Harf production code
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build installable debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Commit verified responsive hardening
        run: |
          git config user.name "openai-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt app/src/test/java/com/sonharf/game/SonHarfResponsiveLayoutContractTest.kt
          git diff --cached --quiet || git commit -m "feat: harden Son Harf responsive arena"
          git push origin HEAD:ui/professional-full-redesign-20260921

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-responsive-hardened-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
