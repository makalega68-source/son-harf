name: Production V3 Validation

on:
  push:
    branches:
      - prod-frame-dictionary-tr-en-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-test-build:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod-frame-dictionary-tr-en-v3
          fetch-depth: 0

      - name: Finalize purchased frame assets and source mappings
        run: python3 scripts/finalize_production_v3.py

      - name: Verify source diff
        run: git diff --check

      - name: Commit deterministic finalization
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res/drawable-nodpi/style_frame_*.png \
                    app/src/main/java/com/sonharf/game/PurchasedStyleUi.kt \
                    app/src/main/java/com/sonharf/game/data/SharedDictionaryService.kt \
                    docs/DICTIONARY_FRAME_SOURCES_20260903.md
            git commit -m "Finalize production v3 assets and dictionaries [skip ci]"
            git push origin HEAD:prod-frame-dictionary-tr-en-v3
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.14.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Validate packaged purchased PNGs
        run: |
          python3 scripts/finalize_production_v3.py
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Production-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
