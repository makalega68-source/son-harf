name: Layout Bot Turkish Fixes

on:
  push:
    branches: [ fix/layout-bot-turkish-20260822 ]
    paths:
      - '.github/workflows/layout-bot-turkish-fixes.yml'

permissions:
  contents: read

jobs:
  test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/layout-bot-turkish-20260822
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Contract checks
        run: |
          set -euxo pipefail
          grep -q 'height(84.dp)' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'profile = playerProfile' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -q 'heightIn(min = 78.dp)' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -q 'java.util.Locale("tr", "TR")' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'repeat(3) { attempt' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'Color(0xFFEF6FA7)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'Color(0xFF3C9EEB)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all
      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Layout-Bot-Turkish-Fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Layout-Bot-Turkish-Fixed-APK
          path: SonHarf-Layout-Bot-Turkish-Fixed.apk
          if-no-files-found: error
