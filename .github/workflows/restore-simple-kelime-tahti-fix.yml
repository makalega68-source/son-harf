name: Restore Simple Kelime Tahti Patch

on:
  push:
    branches:
      - fix/restore-simple-kelime-tahti-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-simple-kelime-tahti-20260912
          fetch-depth: 0
      - name: Apply requested cube colors and active-turn panning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          online = Path('app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt')
          text = online.read_text()
          replacements = {
              'private val PanSiegeMine = Color(0xFFE3EDE5)': 'private val PanSiegeMine = Color(0xFFA8D5B5)',
              'private val PanSiegeRival = Color(0xFFE4EDF3)': 'private val PanSiegeRival = Color(0xFFE4AEAA)',
              'private val PanSiegeMineBorder = Color(0xFF567A64)': 'private val PanSiegeMineBorder = Color(0xFF3F7C53)',
              'private val PanSiegeRivalBorder = Color(0xFF5C8299)': 'private val PanSiegeRivalBorder = Color(0xFF9B4D4A)',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          online.write_text(text)

          practice = Path('app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt')
          text = practice.read_text()
          replacements = {
              'private val PracticeSiegeMine = Color(0xFFE3EDE5)': 'private val PracticeSiegeMine = Color(0xFFA8D5B5)',
              'private val PracticeSiegeRival = Color(0xFFE4EDF3)': 'private val PracticeSiegeRival = Color(0xFFE4AEAA)',
              'private val PracticeSiegeMineBorder = Color(0xFF567A64)': 'private val PracticeSiegeMineBorder = Color(0xFF3F7C53)',
              'private val PracticeSiegeRivalBorder = Color(0xFF5C8299)': 'private val PracticeSiegeRivalBorder = Color(0xFF9B4D4A)',
              '.pointerInput(mode, viewport, boardPx, closeScale, enabled) {\n                    // While the player can place tiles, board cells own single-touch input.\n                    // This prevents the parent transform detector from swallowing taps.\n                    if (mode == WordSiegeBoardViewportMode.CLOSE && !enabled) {': '.pointerInput(mode, viewport, boardPx, closeScale) {\n                    if (mode == WordSiegeBoardViewportMode.CLOSE) {',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          practice.write_text(text)
          PY
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt
          git commit -m "Apply green/red cube ownership and active-turn panning"
          git push origin HEAD:fix/restore-simple-kelime-tahti-20260912
