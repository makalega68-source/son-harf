name: Word Siege compile fix

on:
  push:
    branches: [ word-siege-pan-area-20260901 ]
    paths:
      - '.github/workflows/word-siege-compile-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: word-siege-pan-area-20260901
      - name: Remove obsolete pointer consume import
        run: |
          sed -i '/import androidx.compose.ui.input.pointer.consume/d' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          git diff --check
      - name: Commit scoped compile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          git commit -m "Fix Word Siege pointer input compile"
          git push origin HEAD:word-siege-pan-area-20260901
