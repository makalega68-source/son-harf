name: EVE Match Reactions Current UI APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/eve-match-reactions-current-ui-20260827
    paths:
      - '.github/workflows/eve-match-reactions-current-ui.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Verify EVE asset
        run: gradle :app:verifyEveAsset --stacktrace
      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Verify APK contains accepted EVE GLB
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" "assets/models/eve/eve.glb" | grep -F "assets/models/eve/eve.glb"
          cp "$APK" "SonHarf-Current-UI-Eve-Reactions.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Current-UI-Eve-Reactions
          path: SonHarf-Current-UI-Eve-Reactions.apk
          if-no-files-found: error
          retention-days: 14
