name: Siege Readability V35

on:
  push:
    branches:
      - claude/kelime-tahti-home-redesign-7ojb7d
    paths:
      - '.github/workflows/siege-readability-v35.yml'
      - 'app/src/main/java/com/sonharf/game/WordSiegeMascotView.kt'
      - 'app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt'
      - 'app/src/main/assets/word_siege_mascot/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readability-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: claude/kelime-tahti-home-redesign-7ojb7d
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Unit tests and debug APK
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p final-apk
          cp app/build/outputs/apk/debug/app-debug.apk final-apk/Kelime-Tahti-Guncel.apk
          sha256sum final-apk/Kelime-Tahti-Guncel.apk > final-apk/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-tahti-mascot-v35
          path: final-apk/
          if-no-files-found: error
          retention-days: 7
