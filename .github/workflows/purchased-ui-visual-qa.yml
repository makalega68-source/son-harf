name: Purchased UI Visual QA

on:
  push:
    branches:
      - qa/purchased-ui-visual-final-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Open private lobby to debug harness only
        shell: bash
        run: |
          sed -i 's/private fun PremierLobby(/internal fun PremierLobby(/' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -q 'internal fun PremierLobby(' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt

      - name: Build debug QA APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture real runtime screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/capture-purchased-ui-qa.sh

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchased-ui-final-screenshots
          path: qa-screens/*.png
          if-no-files-found: warn
          retention-days: 14
