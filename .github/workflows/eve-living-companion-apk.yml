name: Eve Real 3D Integration Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/eve-real-glb-integration-20260826
      - feat/eve-progression-interactions-20260826
      - fix/eve-gles-ime-surface-20260826
    paths:
      - '.github/workflows/eve-living-companion-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  test-build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Verify accepted Eve GLB before build
        run: gradle :app:verifyEveAsset --stacktrace

      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify Eve GLB is really packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ENTRY="assets/models/eve/eve.glb"
          EXPECTED_SHA="0c68ac4c4f5475332fac77ccb9bda4bb08bd202a5d596114552e37ab27d6c39e"
          EXPECTED_SIZE="4870220"

          test -f "$APK" || { echo "::error::Debug APK missing"; exit 1; }
          unzip -l "$APK" "$ENTRY" | grep -F "$ENTRY" >/dev/null || {
            echo "::error::FATAL: $ENTRY is not packaged in the APK"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/eve-apk-check"
          unzip -p "$APK" "$ENTRY" > "$RUNNER_TEMP/eve-apk-check/eve.glb"
          ACTUAL_SIZE="$(stat -c%s "$RUNNER_TEMP/eve-apk-check/eve.glb")"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/eve-apk-check/eve.glb" | awk '{print $1}')"

          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE" || {
            echo "::error::FATAL: APK Eve size mismatch. Expected $EXPECTED_SIZE, got $ACTUAL_SIZE"
            exit 1
          }
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "::error::FATAL: APK Eve SHA mismatch. Expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          }
          printf 'glTF' | cmp -n 4 - "$RUNNER_TEMP/eve-apk-check/eve.glb" || {
            echo "::error::FATAL: Packaged Eve does not have GLB magic"
            exit 1
          }
          echo ">> [PASS] Exact accepted Eve GLB is inside the APK"

      - name: Enable KVM access for emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is not available; emulator may use slow software acceleration"
          fi

      - name: Render, animate and IME-stress real Eve on one Android Surface
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p artifacts/eve-smoke artifacts/eve-ime
            test -f app/build/outputs/apk/debug/app-debug.apk || (echo "::error::Debug APK missing before emulator install"; exit 1)
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell ime list -s > artifacts/eve-ime/imes.txt || true

            # One Activity, one production Eve3DStage, one Filament/Vulkan Surface for the whole gate.
            adb logcat -c
            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.EveImeSmokeActivity
            sleep 12
            adb shell pidof com.sonharf.game | tr -d '\r' > artifacts/eve-ime/base-pid.txt || true
            test -s artifacts/eve-ime/base-pid.txt || (adb logcat -d > artifacts/eve-ime/start-failure-logcat.txt; echo "::error::Eve single-Surface process did not remain alive after start"; exit 1)
            adb exec-out screencap -p > artifacts/eve-smoke/eve-frame-a.png
            sleep 2
            adb exec-out screencap -p > artifacts/eve-smoke/eve-frame-b.png
            adb shell dumpsys activity activities > artifacts/eve-smoke/activities.txt || true
            adb logcat -d > artifacts/eve-smoke/logcat.txt || true
            grep -q "EveImeSmokeActivity" artifacts/eve-smoke/activities.txt || (echo "::error::EveImeSmokeActivity is not active for render gate"; exit 1)
            test "$(stat -c%s artifacts/eve-smoke/eve-frame-a.png)" -gt 20000 || (echo "::error::First runtime screenshot is unexpectedly empty"; exit 1)
            test "$(stat -c%s artifacts/eve-smoke/eve-frame-b.png)" -gt 20000 || (echo "::error::Second runtime screenshot is unexpectedly empty"; exit 1)
            ! cmp -s artifacts/eve-smoke/eve-frame-a.png artifacts/eve-smoke/eve-frame-b.png || (echo "::error::EVE GLB runtime frames are byte-identical"; exit 1)
            echo ">> [PASS] Real Eve GLB rendered and animated on the same Surface used for IME stress"

            # UIAutomator is unreliable on the headless Vulkan/Compose window. The debug surface has
            # one full-width TextField near the bottom, so derive a safe tap from the actual display.
            adb shell wm size > artifacts/eve-ime/wm-size.txt
            python3 -c 'import re; s=open("artifacts/eve-ime/wm-size.txt").read(); m=re.findall(r"(\d+)x(\d+)",s); assert m,"wm size unavailable"; w,h=map(int,m[-1]); open("artifacts/eve-ime/tap.txt","w").write(f"{w//2} {h-200}\n")'
            cat artifacts/eve-ime/tap.txt

            # SwiftShader can take several seconds between showSoftInput() and the IME actually reaching
            # ImeTracker.onShown. Never send Back on a fixed timer: wait for real onShown/onHidden events.
            # Keep the whole loop on one shell line because android-emulator-runner executes script lines
            # in separate /bin/sh processes.
            read X Y < artifacts/eve-ime/tap.txt; : > artifacts/eve-ime/full-logcat.txt; for ROUND in 1 2 3 4 5; do adb logcat -c; adb shell input tap "$X" "$Y"; SHOWN=0; for TRY in $(seq 1 15); do sleep 1; if adb logcat -d | grep -qE 'ImeTracker: com\.sonharf\.game:.*: onShown'; then SHOWN=1; break; fi; done; if [ "$SHOWN" != 1 ]; then adb exec-out screencap -p > "artifacts/eve-ime/open-$ROUND-failed.png"; adb logcat -d > "artifacts/eve-ime/round-$ROUND-failure-logcat.txt"; cat "artifacts/eve-ime/round-$ROUND-failure-logcat.txt" >> artifacts/eve-ime/full-logcat.txt; echo "::error::IME never reached ImeTracker.onShown in cycle $ROUND"; exit 1; fi; adb shell dumpsys input_method > "artifacts/eve-ime/open-$ROUND.txt"; adb exec-out screencap -p > "artifacts/eve-ime/open-$ROUND.png"; adb shell pidof com.sonharf.game | tr -d '\r' > "artifacts/eve-ime/pid-$ROUND.txt" || true; if ! cmp -s artifacts/eve-ime/base-pid.txt "artifacts/eve-ime/pid-$ROUND.txt"; then adb logcat -d > "artifacts/eve-ime/round-$ROUND-failure-logcat.txt"; cat "artifacts/eve-ime/round-$ROUND-failure-logcat.txt" >> artifacts/eve-ime/full-logcat.txt; echo "::error::App process changed in IME cycle $ROUND"; exit 1; fi; adb shell input keyevent 4; HIDDEN=0; for TRY in $(seq 1 15); do sleep 1; if adb logcat -d | grep -qE 'ImeTracker: com\.sonharf\.game:.*: onHidden'; then HIDDEN=1; break; fi; done; if [ "$HIDDEN" != 1 ]; then adb logcat -d > "artifacts/eve-ime/round-$ROUND-failure-logcat.txt"; cat "artifacts/eve-ime/round-$ROUND-failure-logcat.txt" >> artifacts/eve-ime/full-logcat.txt; echo "::error::IME never reached ImeTracker.onHidden in cycle $ROUND"; exit 1; fi; adb shell dumpsys input_method > "artifacts/eve-ime/close-$ROUND.txt"; adb logcat -d > "artifacts/eve-ime/round-$ROUND-logcat.txt"; cat "artifacts/eve-ime/round-$ROUND-logcat.txt" >> artifacts/eve-ime/full-logcat.txt; echo ">> [PASS] IME cycle $ROUND reached onShown -> onHidden with stable PID"; done

            adb shell pidof com.sonharf.game | tr -d '\r' > artifacts/eve-ime/current-pid.txt || true
            cmp -s artifacts/eve-ime/base-pid.txt artifacts/eve-ime/current-pid.txt || (echo "::error::App process changed/restarted during IME stress"; exit 1)
            adb shell dumpsys activity activities > artifacts/eve-ime/activities.txt || true
            adb shell dumpsys input_method > artifacts/eve-ime/input-method-final.txt || true
            adb shell dumpsys window windows > artifacts/eve-ime/windows.txt || true
            adb exec-out screencap -p > artifacts/eve-ime/after-ime.png
            grep -q "EveImeSmokeActivity" artifacts/eve-ime/activities.txt || (echo "::error::EveImeSmokeActivity is no longer active after IME stress"; exit 1)
            ! grep -Eqi "createVkSurfaceKHR|vkCreateAndroidSurfaceKHR|PostconditionPanic|Fatal signal 6|FATAL EXCEPTION|SIGABRT" artifacts/eve-ime/full-logcat.txt || (echo "::error::Native/Surface crash signature found during Eve IME stress"; exit 1)
            echo ">> [PASS] Eve survived 5 real IME onShown/onHidden cycles on one Surface with stable PID and no Vulkan panic"

      - name: Upload Eve runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Eve-3D-Runtime-Smoke
          path: |
            artifacts/eve-smoke/
            artifacts/eve-ime/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Eve-Vulkan-IME-Stable-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
