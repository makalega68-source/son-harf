name: Eve Real 3D Integration Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/eve-real-glb-integration-20260826
      - feat/eve-progression-interactions-20260826
      - fix/eve-gles-ime-surface-20260826
    paths:
      - '.github/workflows/eve-living-companion-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches:
      - fix/eve-gles-ime-surface-20260826
    paths:
      - '.github/workflows/eve-living-companion-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  test-build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Verify accepted Eve GLB before build
        run: gradle :app:verifyEveAsset --stacktrace

      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify Eve GLB is really packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ENTRY="assets/models/eve/eve.glb"
          EXPECTED_SHA="0c68ac4c4f5475332fac77ccb9bda4bb08bd202a5d596114552e37ab27d6c39e"
          EXPECTED_SIZE="4870220"

          test -f "$APK" || { echo "::error::Debug APK missing"; exit 1; }
          unzip -l "$APK" "$ENTRY" | grep -F "$ENTRY" >/dev/null || {
            echo "::error::FATAL: $ENTRY is not packaged in the APK"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/eve-apk-check"
          unzip -p "$APK" "$ENTRY" > "$RUNNER_TEMP/eve-apk-check/eve.glb"
          ACTUAL_SIZE="$(stat -c%s "$RUNNER_TEMP/eve-apk-check/eve.glb")"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/eve-apk-check/eve.glb" | awk '{print $1}')"

          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE" || {
            echo "::error::FATAL: APK Eve size mismatch. Expected $EXPECTED_SIZE, got $ACTUAL_SIZE"
            exit 1
          }
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "::error::FATAL: APK Eve SHA mismatch. Expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          }
          printf 'glTF' | cmp -n 4 - "$RUNNER_TEMP/eve-apk-check/eve.glb" || {
            echo "::error::FATAL: Packaged Eve does not have GLB magic"
            exit 1
          }
          echo ">> [PASS] Exact accepted Eve GLB is inside the APK"

      - name: Enable KVM access for emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is not available; emulator may use slow software acceleration"
          fi

      - name: Render floating home, cross-fade and IME-stress real Eve
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p artifacts/eve-home artifacts/eve-smoke artifacts/eve-ime
            test -f app/build/outputs/apk/debug/app-debug.apk || (echo "::error::Debug APK missing before emulator install"; exit 1)
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell ime list -s > artifacts/eve-ime/imes.txt || true

            # Software Vulkan at the Pixel 6's native 1080x2400 saturates CI CPU and can create a
            # renderer-throughput ANR unrelated to the Surface/IME lifecycle under test. Keep a
            # phone-shaped viewport while reducing raster cost; production rendering code is unchanged.
            adb shell wm size 720x1600
            adb shell wm density 280

            # HOME gate: cold process, exact production floating companion, compact TextureSurface.
            # Debug timing accelerates the production 60s DIG -> 60s SIT -> SLEEP routine so CI can
            # prove all three real-GLB states while keeping the release timing unchanged.
            adb logcat -c
            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.EveHomeFloatingSmokeActivity
            sleep 6
            adb shell pidof com.sonharf.game | tr -d '\r' > artifacts/eve-home/base-pid.txt || true
            test -s artifacts/eve-home/base-pid.txt || (adb logcat -d > artifacts/eve-home/start-failure-logcat.txt; echo "::error::Floating HOME process did not remain alive"; exit 1)
            adb exec-out screencap -p > artifacts/eve-home/home-frame-dig.png
            sleep 4
            adb exec-out screencap -p > artifacts/eve-home/home-frame-sit.png
            sleep 5
            adb exec-out screencap -p > artifacts/eve-home/home-frame-sleep.png
            adb shell pidof com.sonharf.game | tr -d '\r' > artifacts/eve-home/current-pid.txt || true
            cmp -s artifacts/eve-home/base-pid.txt artifacts/eve-home/current-pid.txt || (echo "::error::Floating HOME process changed during DIG/SIT/SLEEP"; exit 1)
            adb shell dumpsys activity activities > artifacts/eve-home/activities.txt || true
            adb logcat -d > artifacts/eve-home/logcat.txt || true
            grep -q "EveHomeFloatingSmokeActivity" artifacts/eve-home/activities.txt || (echo "::error::Floating HOME smoke Activity is not active"; exit 1)
            grep -q "FEngine resolved backend: Vulkan" artifacts/eve-home/logcat.txt || (echo "::error::Floating HOME did not report Vulkan backend"; exit 1)
            grep -q "EVE_HOME_ROUTINE: phase=DIGGING" artifacts/eve-home/logcat.txt || (echo "::error::HOME DIGGING phase not observed"; exit 1)
            grep -q "EVE_HOME_ROUTINE: phase=SITTING" artifacts/eve-home/logcat.txt || (echo "::error::HOME SITTING phase not observed"; exit 1)
            grep -q "EVE_HOME_ROUTINE: phase=SLEEPING" artifacts/eve-home/logcat.txt || (echo "::error::HOME SLEEPING phase not observed"; exit 1)
            test "$(stat -c%s artifacts/eve-home/home-frame-dig.png)" -gt 20000 || (echo "::error::Floating HOME DIG frame is unexpectedly empty"; exit 1)
            test "$(stat -c%s artifacts/eve-home/home-frame-sit.png)" -gt 20000 || (echo "::error::Floating HOME SIT frame is unexpectedly empty"; exit 1)
            test "$(stat -c%s artifacts/eve-home/home-frame-sleep.png)" -gt 20000 || (echo "::error::Floating HOME SLEEP frame is unexpectedly empty"; exit 1)
            python3 -c 'import hashlib, pathlib; p=[pathlib.Path("artifacts/eve-home/home-frame-dig.png"),pathlib.Path("artifacts/eve-home/home-frame-sit.png"),pathlib.Path("artifacts/eve-home/home-frame-sleep.png")]; h=[hashlib.sha256(x.read_bytes()).hexdigest() for x in p]; pathlib.Path("artifacts/eve-home/frame-sha256.txt").write_text("\n".join(h)+"\n"); assert len(set(h)) == 3, "DIG/SIT/SLEEP acceptance frames are not visually distinct"'
            ! grep -Eqi "createVkSurfaceKHR|vkCreateAndroidSurfaceKHR|PostconditionPanic|Fatal signal|FATAL EXCEPTION|SIGABRT|SIGSEGV|ANR in com\.sonharf\.game|Input dispatching timed out" artifacts/eve-home/logcat.txt || (echo "::error::Native/Surface/ANR signature found during floating HOME routine"; exit 1)
            echo ">> [PASS] Floating HOME DIG -> SIT -> SLEEP stayed on Vulkan TextureSurface with stable PID"

            # Hard process boundary: HOME TextureSurface and room Surface never teardown/recreate in
            # one process during this test. This mirrors navigation ownership and avoids conflating
            # the room's IME regression with a test-only second-3D-Activity lifecycle transition.
            adb shell am force-stop com.sonharf.game
            sleep 2

            # ROOM gate: one Activity, one production non-compact Eve stage, one Filament/Vulkan
            # Surface for the entire render/cross-fade/IME stress sequence.
            adb logcat -c
            adb shell am start -W -n com.sonharf.game/.EveImeSmokeActivity
            sleep 12
            adb shell pidof com.sonharf.game | tr -d '\r' > artifacts/eve-ime/base-pid.txt || true
            test -s artifacts/eve-ime/base-pid.txt || (adb logcat -d > artifacts/eve-ime/start-failure-logcat.txt; echo "::error::Eve single-Surface process did not remain alive after start"; exit 1)
            adb exec-out screencap -p > artifacts/eve-smoke/eve-frame-a.png
            sleep 1.3
            adb exec-out screencap -p > artifacts/eve-smoke/eve-frame-b.png
            sleep 1.3
            adb exec-out screencap -p > artifacts/eve-smoke/eve-frame-c.png
            adb shell dumpsys activity activities > artifacts/eve-smoke/activities.txt || true
            adb logcat -d > artifacts/eve-smoke/logcat.txt || true
            grep -q "EveImeSmokeActivity" artifacts/eve-smoke/activities.txt || (echo "::error::EveImeSmokeActivity is not active for render gate"; exit 1)
            grep -q "FEngine resolved backend: Vulkan" artifacts/eve-smoke/logcat.txt || (echo "::error::Filament did not report Vulkan backend"; exit 1)
            test "$(stat -c%s artifacts/eve-smoke/eve-frame-a.png)" -gt 20000 || (echo "::error::First runtime screenshot is unexpectedly empty"; exit 1)
            test "$(stat -c%s artifacts/eve-smoke/eve-frame-b.png)" -gt 20000 || (echo "::error::Second runtime screenshot is unexpectedly empty"; exit 1)
            test "$(stat -c%s artifacts/eve-smoke/eve-frame-c.png)" -gt 20000 || (echo "::error::Third runtime screenshot is unexpectedly empty"; exit 1)
            python3 -c 'import hashlib, pathlib; p=[pathlib.Path("artifacts/eve-smoke/eve-frame-a.png"),pathlib.Path("artifacts/eve-smoke/eve-frame-b.png"),pathlib.Path("artifacts/eve-smoke/eve-frame-c.png")]; h=[hashlib.sha256(x.read_bytes()).hexdigest() for x in p]; pathlib.Path("artifacts/eve-smoke/frame-sha256.txt").write_text("\n".join(h)+"\n"); assert len(set(h)) >= 2, "EVE GLB runtime frames are all byte-identical"'
            ! grep -Eqi "createVkSurfaceKHR|vkCreateAndroidSurfaceKHR|PostconditionPanic|Fatal signal|FATAL EXCEPTION|SIGABRT|SIGSEGV|ANR in com\.sonharf\.game|Input dispatching timed out" artifacts/eve-smoke/logcat.txt || (echo "::error::Native/Surface/ANR signature found before IME stress"; exit 1)
            echo ">> [PASS] Real Eve GLB rendered, moved and cross-faded on the room Surface used for IME stress"

            adb shell wm size > artifacts/eve-ime/wm-size.txt
            python3 -c 'import re; s=open("artifacts/eve-ime/wm-size.txt").read(); m=re.findall(r"(\d+)x(\d+)",s); assert m,"wm size unavailable"; w,h=map(int,m[-1]); open("artifacts/eve-ime/tap.txt","w").write(f"{w//2} {h-135}\n")'
            cat artifacts/eve-ime/tap.txt
            sleep 3

            # The Activity reports IME visibility from WindowInsetsCompat. Each cycle waits for the
            # app-side true/false transition. Successful cycles avoid expensive full-screen screencaps;
            # screenshots are captured only on failure and once after all five cycles.
            read X Y < artifacts/eve-ime/tap.txt; : > artifacts/eve-ime/full-logcat.txt; for ROUND in 1 2 3 4 5; do adb logcat -c; adb shell input tap "$X" "$Y"; SHOWN=0; for TRY in $(seq 1 20); do sleep 1; if adb logcat -d | grep -q 'EVE_IME_VISIBLE=true'; then SHOWN=1; break; fi; done; adb logcat -d >> artifacts/eve-ime/full-logcat.txt; if [ "$SHOWN" != 1 ]; then adb exec-out screencap -p > "artifacts/eve-ime/open-$ROUND-failed.png"; adb shell dumpsys activity lastanr > "artifacts/eve-ime/lastanr-$ROUND.txt" || true; adb logcat -d > "artifacts/eve-ime/round-$ROUND-failure-logcat.txt"; cat "artifacts/eve-ime/round-$ROUND-failure-logcat.txt" >> artifacts/eve-ime/full-logcat.txt; echo "::error::WindowInsetsCompat never reported IME visible in cycle $ROUND"; exit 1; fi; adb shell dumpsys input_method > "artifacts/eve-ime/open-$ROUND.txt"; adb shell pidof com.sonharf.game | tr -d '\r' > "artifacts/eve-ime/pid-$ROUND.txt" || true; if ! cmp -s artifacts/eve-ime/base-pid.txt "artifacts/eve-ime/pid-$ROUND.txt"; then adb shell dumpsys activity lastanr > "artifacts/eve-ime/lastanr-$ROUND.txt" || true; adb logcat -d > "artifacts/eve-ime/round-$ROUND-failure-logcat.txt"; cat "artifacts/eve-ime/round-$ROUND-failure-logcat.txt" >> artifacts/eve-ime/full-logcat.txt; echo "::error::App process changed in IME cycle $ROUND"; exit 1; fi; adb logcat -c; adb shell input keyevent 4; HIDDEN=0; for TRY in $(seq 1 20); do sleep 1; if adb logcat -d | grep -q 'EVE_IME_VISIBLE=false'; then HIDDEN=1; break; fi; done; adb logcat -d >> artifacts/eve-ime/full-logcat.txt; if [ "$HIDDEN" != 1 ]; then adb shell dumpsys activity lastanr > "artifacts/eve-ime/lastanr-$ROUND.txt" || true; adb logcat -d > "artifacts/eve-ime/round-$ROUND-failure-logcat.txt"; cat "artifacts/eve-ime/round-$ROUND-failure-logcat.txt" >> artifacts/eve-ime/full-logcat.txt; echo "::error::WindowInsetsCompat never reported IME hidden in cycle $ROUND"; exit 1; fi; adb shell dumpsys input_method > "artifacts/eve-ime/close-$ROUND.txt"; echo ">> [PASS] IME cycle $ROUND reached WindowInsets visible -> hidden with stable PID"; done

            adb shell pidof com.sonharf.game | tr -d '\r' > artifacts/eve-ime/current-pid.txt || true
            cmp -s artifacts/eve-ime/base-pid.txt artifacts/eve-ime/current-pid.txt || (echo "::error::App process changed/restarted during IME stress"; exit 1)
            adb shell dumpsys activity activities > artifacts/eve-ime/activities.txt || true
            adb shell dumpsys input_method > artifacts/eve-ime/input-method-final.txt || true
            adb shell dumpsys window windows > artifacts/eve-ime/windows.txt || true
            adb exec-out screencap -p > artifacts/eve-ime/after-ime.png
            grep -q "EveImeSmokeActivity" artifacts/eve-ime/activities.txt || (echo "::error::EveImeSmokeActivity is no longer active after IME stress"; exit 1)
            ! grep -Eqi "createVkSurfaceKHR|vkCreateAndroidSurfaceKHR|PostconditionPanic|Fatal signal|FATAL EXCEPTION|SIGABRT|SIGSEGV|GL_OUT_OF_MEMORY|ANR in com\.sonharf\.game|Input dispatching timed out" artifacts/eve-ime/full-logcat.txt || (echo "::error::Native/Surface/ANR signature found during Eve IME stress"; exit 1)
            echo "EVE_IME_PASS_5"
            echo ">> [PASS] Eve survived 5 real WindowInsets IME cycles on one Surface with stable PID and no Vulkan panic or ANR"

      - name: Upload Eve runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Eve-3D-Runtime-Smoke
          path: |
            artifacts/eve-home/
            artifacts/eve-smoke/
            artifacts/eve-ime/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Eve-Vulkan-IME-Stable-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14