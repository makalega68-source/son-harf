name: One Time UI Polish

on:
  push:
    branches: ["claude/son-harf-game-screen-design-bhju07"]
    paths: [".github/workflows/ui-polish-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/son-harf-game-screen-design-bhju07
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/ui_polish_once.py
      - name: Commit patch
        run: |
          git rm .github/workflows/ui-polish-once.yml .github/scripts/ui_polish_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremiumHomeV3.kt
          git add app/src/main/java/com/sonharf/game/LetterLadderGame.kt
          git add app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          git add app/src/test/java/com/sonharf/game/LogoFreeGameSurfacesRegressionTest.kt
          git commit -m "Remove game logos from active premium surfaces"
          git push origin HEAD:claude/son-harf-game-screen-design-bhju07

# retry: remaining Harf Yolu surface handled
