name: Frame + Dictionary V3 Validation

on:
  push:
    branches:
      - prod-frame-dictionary-tr-en-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod-frame-dictionary-tr-en-v3
          fetch-depth: 0

      - name: Materialize purchased frame assets
        run: |
          python3 scripts/finalize_frame_dictionary_v3.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'style_frame_red.png': 'fa2c79145b5857707a2e099689d3e727978787bca346a163687d57b63548aa2c',
            'style_frame_green.png': '6af938fccced86f0532e413394a9cb3fc7dd0547701ed2ca3cb6a8d6587daaf4',
            'style_frame_mint.png': '42e6ce85dbb5b7865b4d0a8b585b392736a11e4c1d1859dfb2e4274ded458006',
            'style_frame_purple.png': '1fbf3e261b0aef85095c432cfca738f2f61af27d6a02bd77f28b89d1d642b729',
            'style_frame_gold.png': 'cac4d53c168a52773822189d205880e959174011117700b5e563325c2bd813a8',
            'style_frame_gold_crown.png': '1e955fe915d8b1b35045a21c1c4221521dfdfe4355c9321c591bd172b802ff05',
            'style_frame_christmas.png': '48fa2d6afd6f95e25c0ac7ac8330a7e8d97a653fdb98f9c17e1a0b226e24082d',
            'style_frame_halloween.png': '96598d5769d25f7520291e83248b1e9fa8f2984aa2822b41df3525bc63fbf62d',
          }
          root=Path('app/src/main/res/drawable-nodpi')
          for name,want in expected.items():
              p=root/name
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==want, (name, got, want)
              assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), name
              print(name, p.stat().st_size, got)
          PY

      - name: Assert canonical dictionary V3 contracts
        run: |
          grep -q 'get_dictionary_snapshot_v3' app/src/main/java/com/sonharf/game/data/SharedDictionaryService.kt
          grep -q 'MIN_CANONICAL_LENGTH = 2' app/src/main/java/com/sonharf/game/data/SharedDictionaryService.kt
          grep -q 'frame_asset_christmas' app/src/main/java/com/sonharf/game/PurchasedStyleUi.kt
          grep -q 'frame_asset_halloween' app/src/main/java/com/sonharf/game/PurchasedStyleUi.kt
          grep -q 'char_length(d.normalized_word) between 2 and 12' supabase/migrations/20260903093000_dictionary_snapshot_v3_and_purchased_frames_repair.sql

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.14.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Compile, unit test and assemble
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug

      - name: Commit verified generated assets
        if: github.event_name == 'push'
        run: |
          git rm -r tools/frame_assets_v3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/style_frame_*.png app/src/main/java/com/sonharf/game/PurchasedStyleUi.kt scripts/finalize_frame_dictionary_v3.py
          if ! git diff --cached --quiet; then
            git commit -m "Finalize verified purchased frames [skip ci]"
            git push origin HEAD:prod-frame-dictionary-tr-en-v3
          fi
