name: Auth Language Brand Patch

on:
  push:
    branches: [ fix/auth-language-brand-20260920 ]
    paths:
      - 'tools/auth-language-brand-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-language-brand-20260920
          fetch-depth: 0
      - name: Apply exact UI patch
        run: python tools/patch_auth_language_brand.py
      - name: Validate source diff
        run: |
          git diff --check
          grep -n 'kelime_kusatma_logo_hd' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          grep -n 'KELİME KUŞATMASI' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          grep -n 'REGISTER' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          grep -n 'Player name' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          grep -n 'KELİME KUŞATMASI / WORD SIEGE' app/src/main/java/com/sonharf/game/StableV1App.kt
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/RequiredAuthGate.kt app/src/main/java/com/sonharf/game/StableV1App.kt
          git commit -m "Localize auth UI and align Kelime Kusatmasi branding [skip ci]"
          git push origin HEAD:fix/auth-language-brand-20260920
