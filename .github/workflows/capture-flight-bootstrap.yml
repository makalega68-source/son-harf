name: Word Siege Capture Flight Bootstrap

on:
  push:
    branches:
      - codex/siege-capture-score-flight

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Apply capture score flight patch
        run: |
          python3 tools/complete_capture_score_flight.py
          sed -i 's/import androidx.compose.foundation.drawBehind/import androidx.compose.ui.draw.drawBehind/' app/src/main/java/com/sonharf/game/WordSiegeGameUi.kt

      - name: Unit tests and debug build
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/complete_capture_score_flight.py .github/workflows/capture-flight-bootstrap.yml
          git add \
            app/src/main/java/com/sonharf/game/WordSiegeGameUi.kt \
            app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt \
            app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt \
            app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt \
            app/src/main/java/com/sonharf/game/WordSiegeCaptureEffect.kt \
            app/src/main/java/com/sonharf/game/WordSiegeCaptureMotion.kt \
            app/src/test/java/com/sonharf/game/WordSiegeCaptureEffectTest.kt \
            app/src/test/java/com/sonharf/game/WordSiegeCaptureMotionTest.kt \
            app/src/test/java/com/sonharf/game/WordSiegeFinalRulesTest.kt
          git diff --cached --check
          git commit -m "Complete siege capture score flight"
          git push origin HEAD:codex/siege-capture-score-flight

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kelime-Tahti-Guncel.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-tahti-guncel-bootstrap
          path: Kelime-Tahti-Guncel.apk
          if-no-files-found: error
          retention-days: 7
