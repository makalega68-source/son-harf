name: Apply V2 Runtime Integration
on:
  push:
    branches: [integration/v2-premium-corrected-final-20260919]
    paths:
      - 'tools/patch_v2_runtime_integration.py'
      - '.github/workflows/apply-v2-runtime-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v2-premium-corrected-final-20260919
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply deterministic runtime patch
        run: python tools/patch_v2_runtime_integration.py
      - name: Guard canonical V2 visual authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PremiumCanvaAppV2' app/src/main/java/com/sonharf/game/StableV1App.kt
          ! grep -q 'MonsterLime' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'lightColorScheme' app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
          grep -q 'SERİ OYUN' app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
          grep -q 'getSeriesFriends' app/src/main/java/com/sonharf/game/WordSiegeSeriesScreen.kt
          grep -q 'blackThemeOwned && gameThemeId == BLACK_THEME_ID' app/src/main/java/com/sonharf/game/CosmeticRuntime.kt
      - name: Compile and unit test
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Commit only tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt app/src/main/java/com/sonharf/game/PremiumStoreScreen.kt app/src/main/java/com/sonharf/game/UnifiedProVipScreen.kt app/src/main/java/com/sonharf/game/WordSiegeSeriesScreen.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(v2): integrate Series and authoritative premium runtime'
          git push origin HEAD:integration/v2-premium-corrected-final-20260919
