name: Safe Brand + Premium Home Integration

on:
  push:
    branches: [ feat/brand-premium-home-safe-20260910 ]

permissions:
  contents: write

concurrency:
  group: brand-premium-home-safe
  cancel-in-progress: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/brand-premium-home-safe-20260910

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Apply guarded UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_brand_premium_home.py

          # The historical raster logo in the staging branch is not a valid WebP.
          # Never ship or decode it. Restore the tracked root logo and replace the
          # in-app identity with a pure Compose SH monogram.
          git restore --source=HEAD -- son-harf-logo.webp
          rm -f app/src/main/res/drawable-nodpi/son_harf_brand_logo.webp

          cat > app/src/main/java/com/sonharf/game/SonHarfOfficialLogo.kt <<'KOTLIN'
          package com.sonharf.game

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.BoxWithConstraints
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.aspectRatio
          import androidx.compose.foundation.layout.fillMaxHeight
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Surface
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          /**
           * User-facing Son Harf SH monogram.
           * Pure Compose by design: no raster decode path can affect startup or navigation.
           */
          @Composable
          fun SonHarfOfficialLogo(
              modifier: Modifier = Modifier,
          ) {
              BoxWithConstraints(modifier = modifier) {
                  val gap = (maxHeight.value * 0.08f).coerceIn(6f, 12f).dp
                  val corner = (maxHeight.value * 0.18f).coerceIn(10f, 24f).dp
                  val letterSize = (maxHeight.value * 0.46f).coerceIn(22f, 62f).sp
                  Row(
                      modifier = Modifier.fillMaxSize(),
                      horizontalArrangement = Arrangement.spacedBy(gap, Alignment.CenterHorizontally),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      SonHarfMonogramTile(
                          letter = "S",
                          modifier = Modifier.fillMaxHeight().aspectRatio(1f),
                          corner = corner,
                          letterSize = letterSize.value,
                      )
                      SonHarfMonogramTile(
                          letter = "H",
                          modifier = Modifier.fillMaxHeight().aspectRatio(1f),
                          corner = corner,
                          letterSize = letterSize.value,
                      )
                  }
              }
          }

          @Composable
          private fun SonHarfMonogramTile(
              letter: String,
              modifier: Modifier,
              corner: androidx.compose.ui.unit.Dp,
              letterSize: Float,
          ) {
              Surface(
                  modifier = modifier,
                  shape = RoundedCornerShape(corner),
                  color = Color(0xFFF9F5E8),
                  border = BorderStroke(1.5.dp, Color(0xFF5E8069)),
                  shadowElevation = 4.dp,
              ) {
                  Box(
                      modifier = Modifier.fillMaxSize().padding(4.dp),
                      contentAlignment = Alignment.Center,
                  ) {
                      Text(
                          text = letter,
                          color = Color(0xFF3F614E),
                          fontSize = letterSize.sp,
                          fontWeight = FontWeight.Black,
                      )
                  }
              }
          }
          KOTLIN

      - name: Verify targeted source contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- son-harf-logo.webp
          grep -q '@drawable/son_harf_app_icon_safe' app/src/main/AndroidManifest.xml
          grep -q 'SonHarfBrandLogo' app/src/main/java/com/sonharf/game/MainActivity.kt
          grep -q 'SonHarfOfficialLogo' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          grep -q 'SonHarfOfficialLogo' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'SonHarfOfficialLogo' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'letter = "S"' app/src/main/java/com/sonharf/game/SonHarfOfficialLogo.kt
          grep -q 'letter = "H"' app/src/main/java/com/sonharf/game/SonHarfOfficialLogo.kt
          ! grep -q 'painterResource' app/src/main/java/com/sonharf/game/SonHarfOfficialLogo.kt
          grep -q 'HAFTA ŞAMPİYONU' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'private fun WeeklyChampionHero' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'private fun WeeklyRunnerCard' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          ! grep -q 'private fun WeeklyChampionCard' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'SonHarfTopAdBanner(isPremium = isPro)' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.GAME -> OnlineGameScreenV6()' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'val Background: Color get() = SonHarfTheme.Background' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          test -f app/src/main/res/drawable/son_harf_app_icon_safe.xml
          test ! -f app/src/main/res/drawable/son_harf_app_icon.webp
          test ! -e app/src/main/res/drawable-nodpi/son_harf_brand_logo.webp

      - name: Build debug APK with unit tests
        run: gradle clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Brand-Premium-Test.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs SonHarf-Brand-Premium-Test.apk
          sha256sum SonHarf-Brand-Premium-Test.apk | tee SonHarf-Brand-Premium-Test.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-brand-premium-apk
          path: |
            SonHarf-Brand-Premium-Test.apk
            SonHarf-Brand-Premium-Test.sha256
          if-no-files-found: error

      - name: Commit only after green build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_brand_premium_home.py
          rm -f .github/workflows/brand-premium-home-safe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Markayı güvenli entegre et ve haftanın zirvesini premiumlaştır"
          git push origin HEAD:feat/brand-premium-home-safe-20260910
