name: One Time Single Game Entry

on:
  push:
    branches: ["claude/son-harf-game-screen-design-bhju07"]
    paths: [".github/workflows/single-game-entry-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/son-harf-game-screen-design-bhju07
          fetch-depth: 0
      - name: Apply single-entry patch
        run: python3 .github/scripts/single_game_entry_patch.py
      - name: Commit patch
        run: |
          git rm .github/workflows/single-game-entry-once.yml .github/scripts/single_game_entry_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Collapse game flows to one simple entry screen"
          git push origin HEAD:claude/son-harf-game-screen-design-bhju07
