name: Drive transfer probe
on:
  push:
    branches: [recovery/import-80b5099]
    paths: [.github/workflows/drive-transfer-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe anonymous bundle download
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://drive.usercontent.google.com/download?id=1VOKE_qa2w5JXQuKXIHGC2HMOsXlT0yIR&export=download&confirm=t'
          curl -L --fail --retry 2 -D /tmp/headers -o /tmp/bundle "$URL"
          cat /tmp/headers
          wc -c /tmp/bundle
          sha256sum /tmp/bundle
          file /tmp/bundle
          head -c 120 /tmp/bundle | base64
