name: Fix LightDuel Imports

on:
  push:
    branches:
      - fix/active-screen-authority-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/active-screen-authority-20260904
      - name: Add only required active-screen icon imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sonharf/game/LightDuelUi.kt')
          t = p.read_text()
          anchor = 'import androidx.compose.foundation.text.KeyboardOptions\n'
          imports = (
              'import androidx.compose.material.icons.Icons\n'
              'import androidx.compose.material.icons.rounded.Flag\n'
              'import androidx.compose.material.icons.rounded.MoreVert\n'
          )
          if 'import androidx.compose.material.icons.Icons\n' not in t:
              assert t.count(anchor) == 1
              t = t.replace(anchor, anchor + imports, 1)
          assert 'Icons.Rounded.MoreVert' in t
          assert 'Icons.Rounded.Flag' in t
          p.write_text(t)
          PY
          git diff --check
      - name: Persist repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/LightDuelUi.kt
          git diff --cached --exit-code || git commit -m "fix(classic): import active match menu icons"
          git push origin HEAD:fix/active-screen-authority-20260904
