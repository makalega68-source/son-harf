name: Current APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/current-apk-build.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'ci/build-trigger-gender-symbols.txt'

permissions:
  contents: write

jobs:
  build-current-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Compile, test and build APK
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee current-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish result to repository
        shell: bash
        run: |
          mkdir -p dist
          cp current-build.log dist/CURRENT_BUILD_LOG.txt
          if [ "${{ steps.gradle_build.outputs.exit_code }}" = "0" ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/SonHarf-Current.apk
            printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/CURRENT_BUILD_OK.txt
            rm -f dist/CURRENT_BUILD_FAIL.txt
          else
            printf 'commit=%s\nfailed_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/CURRENT_BUILD_FAIL.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/CURRENT_BUILD_LOG.txt dist/CURRENT_BUILD_OK.txt dist/CURRENT_BUILD_FAIL.txt dist/SonHarf-Current.apk 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Publish current APK build result [skip ci]"
          git push
      - name: Fail workflow if build failed
        if: steps.gradle_build.outputs.exit_code != '0'
        run: exit 1
