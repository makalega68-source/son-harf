name: Current APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/current-apk-build.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'ci/build-trigger-gender-symbols.txt'

permissions:
  contents: write

jobs:
  build-current-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending Monster duel migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply_monster_duel_theme.py ]; then
            python scripts/apply_monster_duel_theme.py
          fi
          if [ -f scripts/rebuild_monster_duel_layout.py ]; then
            python scripts/rebuild_monster_duel_layout.py
          fi
          if ! git diff --quiet -- app/src/main/java/com/sonharf/game/LightDuelUi.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/sonharf/game/LightDuelUi.kt
            git commit -m "Rebuild duel lobby and arena with Monster layout [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Compile, test and build APK
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee current-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish result to repository
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/current-apk-publish"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp current-build.log "$publish_dir/CURRENT_BUILD_LOG.txt"

          if [ "${{ steps.gradle_build.outputs.exit_code }}" = "0" ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "$publish_dir/SonHarf-Current.apk"
            printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$publish_dir/CURRENT_BUILD_OK.txt"
          else
            printf 'commit=%s\nfailed_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$publish_dir/CURRENT_BUILD_FAIL.txt"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p dist
            cp "$publish_dir/CURRENT_BUILD_LOG.txt" dist/CURRENT_BUILD_LOG.txt
            if [ -f "$publish_dir/SonHarf-Current.apk" ]; then
              cp "$publish_dir/SonHarf-Current.apk" dist/SonHarf-Current.apk
              cp "$publish_dir/CURRENT_BUILD_OK.txt" dist/CURRENT_BUILD_OK.txt
              rm -f dist/CURRENT_BUILD_FAIL.txt
            else
              cp "$publish_dir/CURRENT_BUILD_FAIL.txt" dist/CURRENT_BUILD_FAIL.txt
              rm -f dist/CURRENT_BUILD_OK.txt
            fi

            git add -f dist/CURRENT_BUILD_LOG.txt dist/CURRENT_BUILD_OK.txt dist/CURRENT_BUILD_FAIL.txt dist/SonHarf-Current.apk 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Current APK result already published."
              exit 0
            fi
            git commit -m "Publish current APK build result [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish raced with another workflow; retrying ($attempt/5)."
            sleep 2
          done
          echo "::error::Could not publish current APK after 5 retries."
          exit 1
      - name: Fail workflow if build failed
        if: steps.gradle_build.outputs.exit_code != '0'
        run: exit 1
