name: Reference Home Preview

on:
  push:
    branches:
      - preview/reference-home-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build exact preview code
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Boot emulator, install app and capture real screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p preview-output
            adb shell wm size 691x1536
            adb shell wm density 284
            adb shell settings put system font_scale 1.0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.sonharf.game
            adb shell am start -n com.sonharf.game/.ReferencePreviewActivity
            sleep 12
            adb shell dumpsys activity activities > preview-output/activity.txt || true
            adb shell dumpsys window windows > preview-output/window.txt || true
            adb logcat -d > preview-output/logcat.txt || true
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml preview-output/window.xml || true
            adb exec-out screencap -p > preview-output/reference-home-real.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SonHarf-Reference-Home-Real-Screenshot
          path: preview-output/
          if-no-files-found: warn
          retention-days: 7
