name: Import Duel Reference Skin

on:
  push:
    branches:
      - reference-skin-integration-20260830
    paths:
      - .github/workflows/import-duel-reference-skin.yml

permissions:
  contents: write

jobs:
  import-skin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reference-skin-integration-20260830
      - name: Import exact approved duel reference
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -L --fail --retry 3             'https://d2ol7oe51mr4n9.cloudfront.net/user_3IF9zXlHgFrus43xyiNWubj7Vka/8381cff9-a252-4c6d-986b-00672f170d7d.png'             -o app/src/main/res/drawable-nodpi/duel_reference_skin.png
          file app/src/main/res/drawable-nodpi/duel_reference_skin.png
      - name: Commit imported skin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/duel_reference_skin.png
          git diff --cached --quiet && exit 0
          git commit -m "Import approved duel reference skin"
          git push origin HEAD:reference-skin-integration-20260830
