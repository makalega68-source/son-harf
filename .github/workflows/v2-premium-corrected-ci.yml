name: Canonical V2 Premium Corrected CI
on:
  push:
    branches: [integration/v2-premium-corrected-final-20260919]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v2-premium-corrected-final-20260919
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: V2 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PremiumCanvaAppV2' app/src/main/java/com/sonharf/game/StableV1App.kt
          ! grep -q 'MonsterLime' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'lightColorScheme' app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
          grep -q 'PremiumWeeklyBestPolished' app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
          grep -q 'PremiumV2BottomBar' app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
          grep -q 'Kelime Kuşatması' app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
          grep -q 'SON HARF' app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
          grep -q 'HARF YOLU' app/src/main/java/com/sonharf/game/PremiumCanvaAppV2.kt
      - name: Canva and product source contracts
        shell: bash
        run: |
          set -euo pipefail
          for a in premium_series_game_canva.webp premium_letter_table_canva.webp premium_score_calculator_canva.webp premium_pro_canva.webp; do
            p="app/src/main/res/drawable-nodpi/$a"
            test -s "$p"
            bytes=$(stat -c%s "$p")
            test "$bytes" -gt 1000
            test "$bytes" -lt 2000000
          done
          grep -q 'R.drawable.premium_series_game_canva' app/src/main/java/com/sonharf/game/GooglePlayProductsCard.kt
          grep -q 'R.drawable.premium_letter_table_canva' app/src/main/java/com/sonharf/game/GooglePlayProductsCard.kt
          grep -q 'R.drawable.premium_score_calculator_canva' app/src/main/java/com/sonharf/game/GooglePlayProductsCard.kt
          grep -q 'R.drawable.premium_pro_canva' app/src/main/java/com/sonharf/game/GooglePlayProductsCard.kt
          ! grep -R --line-number -E 'R\.drawable\.premium_(series_game|letter_table|score_calculator|pro)([^_a-zA-Z]|$)' app/src/main/java || (echo 'placeholder premium vector reference found' >&2; exit 1)
          grep -q 'series_game' app/src/main/java/com/sonharf/game/billing/ProductCatalog.kt
          grep -q 'letter_table' app/src/main/java/com/sonharf/game/billing/ProductCatalog.kt
          grep -q 'score_calculator' app/src/main/java/com/sonharf/game/billing/ProductCatalog.kt
          grep -q 'pro_lifetime' app/src/main/java/com/sonharf/game/billing/ProductCatalog.kt
          grep -q 'seriesGameDirectOwned' app/src/main/java/com/sonharf/game/data/VipEntitlements.kt
          grep -q 'PRO İLE AÇIK' app/src/main/java/com/sonharf/game/GooglePlayProductsCard.kt
      - name: Premium security contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'get_premium_entitlements_v2' app/src/main/java/com/sonharf/game/data/VipEntitlements.kt
          grep -q 'preview_word_siege_move_pro_v1' app/src/main/java/com/sonharf/game/data/PremiumWordSiegeBackend.kt
          grep -q 'get_word_siege_letter_table_v1' app/src/main/java/com/sonharf/game/data/PremiumWordSiegeBackend.kt
          grep -q 'theme_black' app/src/main/java/com/sonharf/game/CosmeticRuntime.kt
          ! grep -q 'theme_dark_arena.*BLACK_THEME_ID' app/src/main/java/com/sonharf/game/CosmeticRuntime.kt
          ! grep -q 'theme_black' app/src/main/java/com/sonharf/game/billing/ProductCatalog.kt
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble installable debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: APK integrity
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk" | tee APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kelime-kusatmasi-v2-premium-corrected-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 7
