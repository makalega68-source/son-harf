name: Account Session Cleanup Patch

on:
  push:
    branches: [ fix/account-session-cleanup-20260920 ]
    paths:
      - 'tools/account-session-cleanup-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-session-cleanup-20260920
          fetch-depth: 0
      - name: Apply exact session cleanup patch
        run: python tools/patch_account_session_cleanup.py
      - name: Validate source diff
        run: |
          git diff --check
          grep -n 'getBoolean(REMEMBER_LOGIN, false)' app/src/main/java/com/sonharf/game/SonHarfPreferences.kt
          grep -n 'RememberedCredentialVault.clear(context)' app/src/main/java/com/sonharf/game/MainSettingsVipScreen.kt
          grep -n 'RememberedCredentialVault.clear(context)' app/src/main/java/com/sonharf/game/FinalProfileScreen.kt
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/SonHarfPreferences.kt \
                  app/src/main/java/com/sonharf/game/MainSettingsVipScreen.kt \
                  app/src/main/java/com/sonharf/game/FinalProfileScreen.kt
          git commit -m "Clear remembered credentials on logout and account deletion [skip ci]"
          git push origin HEAD:fix/account-session-cleanup-20260920
