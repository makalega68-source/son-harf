name: Agent Style Pan Patch
on:
  push:
    branches:
      - feat/premium-style-private-room-bot-ui-20260831
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-style-private-room-bot-ui-20260831
          fetch-depth: 0
      - name: Apply isolated patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/style-pan.patch
          git apply /tmp/style-pan.patch
          curl -fsSL 'https://d8j0ntlcm91z4.cloudfront.net/user_3IF9zXlHgFrus43xyiNWubj7Vka/hf_20260901_071503_bcc696ac-9532-450b-983b-0d6d6e16c169_min.webp' -o app/src/main/res/drawable-nodpi/premium_victory_crown_preview_higgsfield.webp
          curl -fsSL 'https://d8j0ntlcm91z4.cloudfront.net/user_3IF9zXlHgFrus43xyiNWubj7Vka/hf_20260901_071503_ef116d34-2abd-4f94-a205-019d953e110d_min.webp' -o app/src/main/res/drawable-nodpi/premium_mascot_white_preview_higgsfield.webp
          rm .github/workflows/agent-style-pan-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game/WordSiegeExperience.kt app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt app/src/main/java/com/sonharf/game/EconomyShopScreen.kt app/src/test/java/com/sonharf/game/StylePanFrameContractTest.kt app/src/main/res/drawable-nodpi/premium_victory_crown_preview_higgsfield.webp app/src/main/res/drawable-nodpi/premium_mascot_white_preview_higgsfield.webp .github/workflows/agent-style-pan-patch.yml
          git diff --cached --check
          git commit -m 'fix(style): real previews frames and bounded Word Siege pan'
          git push origin HEAD:feat/premium-style-private-room-bot-ui-20260831
