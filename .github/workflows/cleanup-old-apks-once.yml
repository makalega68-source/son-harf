name: Cleanup old APKs once

on:
  push:
    branches:
      - claude/son-harf-game-screen-design-bhju07
    paths:
      - '.github/workflows/cleanup-old-apks-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: '19d36265eed16861852bfcb115cdeeeb674863a565f5ed8e23908b42f110564b'
      CANONICAL_TAG: 'canonical-test-apk'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify canonical APK release
        run: |
          set -euo pipefail
          COUNT="$(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | .assets[]? | select(.name | endswith(".apk"))] | length')"
          test "$COUNT" = '1'
          DIGEST="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$CANONICAL_TAG" --jq '.assets[] | select(.name == "SonHarf-Final-Test.apk") | .digest')"
          test "$DIGEST" = "sha256:$EXPECTED_SHA256"

      - name: Repeatedly delete APK and AAB Actions artifacts
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5 6 7 8; do
            gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.name | ascii_downcase | contains("apk")) or (.name | ascii_downcase | contains("aab"))) | .id' \
              > /tmp/apk-artifact-ids.txt
            remaining="$(wc -l < /tmp/apk-artifact-ids.txt | tr -d ' ')"
            echo "pass=$pass remaining=$remaining"
            if [ "$remaining" = '0' ]; then
              break
            fi
            xargs -r -P16 -I{} sh -c 'gh api --method DELETE "/repos/'"$GITHUB_REPOSITORY"'/actions/artifacts/{}" >/dev/null 2>&1 || true' < /tmp/apk-artifact-ids.txt
            sleep 2
          done

      - name: Final canonical APK verification
        run: |
          set -euo pipefail
          COUNT="$(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | .assets[]? | select(.name | endswith(".apk"))] | length')"
          test "$COUNT" = '1'
          ACTUAL="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$CANONICAL_TAG" --jq '.assets[] | select(.name == "SonHarf-Final-Test.apk") | .digest')"
          test "$ACTUAL" = "sha256:$EXPECTED_SHA256"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | ascii_downcase | contains("apk")) or (.name | ascii_downcase | contains("aab"))) | [.id,.name] | @tsv' \
            > /tmp/remaining-apk-artifacts.txt
          cat /tmp/remaining-apk-artifacts.txt
          test ! -s /tmp/remaining-apk-artifacts.txt
