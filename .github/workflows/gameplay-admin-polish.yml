name: Gameplay Admin Polish

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameplay-admin-polish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  polish-test-build:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/gameplay-admin-polish-20260822')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply protected polish
        run: |
          python3 scripts/apply_gameplay_admin_polish.py
          grep -q 'import androidx.compose.ui.graphics.Color' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt || sed -i '/import androidx.compose.ui.focus.focusRequester/a import androidx.compose.ui.graphics.Color' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt
      - name: Verify requested contracts
        run: |
          grep -q 'focusRequester(focusRequester)' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt
          grep -q 'keyboard?.show()' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt
          grep -q 'input = ""' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt
          grep -q 'timerPulse' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt
          grep -q 'ProfilePhotoAvatar' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt
          grep -q 'background(SonHarfBg).statusBarsPadding().navigationBarsPadding()' app/src/main/java/com/sonharf/game/ComboOverlayV9.kt
          grep -q 'WindowInsets.safeDrawing' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          ! grep -q 'Oturum korunur' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          ! grep -q 'E-posta doğrulaması tamamlanmadan oyun ekranları açılmaz' app/src/main/java/com/sonharf/game/RequiredAuthGate.kt
          grep -q 'DUYURU PANOSU' app/src/main/java/com/sonharf/game/AdminConsoleScreen.kt
          grep -q 'AYLIK GELİR' app/src/main/java/com/sonharf/game/AdminConsoleScreen.kt
          grep -q 'makalega68@gmail.com' supabase/migrations/20260822_admin_exact_owner_monthly_revenue_announcements.sql
      - name: Compile debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all
      - name: Commit tested repairs
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/RequiredAuthGate.kt \
                  app/src/main/java/com/sonharf/game/BilBakalimFeature.kt \
                  app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt \
                  app/src/main/java/com/sonharf/game/ComboOverlayV9.kt \
                  app/src/main/java/com/sonharf/game/AdminConsoleScreen.kt \
                  app/src/main/java/com/sonharf/game/data/AdminConsole.kt
          git diff --cached --quiet || git commit -m "Apply gameplay and owner admin polish [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-gameplay-admin-polish-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
