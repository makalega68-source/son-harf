name: Finalize Supabase Auth Email

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/supabase-auth-finalize.yml"
      - "supabase/templates/confirm-signup.html"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret bulunamadı."
            exit 2
          fi
          echo "SUPABASE_TOKEN=$SUPABASE_ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Read current Auth config
        env:
          PROJECT_REF: bzdtftzdjtjoqhtcqtxb
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -H "Authorization: Bearer $SUPABASE_TOKEN"             -H "Content-Type: application/json"             -o auth-current.json
          jq '{site_url,uri_allow_list,mailer_subjects_confirmation,smtp_admin_email,smtp_sender_name}' auth-current.json

      - name: Build minimal safe patch
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_ALLOW="$(jq -r '.uri_allow_list // ""' auth-current.json)"
          NEW_ALLOW="$CURRENT_ALLOW"
          if ! printf '%s' "$CURRENT_ALLOW" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -Fxq 'sonharf://auth'; then
            if [ -n "$CURRENT_ALLOW" ]; then
              NEW_ALLOW="$CURRENT_ALLOW,sonharf://auth"
            else
              NEW_ALLOW="sonharf://auth"
            fi
          fi
          jq -n             --arg subject "Son Harf • E-posta Adresini Doğrula"             --arg content "$(cat supabase/templates/confirm-signup.html)"             --arg allow "$NEW_ALLOW"             '{
              mailer_subjects_confirmation:$subject,
              mailer_templates_confirmation_content:$content,
              uri_allow_list:$allow
            }' > auth-patch.json

      - name: Apply Auth config
        env:
          PROJECT_REF: bzdtftzdjtjoqhtcqtxb
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o auth-update-response.json -w '%{http_code}'             -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -H "Authorization: Bearer $SUPABASE_TOKEN"             -H "Content-Type: application/json"             --data-binary @auth-patch.json)"
          if [ "$HTTP_CODE" != "200" ]; then
            cat auth-update-response.json
            echo "::error::Supabase Auth güncellemesi HTTP $HTTP_CODE döndü."
            exit 1
          fi

      - name: Verify live Auth config
        env:
          PROJECT_REF: bzdtftzdjtjoqhtcqtxb
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -H "Authorization: Bearer $SUPABASE_TOKEN"             -H "Content-Type: application/json"             -o auth-verified.json
          jq -e '.mailer_subjects_confirmation == "Son Harf • E-posta Adresini Doğrula"' auth-verified.json >/dev/null
          jq -e '(.mailer_templates_confirmation_content // "") | contains("E-postamı Doğrula")' auth-verified.json >/dev/null
          jq -e '(.mailer_templates_confirmation_content // "") | contains("{{ .Token }}")' auth-verified.json >/dev/null
          jq -e '(.uri_allow_list // "") | split(",") | map(gsub("^ +| +$";"")) | index("sonharf://auth") != null' auth-verified.json >/dev/null
          jq '{mailer_subjects_confirmation,uri_allow_list,smtp_admin_email,smtp_sender_name}' auth-verified.json

      - name: Summary
        run: |
          echo "### ✅ Son Harf Auth tamamlandı" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profesyonel confirm-signup mail şablonu canlı." >> "$GITHUB_STEP_SUMMARY"
          echo "- 6 haneli OTP şablonda mevcut." >> "$GITHUB_STEP_SUMMARY"
          echo "- sonharf://auth redirect allow list'te." >> "$GITHUB_STEP_SUMMARY"
