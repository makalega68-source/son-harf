name: Temporary Canonical Dictionary Real Frames Fix

on:
  push:
    branches: [ fix/canonical-dictionary-real-frames-20260902 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-dictionary-real-frames-fix
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-dictionary-real-frames-20260902
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 scripts/_apply_canonical_dictionary_real_frames_fix.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SharedDictionaryService.preloadCanonical' app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt
          grep -q 'ANA SÖZLÜK' app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt
          ! grep -q 'offlinePracticeTurkish' app/src/main/java/com/sonharf/game/data/SharedDictionaryService.kt
          ! grep -q 'it.id in PurchasedFrameCatalog.ids' app/src/main/java/com/sonharf/game/PurchasedStyleUi.kt
          grep -q 'legacyFrameSpec' app/src/main/java/com/sonharf/game/PurchasedStyleUi.kt

      - name: Commit validated source and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_apply_canonical_dictionary_real_frames_fix.py
          git rm .github/workflows/_temporary-canonical-dictionary-real-frames-fix.yml
          git add app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt \
                  app/src/main/java/com/sonharf/game/PurchasedStyleUi.kt \
                  app/src/test/java/com/sonharf/game/AssetIntegrationContractTest.kt
          git commit -m "Use canonical dictionary and restore full profile frame catalog [skip ci]"
          git push origin HEAD:fix/canonical-dictionary-real-frames-20260902

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Canonical-Dictionary-Real-Frames
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
