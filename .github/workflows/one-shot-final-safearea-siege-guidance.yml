name: One-shot final visual QA fixes

on:
  push:
    branches:
      - ui/real-purchased-pack-full-overhaul-20260921

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/real-purchased-pack-full-overhaul-20260921
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Patch final visual QA defects
        run: python3 .github/scripts/patch-final-safearea-siege-guidance.py

      - name: Test and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit verified visual fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-final-safearea-siege-guidance.yml .github/scripts/patch-final-safearea-siege-guidance.py
          git add app/src/main/java/com/sonharf/game/PremiumAdultApp.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePracticeGuidance.kt \
                  app/src/test/java/com/sonharf/game/PurchasedFinalSafeAreaSiegeGuidanceContractTest.kt
          git commit -m "ui: finish home safe area and siege guidance skin"
          git push origin HEAD:ui/real-purchased-pack-full-overhaul-20260921
