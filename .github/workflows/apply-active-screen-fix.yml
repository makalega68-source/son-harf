name: Apply Active Screen Fix

on:
  push:
    branches:
      - fix/active-screen-authority-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/active-screen-authority-20260904

      - name: Apply guarded patch
        run: |
          python3 tools/apply_active_screen_fix.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          board = Path('app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt')
          text = board.read_text()
          if 'import kotlinx.coroutines.delay' not in text:
              anchor = 'package com.sonharf.game\n\n'
              assert anchor in text
              text = text.replace(anchor, anchor + 'import kotlinx.coroutines.delay\n', 1)
          board.write_text(text)

          duel = Path('app/src/main/java/com/sonharf/game/LightDuelUi.kt')
          text = duel.read_text()
          state_anchor = '    var timeoutSignalKey by remember(room.id) { mutableStateOf<String?>(null) }\n'
          assert state_anchor in text
          text = text.replace(
              state_anchor,
              state_anchor + '    var showMoreMenu by remember(room.id) { mutableStateOf(false) }\n',
              1,
          )
          pattern = re.compile(r'''\s{16}CompetitivePlayerCard\(\n\s+opponentName\.removeSuffix\(" BOT"\), opponentAvatarPath, opponentGender, opponentRating, shownOppScore,\n\s+!myTurn && liveWordPhase, LRed, room\.isBot, Modifier\.weight\(1f\),\n\s+\)''')
          new = '''                Box(Modifier.weight(1f)) {
                    CompetitivePlayerCard(
                        opponentName.removeSuffix(" BOT"), opponentAvatarPath, opponentGender, opponentRating, shownOppScore,
                        !myTurn && liveWordPhase, LRed, room.isBot, Modifier.fillMaxWidth(),
                    )
                    Box(Modifier.align(Alignment.TopEnd)) {
                        IconButton(
                            onClick = { showMoreMenu = true },
                            modifier = Modifier.size(38.dp),
                        ) {
                            Icon(Icons.Rounded.MoreVert, sh("Diğer seçenekler", "More options"), tint = LText)
                        }
                        DropdownMenu(
                            expanded = showMoreMenu,
                            onDismissRequest = { showMoreMenu = false },
                        ) {
                            DropdownMenuItem(
                                text = { Text(sh("PES ET", "FORFEIT"), fontSize = 14.sp, fontWeight = FontWeight.Bold) },
                                onClick = {
                                    showMoreMenu = false
                                    onForfeit()
                                },
                                leadingIcon = { Icon(Icons.Rounded.Flag, null, tint = LRed) },
                            )
                        }
                    }
                }'''
          text, count = pattern.subn(new, text, count=1)
          assert count == 1, f'opponent card matches={count}'
          duel.write_text(text)

          contract = Path('app/src/test/java/com/sonharf/game/ActiveScreenRegressionContractTest.kt')
          text = contract.read_text()
          anchor = '        assertTrue(classic.contains("★ BONUS"))\n'
          assert anchor in text
          text = text.replace(
              anchor,
              anchor + '        assertTrue(classic.contains("Icons.Rounded.MoreVert"))\n        assertTrue(classic.contains("DropdownMenu("))\n',
              1,
          )
          contract.write_text(text)
          PY

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit persistent source changes
        run: |
          git checkout -- .github/workflows/android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          git diff --cached --exit-code || git commit -m "fix(game): repair active match and siege screens"
          git push origin HEAD:fix/active-screen-authority-20260904
