name: Temporary Premium Effects Patcher

on:
  push:
    branches:
      - feat/store-premium-effects-v1-20260919

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply premium effects runtime [effects-patched]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-premium-effects-v1-20260919
          fetch-depth: 0
      - name: Apply deterministic runtime patch
        shell: bash
        run: |
          python3 scripts/patch_premium_effects_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegeExperience.kt app/src/main/java/com/sonharf/game/MonsterStyleStoreScreen.kt
          git diff --cached --check
          git commit -m "Apply premium effects runtime [effects-patched]"
          git push origin HEAD:feat/store-premium-effects-v1-20260919
