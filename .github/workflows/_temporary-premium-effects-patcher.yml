name: Temporary Premium Effects Patcher

on:
  push:
    branches: [ feat/store-premium-effects-v1-20260919 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply premium effects runtime [effects-patched]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-premium-effects-v1-20260919
          fetch-depth: 0
      - name: Patch runtime hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          siege_path = Path('app/src/main/java/com/sonharf/game/WordSiegeExperience.kt')
          siege = siege_path.read_text()

          old_send = '''            onSend = {
              if (chatInput.isBlank() || busy) return@WordSiegeChatDialog
              val outgoing = chatInput
              busy = true
              scope.launch {
                  runCatching { backend.sendWordSiegeMessage(gameId, outgoing) }
                      .onSuccess {
                          chatInput = ""
                          messages = runCatching { backend.getWordSiegeMessages(gameId) }.getOrDefault(messages)
                      }
                      .onFailure { notice = wordSiegeFriendlyError(it.message.orEmpty()) }
                  busy = false
              }
          },'''
          new_send = '''            onSend = { outgoing ->
              val text = outgoing.trim().take(300)
              if (text.isBlank() || busy) return@WordSiegeChatDialog
              busy = true
              scope.launch {
                  runCatching { backend.sendWordSiegeMessage(gameId, text) }
                      .onSuccess {
                          if (chatInput.trim() == text) chatInput = ""
                          messages = runCatching { backend.getWordSiegeMessages(gameId) }.getOrDefault(messages)
                      }
                      .onFailure { notice = wordSiegeFriendlyError(it.message.orEmpty()) }
                  busy = false
              }
          },'''
          siege = replace_once(siege, old_send, new_send, 'word siege chat sender')

          start = siege.index('@Composable\nprivate fun WordSiegeFinishedCard(')
          end = siege.index('@Composable\ninternal fun WordSiegeNotice', start)
          finished = '''@Composable
          private fun WordSiegeFinishedCard(game: WordSiegeGameDto, me: String?) {
              val won = game.winnerId == me
              val draw = game.winnerId == null
              val accent = when { draw -> MainUi.Gold; won -> MainUi.Green; else -> MainUi.Red }
              Box(Modifier.fillMaxWidth()) {
                  Surface(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(18.dp),
                      color = accent.copy(alpha = .08f),
                      border = BorderStroke(1.dp, accent.copy(alpha = .45f)),
                  ) {
                      Column(Modifier.padding(14.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(
                              when { draw -> sh("BERABERE", "DRAW"); won -> sh("KUŞATMA SENİN!", "SIEGE WON!"); else -> sh("OYUN BİTTİ", "GAME OVER") },
                              color = accent,
                              fontSize = 17.sp,
                              fontWeight = FontWeight.Black,
                          )
                          Text(
                              sh("Sonuç = kelime puanı + sahip olunan alan", "Result = word score + owned territory"),
                              color = MainUi.Muted,
                              fontSize = 10.sp,
                          )
                      }
                  }
                  if (won && SonHarfCosmetics.crownVictory) {
                      CrownVictoryCelebration(
                          eventKey = "siege:${game.id}",
                          modifier = Modifier.matchParentSize(),
                          compact = true,
                      )
                  }
              }
          }

          '''
          siege = siege[:start] + finished + siege[end:]

          chat_start = siege.index('@Composable\nprivate fun WordSiegeChatDialog(')
          chat_end = siege.index('private fun WordSiegeGameDto.ownerFor', chat_start)
          chat = siege[chat_start:chat_end]
          chat = replace_once(chat, '    onSend: () -> Unit,', '    onSend: (String) -> Unit,', 'chat callback type')
          old_field = '''                Spacer(Modifier.height(8.dp))
              OutlinedTextField('''
          new_field = '''                Spacer(Modifier.height(8.dp))
              if (SonHarfCosmetics.emojiPackId == "emoji_vip") {
                  Text(sh("VIP TEPKİLER", "VIP REACTIONS"), color = MainUi.Gold, fontSize = 9.sp, fontWeight = FontWeight.Black)
                  Spacer(Modifier.height(5.dp))
                  VipEmojiReactionRow(enabled = !busy, onSend = onSend)
                  Spacer(Modifier.height(8.dp))
              }
              OutlinedTextField('''
          chat = replace_once(chat, old_field, new_field, 'VIP reaction row')
          old_click = 'IconButton(onClick = onSend, enabled = input.isNotBlank() && !busy) {'
          new_click = '''IconButton(
                          onClick = {
                              val text = input.trim()
                              if (text.isNotEmpty()) onSend(text)
                          },
                          enabled = input.isNotBlank() && !busy,
                      ) {'''
          chat = replace_once(chat, old_click, new_click, 'chat send button')
          siege = siege[:chat_start] + chat + siege[chat_end:]
          siege_path.write_text(siege)

          store_path = Path('app/src/main/java/com/sonharf/game/MonsterStyleStoreScreen.kt')
          store = store_path.read_text()
          store = replace_once(
              store,
              'StoreTab(sh("VİTRİN", "FEATURED"), setOf("game_theme", "profile_frame", "name_style", "keyboard_theme"), Icons.Rounded.AutoAwesome),',
              'StoreTab(sh("VİTRİN", "FEATURED"), setOf("game_theme", "profile_frame", "name_style", "keyboard_theme", "victory_effect", "emoji_pack"), Icons.Rounded.AutoAwesome),',
              'featured store kinds',
          )
          store = replace_once(
              store,
              'StoreTab(sh("TEMALAR", "THEMES"), setOf("game_theme", "keyboard_theme"), Icons.Rounded.Palette),\n        StoreTab(sh("PROFİL", "PROFILE"), setOf("name_style"), Icons.Rounded.Title),',
              'StoreTab(sh("TEMALAR", "THEMES"), setOf("game_theme", "keyboard_theme"), Icons.Rounded.Palette),\n        StoreTab(sh("EFEKTLER", "EFFECTS"), setOf("victory_effect", "emoji_pack"), Icons.Rounded.AutoAwesome),\n        StoreTab(sh("PROFİL", "PROFILE"), setOf("name_style"), Icons.Rounded.Title),',
              'effects tab',
          )
          ready_start = store.index('internal fun ShopItemDto.isRuntimeReadyStyle(): Boolean = when (kind) {')
          ready_end = store.index('internal fun EquippedCosmeticsDto?.isEquipped', ready_start)
          ready = '''internal fun ShopItemDto.isRuntimeReadyStyle(): Boolean = active && when (kind) {
              "game_theme" -> id in setOf("theme_black", "theme_dark_arena")
              "profile_frame" -> id in PurchasedFrameCatalog.ids
              "name_style" -> id in setOf("name_cyan", "name_sapphire", "name_amethyst", "name_aurelia")
              "keyboard_theme" -> id in setOf(
                  "keyboard_crystal",
                  "keyboard_obsidian",
                  "keyboard_midnight",
                  "keyboard_black_gold",
                  "keyboard_premium_white",
              )
              "victory_effect" -> id == "victory_crown"
              "emoji_pack" -> id == "emoji_vip"
              else -> false
          }

          '''
          store = store[:ready_start] + ready + store[ready_end:]
          store_path.write_text(store)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegeExperience.kt app/src/main/java/com/sonharf/game/MonsterStyleStoreScreen.kt
          git diff --cached --check
          git commit -m 'Apply premium effects runtime [effects-patched]'
          git push origin HEAD:feat/store-premium-effects-v1-20260919
