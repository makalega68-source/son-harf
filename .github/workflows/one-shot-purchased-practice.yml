name: One-shot purchased practice polish

on:
  push:
    branches:
      - ui/real-purchased-pack-full-overhaul-20260921

permissions:
  contents: write

jobs:
  patch-practice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/real-purchased-pack-full-overhaul-20260921
          fetch-depth: 0
      - name: Patch visible practice/fallback shell only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt')
          s = p.read_text()
          before = s

          exact = {
              'Surface(Modifier.fillMaxSize(), color = WordSiegeGameUi.Background) {\n        BoxWithConstraints(': 'Box(Modifier.fillMaxSize()) {\n        PurchasedGameBackdrop(Modifier.matchParentSize())\n        BoxWithConstraints(',
              'sh("KELİME TAHTI", "WORD THRONE")': 'sh("KELİME KUŞATMASI", "WORD SIEGE")',
              'if (won) sh("TAHT SENİN!", "THE THRONE IS YOURS!")': 'if (won) sh("KUŞATMA ZAFERİ!", "SIEGE VICTORY!")',
          }
          for old, new in exact.items():
              if old not in s:
                  raise SystemExit('Expected source token missing: ' + old[:90])
              s = s.replace(old, new, 1)

          confirm_pattern = re.compile(
              r'''(?ms)^\s{20}Row\(Modifier\.fillMaxWidth\(\)\) \{\n'''
              r'''\s{24}Button\(\n'''
              r'''\s+onClick = ::applyPlayerMove,.*?'''
              r'''\s{28}Text\(sh\("HAMLEYİ ONAYLA", "CONFIRM MOVE"\).*?\n'''
              r'''\s{24}\}\n'''
              r'''\s{20}\}'''
          )
          replacement = '''                    PurchasedButton(
                        text = sh("HAMLEYİ ONAYLA", "CONFIRM MOVE"),
                        onClick = ::applyPlayerMove,
                        enabled = canPlayerAct && placements.isNotEmpty(),
                        modifier = Modifier.fillMaxWidth().height(56.dp),
                        style = PurchasedButtonStyle.PRIMARY,
                        leadingAsset = PurchasedUiAsset.ICON_CHECK,
                    )'''
          s, count = confirm_pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one practice confirm CTA block, found {count}')

          required = [
              'WordSiegePracticeEngine.applyMove(state, 1, placements)',
              'resilientPracticeBotMove(',
              'WordSiegeFinalRules.cubeTransfer(state.playerArea)',
              'matchmakingFallback',
              'SharedDictionaryService.preloadCanonical',
              'PurchasedGameBackdrop(Modifier.matchParentSize())',
              'PurchasedUiAsset.ICON_CHECK',
              'sh("KELİME KUŞATMASI", "WORD SIEGE")',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit('Behavior/UI contract missing after patch: ' + token)
          if s == before:
              raise SystemExit('No practice changes produced')
          if 'sh("KELİME TAHTI", "WORD THRONE")' in s:
              raise SystemExit('Legacy practice brand still present')

          p.write_text(s)
          PY
      - name: Run focused regression tests and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-purchased-practice.yml
          git add app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt
          git commit -m "ui: finish purchased siege practice shell"
          git push origin HEAD:ui/real-purchased-pack-full-overhaul-20260921
