name: Mascot Lab Debug APK

on:
  push:
    branches:
      - feature/kelime-kusatmasi-mascot-lab-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Build mascot lab debug APK
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Upload mascot lab APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-kusatmasi-mascot-lab-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
