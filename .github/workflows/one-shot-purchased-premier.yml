name: One-shot purchased premier polish

on:
  push:
    branches:
      - ui/real-purchased-pack-full-overhaul-20260921

permissions:
  contents: write

jobs:
  patch-premier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/real-purchased-pack-full-overhaul-20260921
          fetch-depth: 0
      - name: Patch Son Harf visual shell
        run: python3 scripts/one_shot_premier_patch.py
      - name: Test and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit polished shell
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-purchased-premier.yml scripts/one_shot_premier_patch.py
          git add app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt app/src/test/java/com/sonharf/game/PremierDuelUxRegressionTest.kt
          git commit -m "ui: finish purchased Son Harf arena shell"
          git push origin HEAD:ui/real-purchased-pack-full-overhaul-20260921
