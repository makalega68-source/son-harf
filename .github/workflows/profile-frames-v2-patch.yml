name: Profile Frames V2 Patch

on:
  push:
    branches: [feature/profile-frames-store-20260919]
    paths:
      - 'automation/profile-frames-v2.trigger'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-frames-store-20260919
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Apply focused Profile Frames V2 patch
        run: |
          set -euo pipefail
          git apply --check automation/profile-frames-v2.patch
          git apply automation/profile-frames-v2.patch
      - name: Build and test debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremiumStoreScreen.kt app/src/main/java/com/sonharf/game/ProfileExperienceV2.kt
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Profile Frames V2 into store and profile"
          git push origin HEAD:feature/profile-frames-store-20260919
