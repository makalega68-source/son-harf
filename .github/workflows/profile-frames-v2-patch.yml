name: Profile Frames V2 Patch

on:
  push:
    branches: [feature/profile-frames-store-20260919]
    paths:
      - 'automation/profile-frames-v2.trigger'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-frames-store-20260919
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Apply focused Profile Frames V2 patch
        run: python3 automation/profile_frames_v2_patch.py
      - name: Remove remaining Profile V2 gender symbol
        run: python3 automation/remove_profile_v2_gender_symbol.py
      - name: Apply visibility and gender-symbol fix
        run: python3 automation/profile_frames_visibility_fix.py
      - name: Validate profile frame visual geometry
        run: python3 automation/validate_profile_frame_geometry.py
      - name: Build and test debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Stage installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk profile-frames-v2-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: profile-frames-v2-debug-apk
          path: profile-frames-v2-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Prepare side-by-side visual QA variant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          anchor = '    buildTypes {\n        getByName("release") {'
          replacement = '    buildTypes {\n        getByName("debug") {\n            applicationIdSuffix = ".frametest"\n            versionNameSuffix = "-frame-test"\n        }\n        getByName("release") {'
          if anchor not in text:
              raise SystemExit("Could not inject side-by-side debug applicationIdSuffix")
          gradle.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          values = Path("app/src/debug/res/values")
          values.mkdir(parents=True, exist_ok=True)
          (values / "profile_frame_test_name.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Kelime Kuşatması - Çerçeve Testi</string>\n</resources>\n',
              encoding="utf-8",
          )
          PY
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk profile-frames-v2-side-by-side.apk
      - name: Upload side-by-side visual QA APK
        uses: actions/upload-artifact@v4
        with:
          name: profile-frames-v2-side-by-side-apk
          path: profile-frames-v2-side-by-side.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/sonharf/game/PremiumStoreScreen.kt \
            app/src/main/java/com/sonharf/game/ProfileExperienceV2.kt \
            app/src/main/java/com/sonharf/game/ProfileFramesV2.kt \
            app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt \
            app/src/main/java/com/sonharf/game/MainPlayerProfileScreen.kt \
            app/src/main/java/com/sonharf/game/WordSiegeGameUi.kt \
            app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix visible profile frames across profile store and games"
          git push origin HEAD:feature/profile-frames-store-20260919