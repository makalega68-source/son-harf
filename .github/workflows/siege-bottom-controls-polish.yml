name: Siege Bottom Controls Polish

on:
  push:
    branches:
      - claude/kelime-tahti-home-redesign-7ojb7d
    paths:
      - 'tools/polish_siege_bottom_controls.py'
      - '.github/workflows/siege-bottom-controls-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: claude/kelime-tahti-home-redesign-7ojb7d
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Apply siege control polish
        run: python3 tools/polish_siege_bottom_controls.py

      - name: Unit tests and debug APK
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "kelime-tahti-ci"
          git config user.email "actions@github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/sonharf/game/WordSiegeGameUi.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeCompactBag.kt \
                  app/src/main/java/com/sonharf/game/WordSiegeCaptureMotion.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt \
                  app/src/main/java/com/sonharf/game/WordSiegePremiumPanel.kt
          git rm tools/polish_siege_bottom_controls.py
          git diff --cached --check
          git commit -m "Polish siege controls and PRO bag access"
          git push origin HEAD:claude/kelime-tahti-home-redesign-7ojb7d

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p final-apk
          cp app/build/outputs/apk/debug/app-debug.apk final-apk/Kelime-Tahti-Guncel.apk
          sha256sum final-apk/Kelime-Tahti-Guncel.apk > final-apk/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-tahti-siege-controls-v33
          path: final-apk/
          if-no-files-found: error
          retention-days: 7
