name: Premier Reconnect Server Clock Patch

on:
  push:
    branches: [ fix/premier-reconnect-fairness-20260920 ]
    paths:
      - 'tools/premier-reconnect-server-clock-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premier-reconnect-fairness-20260920
          fetch-depth: 0
      - name: Apply reconnect server-clock polish
        run: python tools/apply_premier_reconnect_server_clock_patch.py
      - name: Validate patched sources
        run: |
          git diff --check
          grep -n 'getPremierReconnectClock' app/src/main/java/com/sonharf/game/data/OnlineGameBackend.kt
          grep -n 'reconnectClock.remainingMs' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -n 'PremierReconnectBanner(language, reconnectingMe, turnSeconds)' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/data/OnlineGameBackend.kt \
                  app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          git commit -m "Anchor reconnect grace to server clock [skip ci]"
          git push origin HEAD:fix/premier-reconnect-fairness-20260920
