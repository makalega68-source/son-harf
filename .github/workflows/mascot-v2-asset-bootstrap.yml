name: Mascot V2 Asset Bootstrap

on:
  push:
    branches: [fix/mascot-visual-behavior-v2]
    paths:
      - 'ci/mascot-v2-bootstrap-trigger.txt'

permissions:
  contents: write

jobs:
  install-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mascot-visual-behavior-v2
      - name: Download verified white mascot GLB
        run: |
          set -euo pipefail
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IF9zXlHgFrus43xyiNWubj7Vka/078758f8-d82a-4d84-86fe-046d0fda8911.glb' -o app/src/main/assets/models/son_harf_white_pet_rigged.glb
          echo '27779dcb3a201013c47dc4a5099540a17984f805c998984f45ff84cf34426a41  app/src/main/assets/models/son_harf_white_pet_rigged.glb' | sha256sum -c -
          test "$(stat -c%s app/src/main/assets/models/son_harf_white_pet_rigged.glb)" = '781848'
      - name: Commit binary asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/models/son_harf_white_pet_rigged.glb
          git diff --cached --quiet && exit 0
          git commit -m 'Install corrected white mascot GLB [skip ci]'
          git push origin HEAD:fix/mascot-visual-behavior-v2
