name: Temporary profile avatar fix

on:
  push:
    branches:
      - fix/profile-frames-avatars-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-frames-avatars-20260906
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply guarded avatar fixes
        run: python scripts/fix_profile_avatars_temp.py
      - name: Verify source invariants
        run: |
          git diff --check
          grep -q 'FramedProfilePhotoAvatar' app/src/main/java/com/sonharf/game/LightDuelUi.kt
          grep -q 'playerFrameId = SonHarfCosmetics.profileFrameId' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          grep -q 'showGenderBadge: Boolean = true' app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt
          grep -q 'FramedProfilePhotoAvatar' app/src/test/java/com/sonharf/game/ProfileImageCoverageRegressionTest.kt
      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game app/src/test/java/com/sonharf/game
          git commit -m 'Fix profile photo and frame consistency'
          git push origin HEAD:fix/profile-frames-avatars-20260906
