name: Temporary profile avatar fix

on:
  push:
    branches: [ fix/profile-frames-avatars-20260906 ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-frames-avatars-20260906
          fetch-depth: 0
      - name: Apply guarded avatar fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          p = Path('app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt')
          text = p.read_text()
          start = text.index('internal fun ProfilePhotoAvatarWithGender(')
          end = text.index('@Composable\ninternal fun ProfilePhotoAvatarRectWithGender(', start)
          section = text[start:end]
          section = section.replace('    visible: Boolean = true,\n) {', '    visible: Boolean = true,\n    showGenderBadge: Boolean = true,\n) {', 1)
          section = section.replace('        Box(Modifier.align(Alignment.BottomEnd)) {\n            FramelessGenderSymbol(gender, size)\n        }', '        if (showGenderBadge) {\n            Box(Modifier.align(Alignment.BottomEnd)) {\n                FramelessGenderSymbol(gender, size)\n            }\n        }', 1)
          text = text[:start] + section + text[end:]
          start = text.index('internal fun ProfilePhotoAvatarRectWithGender(')
          section = text[start:]
          section = section.replace('    accent: Color = SonHarfCyan,\n) {', '    accent: Color = SonHarfCyan,\n    showGenderBadge: Boolean = true,\n) {', 1)
          section = section.replace('        Box(Modifier.align(Alignment.BottomEnd)) {\n            FramelessGenderSymbol(gender, height)\n        }', '        if (showGenderBadge) {\n            Box(Modifier.align(Alignment.BottomEnd)) {\n                FramelessGenderSymbol(gender, height)\n            }\n        }', 1)
          p.write_text(text[:start] + section)

          replace_once(
              'app/src/main/java/com/sonharf/game/LightDuelUi.kt',
              '    playerGender: String?,\n    language: String,',
              '    playerGender: String?,\n    playerFrameId: String?,\n    language: String,',
          )
          replace_once(
              'app/src/main/java/com/sonharf/game/LightDuelUi.kt',
              '                    ProfilePhotoAvatarWithGender(playerAvatarPath, playerGender, playerName, 48.dp, LBlue)',
              '                    FramedProfilePhotoAvatar(\n                        avatarPath = playerAvatarPath,\n                        gender = playerGender,\n                        name = playerName,\n                        size = 48.dp,\n                        frameId = playerFrameId,\n                        accent = LBlue,\n                        showGenderBadge = false,\n                    )',
          )
          replace_once(
              'app/src/main/java/com/sonharf/game/LightDuelUi.kt',
              '    playerGender: String?,\n    playerRating: Int,',
              '    playerGender: String?,\n    playerFrameId: String?,\n    playerRating: Int,',
          )
          replace_once(
              'app/src/main/java/com/sonharf/game/LightDuelUi.kt',
              '                    myTurn, LBlue, false, Modifier.weight(1f),\n                )',
              '                    myTurn, LBlue, false, Modifier.weight(1f), frameId = playerFrameId,\n                )',
          )
          replace_once(
              'app/src/main/java/com/sonharf/game/LightDuelUi.kt',
              '    bot: Boolean,\n    modifier: Modifier,\n) {',
              '    bot: Boolean,\n    modifier: Modifier,\n    frameId: String? = null,\n) {',
          )
          replace_once(
              'app/src/main/java/com/sonharf/game/LightDuelUi.kt',
              '            if (bot) SyntheticBotPortrait(name, gender ?: botGenderForName(name), 46.dp, 62.dp, accent)\n            else ProfilePhotoAvatarRectWithGender(avatarPath, gender, name, 46.dp, 62.dp, accent)',
              '            if (bot) {\n                SyntheticBotPortrait(name, gender ?: botGenderForName(name), 46.dp, 62.dp, accent)\n            } else if (!frameId.isNullOrBlank()) {\n                FramedProfilePhotoAvatar(\n                    avatarPath = avatarPath,\n                    gender = gender,\n                    name = name,\n                    size = 46.dp,\n                    frameId = frameId,\n                    accent = accent,\n                    showGenderBadge = false,\n                )\n            } else {\n                ProfilePhotoAvatarRectWithGender(avatarPath, gender, name, 46.dp, 62.dp, accent, showGenderBadge = false)\n            }',
          )

          replace_once(
              'app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt',
              'playerGender = profile?.gender, language = language, matching = matching, notice = notice,',
              'playerGender = profile?.gender, playerFrameId = SonHarfCosmetics.profileFrameId, language = language, matching = matching, notice = notice,',
          )
          replace_once(
              'app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt',
              'playerGender = profile?.gender, playerRating = profile?.rating ?: 1000,',
              'playerGender = profile?.gender, playerFrameId = SonHarfCosmetics.profileFrameId, playerRating = profile?.rating ?: 1000,',
          )

          replace_once(
              'app/src/main/java/com/sonharf/game/MainPlayerProfileScreen.kt',
              '''                        Box(contentAlignment = Alignment.Center) {
                            ProfilePhotoAvatarWithGender(
                                avatarPath = p?.avatarPath,
                                gender = p?.gender,
                                name = p?.displayName ?: sh("Oyuncu", "Player"),
                                size = 106.dp,
                                accent = if (p?.isVip == true) MainUi.Gold else MainUi.Blue,
                            )
                            PurchasedProfileFrameOverlay(
                                frameId = SonHarfCosmetics.profileFrameId,
                                modifier = Modifier.size(126.dp),
                            )
                        }''',
              '''                        FramedProfilePhotoAvatar(
                            avatarPath = p?.avatarPath,
                            gender = p?.gender,
                            name = p?.displayName ?: sh("Oyuncu", "Player"),
                            size = 106.dp,
                            frameId = SonHarfCosmetics.profileFrameId,
                            accent = if (p?.isVip == true) MainUi.Gold else MainUi.Blue,
                            visible = p?.avatarVisibility != "hidden",
                            showGenderBadge = false,
                        )''',
          )

          replace_once(
              'app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt',
              '''                Surface(modifier = Modifier.clickable(onClick = onProfile), shape = CircleShape, color = Color.White.copy(alpha = .17f)) {
                    Icon(Icons.Rounded.Person, null, tint = Color.White, modifier = Modifier.padding(10.dp).size(25.dp))
                }''',
              '''                Box(modifier = Modifier.clickable(onClick = onProfile), contentAlignment = Alignment.Center) {
                    FramedProfilePhotoAvatar(
                        avatarPath = profile?.avatarPath,
                        gender = profile?.gender,
                        name = profile?.displayName ?: sh("OYUNCU", "PLAYER"),
                        size = 44.dp,
                        frameId = SonHarfCosmetics.profileFrameId,
                        accent = Color.White,
                        visible = profile?.avatarVisibility != "hidden",
                        showGenderBadge = false,
                    )
                }''',
          )

      - name: Verify source invariants
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'FramedProfilePhotoAvatar' app/src/main/java/com/sonharf/game/LightDuelUi.kt
          grep -q 'playerFrameId = SonHarfCosmetics.profileFrameId' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          grep -q 'showGenderBadge: Boolean = true' app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt
          grep -q 'visible = p?.avatarVisibility != "hidden"' app/src/main/java/com/sonharf/game/MainPlayerProfileScreen.kt
          grep -q 'avatarPath = profile?.avatarPath' app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
      - name: Build and test
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game
          git commit -m 'Fix profile photo and frame consistency'
          git push origin HEAD:fix/profile-frames-avatars-20260906
