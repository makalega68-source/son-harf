name: Premier Reconnect Fairness Patch

on:
  push:
    branches: [ fix/premier-reconnect-fairness-20260920 ]
    paths:
      - 'tools/premier-reconnect-fairness-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premier-reconnect-fairness-20260920
          fetch-depth: 0
      - name: Apply exact reconnect UI patch
        run: python tools/apply_premier_reconnect_fairness_patch.py
      - name: Validate patched source
        run: |
          git diff --check
          grep -n 'room?.disconnectedPlayerId' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -n 'backend.heartbeatRoom(active.id)' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -n 'PremierReconnectBanner' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          git commit -m "Honor Premier reconnect grace in live UI [skip ci]"
          git push origin HEAD:fix/premier-reconnect-fairness-20260920
