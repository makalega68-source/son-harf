name: Bonus UI Polish Validation

on:
  push:
    branches: [ ui-polish-bonus-result ]
    paths:
      - 'tools/apply_ui_polish_patch.py'
      - '.github/workflows/ui-polish-bonus-result.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-polish-bonus-result
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply exact-match UI patch
        run: python tools/apply_ui_polish_patch.py
      - name: Static checks
        run: |
          git diff --check
          grep -n 'background(Color.Black.copy(alpha = .46f))' app/src/main/java/com/sonharf/game/LightDuelUi.kt
          grep -n 'EN UZUN KELİME' app/src/main/java/com/sonharf/game/LightDuelUi.kt
          grep -n 'GEÇERLİ KELİME' app/src/main/java/com/sonharf/game/LightDuelUi.kt
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee ui-polish-build.log
      - name: Commit verified UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/LightDuelUi.kt
          git commit -m "Polish bonus overlay and result summary [skip ci]"
          git push origin HEAD:ui-polish-bonus-result
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-ui-polish-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: ui-polish-validation-log
          path: ui-polish-build.log
          if-no-files-found: error
