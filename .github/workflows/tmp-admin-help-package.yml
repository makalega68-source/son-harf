name: Temporary Admin Help Privacy Package

on:
  push:
    branches: [ work/admin-help-privatechat-ci-20260917 ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tmp-admin-help-privatechat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/admin-help-privatechat-ci-20260917
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Apply admin help privacy package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/.tmp_fix_patch_v2.py
          python -m py_compile scripts/.tmp_apply_admin_help_package.py
          python scripts/.tmp_apply_admin_help_package.py

      - name: Static security checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'service[_-]?role|SUPABASE_SERVICE|admin_secret|github_token' app/src/main/java || (echo 'Forbidden secret marker found in Android source' && exit 1)
          grep -q 'PrivateChatSecureEffect(enabled = selected != null)' app/src/main/java/com/sonharf/game/SocialExperience.kt
          grep -q 'WindowManager.LayoutParams.FLAG_SECURE' app/src/main/java/com/sonharf/game/PrivateChatSecurity.kt
          grep -q 'clearFlags(WindowManager.LayoutParams.FLAG_SECURE)' app/src/main/java/com/sonharf/game/PrivateChatSecurity.kt
          ! grep -q 'UnreadChatIcon(' app/src/main/java/com/sonharf/game/PremiumHomeV3.kt
          grep -q 'backend.isCurrentUserAdmin()' app/src/main/java/com/sonharf/game/PremiumUnifiedProApp.kt
          ! grep -q 'Modifier.clickable(onClick = onForfeit)' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          ! grep -q 'Modifier.clickable(onClick = onQuickChat)' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt

      - name: Unit tests and debug build
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Prepare and scan APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Final-Test.apk
          sha256sum SonHarf-Final-Test.apk | tee SonHarf-Final-Test.sha256
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs SonHarf-Final-Test.apk
          if strings SonHarf-Final-Test.apk | grep -Eqi 'service[_-]?role|SUPABASE_SERVICE|admin_secret|github_token'; then
            echo 'Forbidden secret marker found in APK'
            exit 1
          fi

      - name: Remove temporary staging machinery and commit tested tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.tmp_apply_admin_help_package.py scripts/.tmp_fix_patch_v2.py .github/workflows/tmp-admin-help-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: admin operations help and private chat protection'
          git push origin HEAD:work/admin-help-privatechat-ci-20260917

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-help-privatechat-tested-apk
          path: |
            SonHarf-Final-Test.apk
            SonHarf-Final-Test.sha256
          if-no-files-found: error
          retention-days: 7
