name: Package 3 Validation CI

on:
  push:
    branches:
      - fix/word-siege-package3-word-validation-20260831

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start local Supabase
        run: npx supabase@latest start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Reset local database
        run: npx supabase@latest db reset --local
      - name: Run targeted word validation tests
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/word_siege_kelmelik_validation.sql
      - name: Android tests and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
