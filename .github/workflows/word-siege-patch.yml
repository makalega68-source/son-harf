name: Word Siege scoped patch

on:
  push:
    branches: [ word-siege-pan-area-20260901 ]
    paths:
      - '.github/workflows/word-siege-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: word-siege-pan-area-20260901
      - name: Wire pan match without touching other modes
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/sonharf/game/WordSiegeExperience.kt')
          text = path.read_text()

          call_old = '''                WordSiegeMatch(\n                    game = game,'''
          call_new = '''                WordSiegePanMatch(\n                    game = game,'''
          assert text.count(call_old) == 1, text.count(call_old)
          text = text.replace(call_old, call_new, 1)

          assert text.count('return@WordSiegeMatch') == 2, text.count('return@WordSiegeMatch')
          text = text.replace('return@WordSiegeMatch', 'return@WordSiegePanMatch')

          old_totals = '''    val myTotal = if (myOwner == 1) game.playerOneWordScore + game.playerOneArea else game.playerTwoWordScore + game.playerTwoArea\n    val rivalTotal = if (myOwner == 1) game.playerTwoWordScore + game.playerTwoArea else game.playerOneWordScore + game.playerOneArea'''
          new_totals = '''    val myTotal = if (myOwner == 1) game.playerOneWordScore + game.playerOneAreaScore else game.playerTwoWordScore + game.playerTwoAreaScore\n    val rivalTotal = if (myOwner == 1) game.playerTwoWordScore + game.playerTwoAreaScore else game.playerOneWordScore + game.playerOneAreaScore'''
          assert text.count(old_totals) == 1, text.count(old_totals)
          text = text.replace(old_totals, new_totals, 1)

          path.write_text(text)
      - name: Commit scoped wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/WordSiegeExperience.kt
          git diff --cached --check
          git commit -m "Wire draggable Word Siege board"
          git push origin HEAD:word-siege-pan-area-20260901
