name: Apply gameplay patch

on:
  push:
    branches:
      - codex/full-gameplay-polish-20260916
    paths:
      - .ci/full-gameplay-polish.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-gameplay-polish-20260916
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          git apply --check .ci/full-gameplay-polish.patch
          git apply .ci/full-gameplay-polish.patch
          rm .ci/full-gameplay-polish.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: polish gameplay feedback and Kelime Yolu input"
          git push origin HEAD:codex/full-gameplay-polish-20260916
