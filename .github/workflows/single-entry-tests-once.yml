name: One Time Single Entry Test Contracts

on:
  push:
    branches: ["claude/son-harf-game-screen-design-bhju07"]
    paths: [".github/workflows/single-entry-tests-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/son-harf-game-screen-design-bhju07
          fetch-depth: 0
      - name: Update test contracts
        run: python3 .github/scripts/single_entry_test_contract_patch.py
      - name: Commit test contract updates
        run: |
          git rm .github/workflows/single-entry-tests-once.yml .github/scripts/single_entry_test_contract_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align regression contracts with single game entry flow"
          git push origin HEAD:claude/son-harf-game-screen-design-bhju07
