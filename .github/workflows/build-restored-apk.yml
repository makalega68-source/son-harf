name: Build Restored Son Harf APK

on:
  push:
    branches:
      - apk-build-restored-20260908
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Guncel-Eski.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Guncel-Eski-APK
          path: SonHarf-Guncel-Eski.apk
          if-no-files-found: error
