name: Purchased UI Son Harf Patch Once

on:
  push:
    branches:
      - ui/real-purchased-pack-full-overhaul-20260921
    paths:
      - .github/workflows/purchased-ui-son-harf-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/real-purchased-pack-full-overhaul-20260921
          fetch-depth: 0
      - name: Apply exact Son Harf visual patch
        run: python scripts/apply_purchased_ui_son_harf_patch.py
      - name: Verify Son Harf gameplay and keyboard contracts
        run: |
          grep -F 'EmbeddedWordKeyboard(' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          ! grep -F 'TEMİZLE' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -F 'backend.submitPremierWord(active.id, candidate)' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -F 'PurchasedButton(' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -F 'PurchasedPanel(' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
      - name: Commit Son Harf overhaul
        run: |
          if git diff --quiet; then
            echo 'No changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          git commit -m 'ui: reskin Son Harf states with purchased assets'
          git push origin HEAD:ui/real-purchased-pack-full-overhaul-20260921
