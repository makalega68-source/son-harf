name: Avatar APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/avatar-visual-validation
    paths:
      - 'scripts/apply_avatar_visual_standardization.py'
      - '.github/workflows/avatar-visual-validation.yml'
      - 'app/src/main/java/com/sonharf/game/ProfilePhotoRuntime.kt'
      - 'app/src/main/java/com/sonharf/game/MainPlayerProfileScreen.kt'
      - 'app/src/main/java/com/sonharf/game/LightDuelUi.kt'
      - 'app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt'
      - 'app/src/debug/**'

permissions:
  contents: read

concurrency:
  group: avatar-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Apply canonical avatar patch
        run: python3 scripts/apply_avatar_visual_standardization.py

      - name: Unit regression and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Avatar-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-avatar-test-apk-${{ github.run_number }}
          path: SonHarf-Avatar-Test.apk
          if-no-files-found: error
