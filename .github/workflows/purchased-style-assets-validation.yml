name: Purchased Style Assets Validation

on:
  push:
    branches:
      - feat/purchased-style-assets-20260902
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/purchased-style-assets-20260902
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 scripts/apply_purchased_style_assets.py

      - name: Commit integration result
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/sonharf/game/MonsterStyleStoreScreen.kt app/src/main/java/com/sonharf/game/MainPlayerProfileScreen.kt
            git commit -m "Apply purchased Style assets [skip ci]"
            git push origin HEAD:feat/purchased-style-assets-20260902
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.14.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Compile and test
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest
