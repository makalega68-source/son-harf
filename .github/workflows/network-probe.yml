name: Android Proxy Safe Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Remove stale Gradle and Git proxy settings
        shell: bash
        run: |
          set -euo pipefail
          git config --global --unset-all http.proxy || true
          git config --global --unset-all https.proxy || true
          mkdir -p "$HOME/.gradle"
          if [ -f "$HOME/.gradle/gradle.properties" ]; then
            sed -i -E '/systemProp\.(http|https)\.proxy/d' "$HOME/.gradle/gradle.properties"
          fi

      - name: Install Android SDK 36 without proxy variables
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.14.4 without proxy variables
        shell: bash
        run: |
          set -euo pipefail
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-8.14.4-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Verify Google Maven and Maven Central without proxy variables
        shell: bash
        run: |
          set -euo pipefail
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
            curl -fsSIL --retry 3 \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.12.1/gradle-8.12.1.pom" >/dev/null
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
            curl -fsSIL --retry 3 "https://repo.maven.apache.org/maven2/" >/dev/null
          grep -q 'google()' settings.gradle.kts
          grep -q 'mavenCentral()' settings.gradle.kts
          grep -q 'gradlePluginPortal()' settings.gradle.kts
          grep -q 'id("com.android.application") version "8.12.1"' build.gradle.kts
          gradle --version

      - name: Build debug APK without proxy variables
        shell: bash
        run: |
          set -euo pipefail
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
            GRADLE_OPTS="-Djava.net.useSystemProxies=false" \
            gradle clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk SonHarf-ProxySafe-Debug.apk
          sha256sum SonHarf-ProxySafe-Debug.apk | tee SonHarf-ProxySafe-Debug.sha256
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs SonHarf-ProxySafe-Debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: son-harf-proxy-safe-debug-apk
          path: |
            SonHarf-ProxySafe-Debug.apk
            SonHarf-ProxySafe-Debug.sha256
          if-no-files-found: error
