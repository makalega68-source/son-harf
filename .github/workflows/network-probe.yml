name: Android Proxy Safe Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      GRADLE_OPTS: "-Djava.net.useSystemProxies=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Clear stale proxy settings
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy || true
          printf '%s\n' 'HTTP_PROXY=' 'HTTPS_PROXY=' 'ALL_PROXY=' 'http_proxy=' 'https_proxy=' 'all_proxy=' >> "$GITHUB_ENV"
          git config --global --unset-all http.proxy || true
          git config --global --unset-all https.proxy || true
          mkdir -p "$HOME/.gradle"
          if [ -f "$HOME/.gradle/gradle.properties" ]; then
            sed -i -E '/systemProp\.(http|https)\.proxy/d' "$HOME/.gradle/gradle.properties"
          fi

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Verify repositories and versions
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSIL --retry 3 "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.12.1/gradle-8.12.1.pom" >/dev/null
          curl -fsSIL --retry 3 "https://repo.maven.apache.org/maven2/" >/dev/null
          grep -q 'google()' settings.gradle.kts
          grep -q 'mavenCentral()' settings.gradle.kts
          grep -q 'gradlePluginPortal()' settings.gradle.kts
          grep -q 'id("com.android.application") version "8.12.1"' build.gradle.kts
          gradle --version

      - name: Build debug APK
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk SonHarf-ProxySafe-Debug.apk
          sha256sum SonHarf-ProxySafe-Debug.apk | tee SonHarf-ProxySafe-Debug.sha256
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs SonHarf-ProxySafe-Debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: son-harf-proxy-safe-debug-apk
          path: |
            SonHarf-ProxySafe-Debug.apk
            SonHarf-ProxySafe-Debug.sha256
          if-no-files-found: error
