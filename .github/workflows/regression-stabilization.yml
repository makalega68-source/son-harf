name: Regression Stabilization

on:
  push:
    branches: [ fix/regression-lock-20260822 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regression-stabilization
  cancel-in-progress: false

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/regression-lock-20260822
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply locked regression repairs
        run: python3 scripts/apply_regression_stabilization.py
      - name: Verify no old dark-theme regression remains
        run: |
          ! grep -q 'Color(0xFF040717)' app/src/main/java/com/sonharf/game/CompleteProfileScreen.kt
          ! grep -q 'Color(0xFF06091A)' app/src/main/java/com/sonharf/game/LeaderboardExperience.kt
          grep -q 'RegressionGuardOverlay()' app/src/main/java/com/sonharf/game/MainActivity.kt
          grep -q 'Color(0xFFFF76A8)' app/src/main/java/com/sonharf/game/ProfileExperienceV2.kt
          grep -q 'Color(0xFF439EF2)' app/src/main/java/com/sonharf/game/ProfileExperienceV2.kt
      - name: Compile stabilized debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all
      - name: Commit only after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/MainActivity.kt \
                  app/src/main/java/com/sonharf/game/CompleteProfileScreen.kt \
                  app/src/main/java/com/sonharf/game/LeaderboardExperience.kt \
                  app/src/main/java/com/sonharf/game/ProfileExperienceV2.kt \
                  app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
          git diff --cached --quiet || git commit -m "Stabilize protected gameplay and theme regressions [skip ci]"
          git push origin HEAD:fix/regression-lock-20260822
      - name: Upload stabilized APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-regression-stabilized-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
