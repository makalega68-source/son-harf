name: Dictionary Language Help Clean
on:
  push:
    branches:
      - feat/dictionary-language-help-clean-20260901
permissions:
  contents: write
jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply only scoped dictionary-language-help changes
        run: |
          git fetch origin feat/dictionary-language-help-20260901
          mkdir -p supabase/migrations
          git show origin/feat/dictionary-language-help-20260901:supabase/migrations/20260901074000_dictionary_validation_language_v1.sql > supabase/migrations/20260901074000_dictionary_validation_language_v1.sql
          git show origin/feat/dictionary-language-help-20260901:supabase/migrations/20260901074500_sonharf_common_validator_v1.sql > supabase/migrations/20260901074500_sonharf_common_validator_v1.sql
          git show origin/feat/dictionary-language-help-20260901:supabase/migrations/20260901075000_dictionary_validator_single_result_fix.sql > supabase/migrations/20260901075000_dictionary_validator_single_result_fix.sql
          git show origin/feat/dictionary-language-help-20260901:scripts/apply_dictionary_language_help_patch.py > /tmp/apply_dictionary_language_help_patch.py
          python /tmp/apply_dictionary_language_help_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sonharf/game/MainExperienceApp.kt')
          s = p.read_text()
          s = s.replace('fun SonHarfMainApp(\n', 'internal fun SonHarfMainApp(\n', 1)
          p.write_text(s)
          t = Path('app/src/test/java/com/sonharf/game/DictionaryLanguageHelpContractTest.kt')
          s = t.read_text().replace('import kotlin.test.Test\nimport kotlin.test.assertFalse\nimport kotlin.test.assertTrue', 'import org.junit.Test\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue')
          t.write_text(s)
          PY
      - name: Verify scope
        run: |
          allowed='^(app/src/main/java/com/sonharf/game/(MainExperienceApp|StableV1App|WordSiegeExperience|WordSiegePracticeScreen|WordSiegePracticeEngine|WordSiegeBotPlanner)\.kt|app/src/test/java/com/sonharf/game/DictionaryLanguageHelpContractTest\.kt|supabase/migrations/2026090107(4000_dictionary_validation_language_v1|4500_sonharf_common_validator_v1|5000_dictionary_validator_single_result_fix)\.sql)$'
          bad=$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "Out-of-scope files changed:"; echo "$bad"; exit 1; fi
      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Dictionary-Language-Help-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit clean checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/sonharf/game/MainExperienceApp.kt app/src/main/java/com/sonharf/game/StableV1App.kt app/src/main/java/com/sonharf/game/WordSiegeExperience.kt app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt app/src/main/java/com/sonharf/game/WordSiegePracticeEngine.kt app/src/main/java/com/sonharf/game/WordSiegeBotPlanner.kt app/src/test/java/com/sonharf/game/DictionaryLanguageHelpContractTest.kt supabase/migrations/20260901074000_dictionary_validation_language_v1.sql supabase/migrations/20260901074500_sonharf_common_validator_v1.sql supabase/migrations/20260901075000_dictionary_validator_single_result_fix.sql
          git commit -m "Checkpoint dictionary validation language and game help"
          git push origin HEAD:feat/dictionary-language-help-clean-20260901
