name: Active UI Compact Validation

on:
  push:
    branches: [fix/active-ui-compact-20260905]

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Patch active UI only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('patched', label)

          light = 'app/src/main/java/com/sonharf/game/LightDuelUi.kt'
          siege = 'app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt'
          board = 'app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt'

          # Classic active arena: timer sync indicator.
          patch(light,
          '''                    ) {
                        Text(seconds.toString(), color = LText, fontSize = 31.sp, fontWeight = FontWeight.Black)
                        Text(if (quizActive) "BONUS" else sh("SN", "SEC"), color = timerColor, fontSize = 8.sp, fontWeight = FontWeight.Black)
                    }
''',
          '''                    ) {
                        if (timerSynchronizing && !quizActive && seconds <= 0) {
                            CircularProgressIndicator(
                                modifier = Modifier.size(25.dp),
                                color = LBlue,
                                strokeWidth = 2.5.dp,
                            )
                            Spacer(Modifier.height(3.dp))
                            Text(sh("SENKRON", "SYNC"), color = LBlue, fontSize = 7.sp, fontWeight = FontWeight.Black)
                        } else {
                            Text(seconds.toString(), color = LText, fontSize = 31.sp, fontWeight = FontWeight.Black)
                            Text(if (quizActive) "BONUS" else sh("SN", "SEC"), color = timerColor, fontSize = 8.sp, fontWeight = FontWeight.Black)
                        }
                    }
''', 'classic timer sync UI')

          # Classic active arena: compact balanced central game card + larger last word/guidance.
          patch(light,
          '''            Card(
                modifier = Modifier.fillMaxWidth().weight(1f).padding(horizontal = 10.dp),
''',
          '''            Card(
                modifier = Modifier.fillMaxWidth().weight(1f, fill = false).heightIn(max = 220.dp).padding(horizontal = 10.dp),
''', 'classic game card height')

          patch(light,
          '''                    Surface(shape = RoundedCornerShape(13.dp), color = Color(0xFFF7F9FC)) {
                        Text(
                            if (lastDisplay.isBlank()) sh("İlk kelimeyi sen başlat", "You start the first word")
                            else sh("SON KABUL EDİLEN KELİME: $lastDisplay", "LAST ACCEPTED WORD: $lastDisplay"),
                            Modifier.padding(horizontal = 11.dp, vertical = 7.dp),
                            color = LMuted,
                            fontSize = 10.sp,
                            fontWeight = FontWeight.Bold,
                        )
                    }
''',
          '''                    Surface(shape = RoundedCornerShape(13.dp), color = Color(0xFFF7F9FC)) {
                        if (lastDisplay.isBlank()) {
                            Text(
                                sh("İlk kelimeyi sen başlat", "You start the first word"),
                                Modifier.padding(horizontal = 12.dp, vertical = 7.dp),
                                color = LMuted,
                                fontSize = 13.sp,
                                fontWeight = FontWeight.Bold,
                            )
                        } else {
                            Column(
                                Modifier.padding(horizontal = 12.dp, vertical = 6.dp),
                                horizontalAlignment = Alignment.CenterHorizontally,
                            ) {
                                Text(sh("SON KABUL EDİLEN KELİME", "LAST ACCEPTED WORD"), color = LMuted, fontSize = 9.sp, fontWeight = FontWeight.Bold)
                                Text(lastDisplay, color = LText, fontSize = 16.sp, lineHeight = 18.sp, fontWeight = FontWeight.Black, maxLines = 1, overflow = TextOverflow.Ellipsis)
                            }
                        }
                    }
''', 'classic last word emphasis')

          patch(light,
          '''                        fontSize = 78.sp,
                        lineHeight = 80.sp,
''',
          '''                        fontSize = 62.sp,
                        lineHeight = 64.sp,
''', 'classic required letter size')
          patch(light,
          '''                        color = LBlue,
                        fontSize = 13.sp,
                        fontWeight = FontWeight.Black,
                    )
''',
          '''                        color = LBlue,
                        fontSize = 17.sp,
                        lineHeight = 19.sp,
                        fontWeight = FontWeight.Black,
                        maxLines = 1,
                    )
''', 'classic required-letter guidance')

          # Player cards: equal compact geometry and complete league/rating line.
          patch(light,
          '''        modifier = modifier.heightIn(min = 112.dp),
''',
          '''        modifier = modifier.height(96.dp),
''', 'classic equal player card height')
          patch(light,
          '''            if (bot) SyntheticBotPortrait(name, gender ?: botGenderForName(name), 52.dp, 70.dp, accent)
            else ProfilePhotoAvatarRectWithGender(avatarPath, gender, name, 52.dp, 70.dp, accent)
            Spacer(Modifier.width(6.dp))
            Column(Modifier.weight(1f), verticalArrangement = Arrangement.Center) {
                Text(name, color = LText, fontSize = 15.sp, lineHeight = 18.sp, fontWeight = FontWeight.Bold, maxLines = 2, overflow = TextOverflow.Ellipsis)
                Text(score.toString(), color = accent, fontSize = duelScoreFontSize(score).sp, lineHeight = 29.sp, fontWeight = FontWeight.Black, maxLines = 1)
                Text("$league • $rating", color = LMuted, fontSize = 12.sp, lineHeight = 14.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
            }
''',
          '''            if (bot) SyntheticBotPortrait(name, gender ?: botGenderForName(name), 46.dp, 62.dp, accent)
            else ProfilePhotoAvatarRectWithGender(avatarPath, gender, name, 46.dp, 62.dp, accent)
            Spacer(Modifier.width(6.dp))
            Column(Modifier.weight(1f), verticalArrangement = Arrangement.Center) {
                Text(name, color = LText, fontSize = 13.sp, lineHeight = 15.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                Text(score.toString(), color = accent, fontSize = duelScoreFontSize(score).coerceAtMost(23).sp, lineHeight = 25.sp, fontWeight = FontWeight.Black, maxLines = 1)
                Text("$league • $rating", color = LMuted, fontSize = 9.sp, lineHeight = 11.sp, fontWeight = FontWeight.Bold, maxLines = 1, softWrap = false, overflow = TextOverflow.Clip)
            }
''', 'classic player card content')

          # Input: compact height, mic badge only, no placeholder/status/mini-send.
          start = '''    val statusText = when {
        feedbackWord != null && feedbackCorrect == true -> sh("✓ GEÇERLİ", "✓ VALID")
        value.isBlank() -> if (myTurn) sh("KELİMENİ YAZ", "TYPE YOUR WORD") else sh("KELİMEYİ HAZIRLA", "PREPARE YOUR WORD")
        inputMatches == false -> sh("✕ “$required” İLE BAŞLAMALI", "✕ MUST START WITH “$required”")
        feedbackCorrect == false -> "✕ ${notice.take(42)}"
        else -> sh("✓ BAŞLANGIÇ GEÇERLİ", "✓ VALID START")
    }
'''
          patch(light, start, '', 'classic repeated input status removal')
          patch(light,
          '''        modifier = modifier.fillMaxWidth(),
''',
          '''        modifier = modifier.fillMaxWidth().height(52.dp),
''', 'classic input compact height')
          patch(light,
          '''        Column(Modifier.fillMaxWidth().padding(horizontal = 9.dp, vertical = 6.dp)) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                OutlinedButton(
                    onClick = onVoice,
                    enabled = myTurn && !busy && !quiz && voiceSupported && voiceUses < 5,
                    modifier = Modifier.height(38.dp),
                    contentPadding = PaddingValues(horizontal = 7.dp),
                ) {
                    Text("🎙 ${5 - voiceUses}", fontSize = 10.sp, fontWeight = FontWeight.Black)
                }
                Spacer(Modifier.width(7.dp))
                Text(
                    value.ifBlank { sh("Kelimenizi yazın…", "Type your word…") },
                    color = if (value.isBlank()) LMuted else LText,
                    fontSize = if (value.isBlank()) 16.sp else 20.sp,
                    fontWeight = if (value.isBlank()) FontWeight.Medium else FontWeight.Black,
                    modifier = Modifier.weight(1f),
                    maxLines = 1,
                )
                Button(
                    onClick = onSubmit,
                    enabled = myTurn && value.isNotBlank() && inputMatches != false && !busy && !quiz,
                    modifier = Modifier.height(40.dp),
                    shape = RoundedCornerShape(12.dp),
                ) {
                    Text("➤", fontSize = 17.sp)
                }
            }
            Text(statusText, color = statusColor, fontSize = 14.sp, lineHeight = 16.sp, fontWeight = FontWeight.Black, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center, maxLines = 2, overflow = TextOverflow.Ellipsis)
        }
''',
          '''        Row(Modifier.fillMaxSize().padding(horizontal = 5.dp), verticalAlignment = Alignment.CenterVertically) {
            IconButton(
                onClick = onVoice,
                enabled = myTurn && !busy && !quiz && voiceSupported && voiceUses < 5,
                modifier = Modifier.size(48.dp),
            ) {
                Surface(
                    modifier = Modifier.size(28.dp),
                    shape = CircleShape,
                    color = if (voiceSupported && voiceUses < 5) LBlueSoft else LCard2,
                    border = BorderStroke(1.dp, LBlue.copy(alpha = .24f)),
                ) {
                    Box(contentAlignment = Alignment.Center) {
                        Text("🎙${(5 - voiceUses).coerceAtLeast(0)}", color = LBlue, fontSize = 8.sp, fontWeight = FontWeight.Black, maxLines = 1)
                    }
                }
            }
            Spacer(Modifier.width(2.dp))
            Text(
                value,
                color = LText,
                fontSize = if (value.isBlank()) 16.sp else 20.sp,
                fontWeight = FontWeight.Black,
                modifier = Modifier.weight(1f),
                maxLines = 1,
                overflow = TextOverflow.Ellipsis,
            )
        }
''', 'classic compact input content')

          # Action controls: 48dp hit target, compact 34dp visual control.
          patch(light,
          '''private fun SmallAction(label: String, accent: Color, modifier: Modifier, onClick: () -> Unit) {
    OutlinedButton(
        onClick = onClick,
        modifier = modifier.height(37.dp),
        shape = RoundedCornerShape(12.dp),
        border = BorderStroke(1.dp, accent.copy(alpha = .4f)),
        contentPadding = PaddingValues(2.dp),
    ) {
        Text(label, color = accent, fontSize = 8.sp, fontWeight = FontWeight.Black, maxLines = 1)
    }
}
''',
          '''private fun SmallAction(label: String, accent: Color, modifier: Modifier, onClick: () -> Unit) {
    Box(
        modifier = modifier.height(48.dp).clickable(onClick = onClick),
        contentAlignment = Alignment.Center,
    ) {
        Surface(
            modifier = Modifier.fillMaxWidth().height(34.dp),
            shape = RoundedCornerShape(11.dp),
            color = Color.Transparent,
            border = BorderStroke(1.dp, accent.copy(alpha = .4f)),
        ) {
            Box(contentAlignment = Alignment.Center) {
                Text(label, color = accent, fontSize = 8.sp, fontWeight = FontWeight.Black, maxLines = 1)
            }
        }
    }
}
''', 'classic action touch targets')

          # Siege: suppress only successful dictionary-ready notice; failures remain.
          patch(siege,
          '''                .onSuccess {
                    dictionaryReady = true
                    notice = sh("Ana sözlük hazır. Çevrimdışı alıştırmada da aynı sözlük kullanılacak.", "Main dictionary ready. The same dictionary will be used for offline practice.")
                }
''',
          '''                .onSuccess {
                    dictionaryReady = true
                    notice = null
                }
''', 'siege dictionary success notice')

          # Siege cards: fixed equal height; rectangular profile frame while retaining 50dp width contract.
          patch(siege,
          '''        modifier = modifier,
''',
          '''        modifier = modifier.height(if (compact) 70.dp else 78.dp),
''', 'siege equal card height')
          patch(siege,
          '''            ProfilePhotoAvatarWithGender(
                avatarPath = avatarPath,
                gender = gender,
                name = name,
                size = 50.dp,
                accent = accent,
                visible = avatarVisible,
            )
''',
          '''            val size = 50.dp
            if (isBot) {
                SyntheticBotPortrait(name, gender ?: botGenderForName(name), size, if (compact) 54.dp else 60.dp, accent)
            } else {
                ProfilePhotoAvatarRectWithGender(avatarPath.takeIf { avatarVisible }, gender, name, size, if (compact) 54.dp else 60.dp, accent)
            }
''', 'siege rectangular avatar')
          patch(siege,
          '''                    Text(name, color = MainUi.Text, fontWeight = FontWeight.Black, fontSize = 15.sp, lineHeight = 18.sp, maxLines = 2, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f, fill = false))
''',
          '''                    Text(name, color = MainUi.Text, fontWeight = FontWeight.Black, fontSize = 15.sp, lineHeight = 17.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
''', 'siege card name fit')

          # Siege board: smaller initial opening scale only; keep close/min/max constants and recenter behavior intact.
          patch(board,
          '''    var closeScale by remember { mutableFloatStateOf(WORD_SIEGE_PRACTICE_CLOSE_SCALE) }
''',
          '''    var closeScale by remember { mutableFloatStateOf(0.81f) }
''', 'siege initial board scale')

          # Scope guard: only the three active UI files may be modified by this workflow.
          allowed = {light, siege, board, '.github/workflows/active-ui-compact-validation.yml'}
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines()
          unexpected = [p for p in changed if p not in allowed]
          if unexpected:
              raise SystemExit(f'unexpected modified paths: {unexpected}')
          PY

      - name: Active-screen and forbidden-path guard
        shell: bash
        run: |
          grep -q 'OnlineGameScreenV6' app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          grep -q 'LightDuelArena(' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          grep -q 'WordSiegePracticeScreen(' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          ! git diff --name-only 7488d727f87894cc76fd9a55a17e7db8c552f89b -- app/src/main/java/com/sonharf/game/data app/src/main/java/com/sonharf/game/supabase | grep -q .

      - name: Unit regression and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: APK source and integrity checks
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -p "$APK" classes.dex | strings | grep -q 'Senkronize ediliyor'
          unzip -p "$APK" classes.dex | strings | grep -q 'GÖNDER'
          ! grep -R --line-number -E 'submitWord|claimTurnTimeout|startRandomMatchmaking|SupabaseProvider' app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt >/dev/null
          git diff --check

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Active-UI-20260905
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit validated UI-only source
        shell: bash
        run: |
          rm .github/workflows/active-ui-compact-validation.yml
          git config user.name 'sonharf-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/sonharf/game/LightDuelUi.kt app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt .github/workflows/active-ui-compact-validation.yml
          CHANGED=$(git diff --cached --name-only 7488d727f87894cc76fd9a55a17e7db8c552f89b)
          echo "$CHANGED"
          test "$CHANGED" = $'app/src/main/java/com/sonharf/game/LightDuelUi.kt\napp/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt\napp/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt'
          git commit -m 'fix(ui): compact active duel and siege screens'
          git push origin HEAD:fix/active-ui-compact-20260905
