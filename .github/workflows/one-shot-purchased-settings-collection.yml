name: One-shot purchased settings collection

on:
  push:
    branches:
      - ui/real-purchased-pack-full-overhaul-20260921

permissions:
  contents: write

jobs:
  patch-settings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/real-purchased-pack-full-overhaul-20260921
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Patch settings collection shell
        run: python3 .github/scripts/patch-purchased-settings-collection.py

      - name: Test and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit purchased settings collection
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/one-shot-purchased-settings-collection.yml .github/scripts/patch-purchased-settings-collection.py
          git add app/src/main/java/com/sonharf/game/ProfileOwnedThemesSection.kt app/src/test/java/com/sonharf/game/PurchasedSettingsCollectionContractTest.kt
          git commit -m "ui: finish purchased settings collection shell"
          git push origin HEAD:ui/real-purchased-pack-full-overhaul-20260921
