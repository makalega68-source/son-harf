name: Branch APK CI

# Canonical siege fix build trigger: v32
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/kelime-tahti-home-redesign-7ojb7d'
      - 'claude/mascot-animations-behavior-31rof9'
    paths:
      - 'app/src/main/java/com/sonharf/game/**'
      - 'app/src/main/res/**'
      - 'app/src/debug/**'
      - 'app/src/test/**'
      - '.github/workflows/**'
      - 'supabase/migrations/**'
      - '.github/workflows/ui-screenshot.yml'

permissions:
  contents: read

concurrency:
  group: branch-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Unit tests and debug APK
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Kelime-Tahti-Guncel.apk
          sha256sum Kelime-Tahti-Guncel.apk > Kelime-Tahti-Guncel.sha256
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Capture real Android frame from the committed debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r Kelime-Tahti-Guncel.apk
            adb shell am start -n com.sonharf.game/.UiScreenshotActivity --ez walnut_ivory_board true
            sleep 8
            adb exec-out screencap -p > Ceviz-Fildisi-Android.png
      - name: Validate frame and APK were produced by this checkout
        run: |
          test -s Ceviz-Fildisi-Android.png
          test -s Kelime-Tahti-Guncel.apk
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          sha256sum Kelime-Tahti-Guncel.apk Ceviz-Fildisi-Android.png
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ceviz-fildisi-android-teslim
          path: |
            Kelime-Tahti-Guncel.apk
            Kelime-Tahti-Guncel.sha256
            Ceviz-Fildisi-Android.png
          if-no-files-found: error
          retention-days: 7
