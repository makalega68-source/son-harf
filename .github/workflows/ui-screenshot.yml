name: Branch APK CI

# Canonical siege fix build trigger: v32
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/kelime-tahti-home-redesign-7ojb7d'
      - 'claude/mascot-animations-behavior-31rof9'
    paths:
      - 'app/src/main/java/com/sonharf/game/**'
      - 'app/src/main/res/**'
      - 'app/src/debug/**'
      - 'app/src/test/**'
      - '.github/workflows/**'
      - 'supabase/migrations/**'
      - '.github/workflows/ui-screenshot.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: branch-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[reuse-apk:e948d04]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Kelime-Tahti-Guncel.apk
          sha256sum Kelime-Tahti-Guncel.apk > Kelime-Tahti-Guncel.sha256
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
      # Without KVM the emulator is software-emulated: it took ~7 minutes to boot and then dropped
      # adb ("Broken pipe") on its first commands. Hardware acceleration makes boot fast and stable.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Capture real Android frame from the committed debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # Its animation-settings step was the first adb call to break; the app does not need it.
          disable-animations: false
          script: |
            adb wait-for-device
            for i in 1 2 3 4 5; do adb shell getprop sys.boot_completed | grep -q 1 && adb shell pm list packages >/dev/null 2>&1 && break; echo "package service not ready ($i)"; sleep 15; done
            for i in 1 2 3; do adb install -r -t Kelime-Tahti-Guncel.apk && break; echo "install retry $i"; sleep 20; adb wait-for-device; done
            adb shell pm list packages | grep -q com.sonharf.game
            # A slow emulator can raise "isn't responding" dialogs for system apps (Quickstep); they
            # cover the app and break UI dumps. Hide system error dialogs so the checks see the app.
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity --ez walnut_ivory_board true
            sleep 8
            adb exec-out screencap -p > Ceviz-Fildisi-Android.png
            for stage in home duel search versus throne atelier; do adb shell am force-stop com.sonharf.game; adb logcat -c; adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity --es game_stage "$stage" || exit 1; sleep 3; adb exec-out screencap -p > "Game-${stage}-Android.png" || exit 1; adb logcat -d -s AndroidRuntime:E > "Game-${stage}-runtime.log"; if grep -q "FATAL EXCEPTION" "Game-${stage}-runtime.log"; then cat "Game-${stage}-runtime.log"; exit 1; fi; done
            for stage in welcome-light welcome-dark store-light store-dark controls-light controls-dark home-light home-dark inbox-dark; do adb shell am force-stop com.sonharf.game; adb logcat -c; adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity --es review_stage "$stage" || exit 1; sleep 4; adb exec-out screencap -p > "Review-${stage}-Android.png" || exit 1; adb logcat -d -s AndroidRuntime:E > "Review-${stage}-runtime.log"; if grep -q "FATAL EXCEPTION" "Review-${stage}-runtime.log"; then cat "Review-${stage}-runtime.log"; exit 1; fi; done
            adb shell am force-stop com.sonharf.game
            adb logcat -c
            adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity --es game_stage fallback
            sleep 9
            adb shell uiautomator dump /sdcard/fallback-before.xml
            adb pull /sdcard/fallback-before.xml Fallback-before.xml
            adb logcat -d -s AndroidRuntime:E | head -80 || true
            grep -o 'text="[^"]*"' Fallback-before.xml | head -40 || true
            ! grep -q 'AI MAÇI' Fallback-before.xml
            adb exec-out screencap -p > Fallback-before-Android.png
            sleep 6
            adb shell uiautomator dump /sdcard/fallback-ai.xml
            adb pull /sdcard/fallback-ai.xml Fallback-ai.xml
            grep -q 'AI MAÇI' Fallback-ai.xml
            adb exec-out screencap -p > Fallback-ai-Android.png
            sleep 10
            adb shell uiautomator dump /sdcard/fallback-rival.xml
            adb pull /sdcard/fallback-rival.xml Fallback-rival.xml
            ! grep -q 'AI MAÇI' Fallback-rival.xml
            grep -q 'Selin' Fallback-rival.xml
            adb exec-out screencap -p > Fallback-rival-Android.png
            adb logcat -d -s AndroidRuntime:E > Fallback-runtime.log
            ! grep -q 'FATAL EXCEPTION' Fallback-runtime.log
            python3 scripts/verify_mascot_drag.py
            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity --es review_stage mascot-face
            sleep 6
            for i in 1 2 3; do timeout 60s adb exec-out screencap -p > Mascot-face-Android.png && break; echo "screencap retry $i"; timeout 120 adb wait-for-device || exit 1; sleep 5; done; test -s Mascot-face-Android.png
            sleep 2
            for i in 1 2 3; do timeout 60s adb exec-out screencap -p > Mascot-face-second-Android.png && break; echo "screencap retry $i"; timeout 120 adb wait-for-device || exit 1; sleep 5; done; test -s Mascot-face-second-Android.png
            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity --es review_stage gold-king
            sleep 6
            for i in 1 2 3; do timeout 60s adb exec-out screencap -p > Mascot-gold-king-Android.png && break; echo "screencap retry $i"; timeout 120 adb wait-for-device || exit 1; sleep 5; done; test -s Mascot-gold-king-Android.png
            python3 scripts/verify_home_menu.py
            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity --es review_stage controls-dark
            sleep 3
            adb shell uiautomator dump /sdcard/preview.xml
            adb pull /sdcard/preview.xml Preview-controls.xml
            python3 -c 'import xml.etree.ElementTree as E,re,subprocess; n=next(n for n in E.parse("Preview-controls.xml").iter("node") if n.get("content-desc")=="Bu ürün ne işe yarar?"); x1,y1,x2,y2=map(int,re.findall(r"[0-9]+",n.get("bounds"))); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 2
            adb shell uiautomator dump /sdcard/preview-open.xml
            adb pull /sdcard/preview-open.xml Preview-open.xml
            grep -q 'SATIN AL' Preview-open.xml
            timeout 60s adb exec-out screencap -p > Review-preview-dark-Android.png
      - name: Validate frame and APK were produced by this checkout
        run: |
          test -s Ceviz-Fildisi-Android.png
          test -s Kelime-Tahti-Guncel.apk
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          sha256sum Kelime-Tahti-Guncel.apk Ceviz-Fildisi-Android.png
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceviz-fildisi-android-teslim
          path: |
            Kelime-Tahti-Guncel.apk
            Kelime-Tahti-Guncel.sha256
            Ceviz-Fildisi-Android.png
            Game-*-Android.png
            Game-*-runtime.log
            Review-*-Android.png
            Review-*-runtime.log
            Fallback-*
            Preview-*.xml
            Mascot-*
            Home-*
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 7

  verify_existing:
    if: contains(github.event.head_commit.message, '[reuse-apk:e948d04]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Verify application code matches the tested APK
        run: |
          git diff --exit-code e948d046713c965e7f393b0af291b80f0832f241 HEAD -- app supabase
          echo APK_SOURCE_SHA=e948d046713c965e7f393b0af291b80f0832f241
      - uses: actions/download-artifact@v4
        with:
          name: ceviz-fildisi-android-teslim
          run-id: 37082051150
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-apk
      - name: Verify the original APK checksum
        working-directory: verified-apk
        run: sha256sum -c Kelime-Tahti-Guncel.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Complete menu and product-preview checks on the same APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: false
          script: |
            adb wait-for-device
            adb install -r -t verified-apk/Kelime-Tahti-Guncel.apk
            adb shell settings put global hide_error_dialogs 1 || true
            python3 scripts/verify_home_menu.py
            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity --es review_stage controls-dark
            sleep 4
            adb shell uiautomator dump /sdcard/preview.xml
            adb pull /sdcard/preview.xml Preview-controls.xml
            python3 -c 'import xml.etree.ElementTree as E,re,subprocess; n=next(n for n in E.parse("Preview-controls.xml").iter("node") if n.get("content-desc")=="Bu ürün ne işe yarar?"); x1,y1,x2,y2=map(int,re.findall(r"[0-9]+",n.get("bounds"))); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 2
            adb shell uiautomator dump /sdcard/preview-open.xml
            adb pull /sdcard/preview-open.xml Preview-open.xml
            grep -q 'SATIN AL' Preview-open.xml
            adb exec-out screencap -p > Review-preview-dark-Android.png
            adb logcat -d -s AndroidRuntime:E > Home-preview-runtime.log
            ! grep -q 'FATAL EXCEPTION' Home-preview-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kelime-Tahti-Ek-Menu-Kontrolleri
          path: |
            Home-*
            Preview-*.xml
            Review-preview-dark-Android.png
          if-no-files-found: error
          retention-days: 7
