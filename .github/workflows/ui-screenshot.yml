name: Branch APK CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/kelime-tahti-home-redesign-7ojb7d'
    paths:
      - 'app/src/main/java/com/sonharf/game/**'
      - 'app/src/main/res/**'
      - 'app/src/debug/**'
      - 'app/src/test/**'
      - 'supabase/migrations/**'
      - '.github/workflows/ui-screenshot.yml'

permissions:
  contents: read

concurrency:
  group: branch-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Unit tests and debug APK
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Kelime-Tahti-Final-Test.apk
          sha256sum Kelime-Tahti-Final-Test.apk > Kelime-Tahti-Final-Test.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-tahti-final-apk
          path: |
            Kelime-Tahti-Final-Test.apk
            Kelime-Tahti-Final-Test.sha256
          if-no-files-found: error
          retention-days: 7
