name: UI Screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/kelime-tahti-home-redesign-7ojb7d'
    paths:
      - 'app/src/main/java/com/sonharf/game/**'
      - 'app/src/debug/**'
      - '.github/workflows/ui-screenshot.yml'

permissions:
  contents: read

concurrency:
  group: ui-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --warning-mode all
      - name: Enable KVM access when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi
      - name: Render real Compose home screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.UiScreenshotActivity
            sleep 12
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/home-top.png
            adb shell input swipe 540 1850 540 780 650
            sleep 2
            adb exec-out screencap -p > screenshots/home-scroll.png
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: kelime-tahti-ui-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
