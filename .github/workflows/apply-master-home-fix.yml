name: Apply Master Home Fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-master-home-fix.yml'
      - 'ci/master-home-fix-trigger.txt'

permissions:
  contents: write

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair master home source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('app/src/main/java/com/sonharf/game/PremiumMasterHome.kt')
          text = home.read_text(encoding='utf-8')
          text = text.replace(
              "val rating = runCatching { profile?.rating ?: 1000 }.getOrDefault(1000)",
              "val rating = 1000 + (profile?.wins ?: 0) * 18",
          )
          marker = '\n@Composable private fun MasterShortcut('
          top = '@Composable private fun MasterTopThree('
          if top in text and marker in text:
              before, after = text.split(marker, 1)
              # MasterTopThree was authored one closing brace short.
              if not before.rstrip().endswith('}}}}}}}'):
                  before = before.rstrip() + '}\n'
              text = before + marker + after
          home.write_text(text, encoding='utf-8')

          classic = Path('app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt')
          c = classic.read_text(encoding='utf-8')
          c = c.replace('ClassicScreen.HOME -> ClassicHome(', 'ClassicScreen.HOME -> PremiumMasterHome(')
          classic.write_text(c, encoding='utf-8')
          PY
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/PremiumMasterHome.kt app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          git diff --cached --quiet || git commit -m "Repair and activate premium master home [skip ci]"
          git push
