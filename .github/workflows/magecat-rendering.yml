name: Mage Cat Android Rendering
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/magecat-rendering.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mascot-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Prepare SDK and tests
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2 --stacktrace
      - name: Enable KVM for the hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render expressions and dock on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          script: |
            mkdir -p mascot-rendering
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.sonharf.game.MageCatRenderingTest com.sonharf.game.test/androidx.test.runner.AndroidJUnitRunner > mascot-rendering/instrumentation.txt
            cat mascot-rendering/instrumentation.txt
            grep -Fq 'OK (2 tests)' mascot-rendering/instrumentation.txt
            adb pull /sdcard/Android/data/com.sonharf.game/files/mascot-verification mascot-rendering/
            test -s mascot-rendering/mascot-verification/nine-expressions.png
            test -s mascot-rendering/mascot-verification/narrow-dock-large-text.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magecat-android-rendering
          path: |
            mascot-rendering/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn

