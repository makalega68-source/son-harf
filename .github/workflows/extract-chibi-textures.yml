name: Extract Chibi Textures

on:
  push:
    branches:
      - fix/lyra-white-chibi-v11
    paths:
      - '.github/workflows/extract-chibi-textures.yml'
      - '.github/scripts/extract_chibi_textures.py'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract textures
        run: python3 .github/scripts/extract_chibi_textures.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chibi-Texture-Atlas
          path: artifacts/chibi-textures/
          if-no-files-found: error
          retention-days: 3
