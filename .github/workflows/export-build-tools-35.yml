name: Export Android Build Tools 35

on:
  push:
    branches: [recovery/import-80b5099]
    paths: [.github/workflows/export-build-tools-35.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Ensure Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          tar -C "$ANDROID_HOME/build-tools" -I 'zstd -3 -T0' -cf "$RUNNER_TEMP/build-tools-35.0.0.tar.zst" 35.0.0
          sha256sum "$RUNNER_TEMP/build-tools-35.0.0.tar.zst" > "$RUNNER_TEMP/build-tools-35.0.0.sha256"
          ls -lh "$RUNNER_TEMP/build-tools-35.0.0.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35.0.0
          path: |
            ${{ runner.temp }}/build-tools-35.0.0.tar.zst
            ${{ runner.temp }}/build-tools-35.0.0.sha256
          compression-level: 0
          retention-days: 3
