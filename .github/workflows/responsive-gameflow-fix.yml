name: Responsive Gameflow Fix

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: responsive-gameflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply responsive repairs
        run: python3 scripts/apply_responsive_gameflow_fix.py
      - name: Verify requested contracts
        run: |
          grep -q 'aspectRatio(1f)' app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt
          grep -q 'BoxWithConstraints' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          ! grep -q 'verticalScroll(rememberScrollState())' app/src/main/java/com/sonharf/game/BilBakalimFeature.kt
          grep -q 'imeVisible = WindowInsets.ime.getBottom' app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
          grep -q 'KATIL / ONAYLA' app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt
          grep -q 'acceptedOnServer' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt
          grep -q 'RÖVANŞ' app/src/main/java/com/sonharf/game/ComboOverlayV9.kt
          ! grep -q 'finishedRoom = null' app/src/main/java/com/sonharf/game/ComboOverlayV9.kt
          grep -q 'api.dictionaryapi.dev' app/src/main/java/com/sonharf/game/WordMeaningRuntime.kt
          grep -q 'focusRequester(focusRequester)' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt
          grep -q 'timerPulse' app/src/main/java/com/sonharf/game/ExpertArenaOverlay.kt
      - name: Compile debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all
      - name: Commit tested repairs
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/ClassicPremiumApp.kt \
                  app/src/main/java/com/sonharf/game/BilBakalimFeature.kt \
                  app/src/main/java/com/sonharf/game/TargetNeonGameScreen.kt \
                  app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt \
                  app/src/main/java/com/sonharf/game/ComboOverlayV9.kt \
                  app/src/main/java/com/sonharf/game/WordMeaningRuntime.kt
          git diff --cached --quiet || git commit -m "Apply responsive UI and gameflow fixes [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-responsive-gameflow-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
