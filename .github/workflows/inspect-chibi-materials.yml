name: Inspect Chibi Materials

on:
  push:
    branches:
      - fix/lyra-white-chibi-v11
    paths:
      - '.github/workflows/inspect-chibi-materials.yml'
      - '.github/scripts/inspect_chibi_glb.py'
      - 'app/src/main/java/com/sonharf/game/mascotdata3/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect embedded Chibi GLB
        run: python3 .github/scripts/inspect_chibi_glb.py
