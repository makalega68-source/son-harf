name: Bootstrap verified mascot GLB

on:
  push:
    branches: [ feature/mascot-3d-foundation ]
    paths:
      - '.github/workflows/bootstrap-mascot-glb.yml'

permissions:
  contents: write

jobs:
  bundle-asset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mascot-3d-foundation
          fetch-depth: 0

      - name: Download and verify final skeletal GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl --fail --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IF9zXlHgFrus43xyiNWubj7Vka/28c90072-9c58-496e-b7b0-d2d76c9702c9.glb' \
            --output app/src/main/assets/models/son_harf_white_pet_rigged.glb
          echo '9efdcd52345746282af36cd4b9c05759662e2f058ceab0f1d4af343b1751b7a1  app/src/main/assets/models/son_harf_white_pet_rigged.glb' | sha256sum --check --strict
          test "$(stat -c '%s' app/src/main/assets/models/son_harf_white_pet_rigged.glb)" = '781840'

      - name: Commit verified binary and retire partial payload chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/mascot3d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/models/son_harf_white_pet_rigged.glb
          git add -u app/src/main/mascot3d || true
          git diff --cached --quiet && exit 0
          git commit -m 'Bundle verified skeletal mascot GLB [skip ci]'
          git push origin HEAD:feature/mascot-3d-foundation
