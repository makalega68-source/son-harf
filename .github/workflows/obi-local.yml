name: Obi Local APK

on:
  workflow_dispatch:
  push:
    branches: [claude/mascot-animations-behavior-31rof9]
    paths:
      - 'obi/**'
      - 'settings.gradle.kts'
      - '.github/workflows/obi-local.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Build Obi test APK
        run: ./gradlew :obi:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Obi-Yerel-Test
          path: obi/build/outputs/apk/debug/obi-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp obi/build/outputs/apk/debug/obi-debug.apk Obi-Yerel-Test.apk
          gh release view obi-local-test >/dev/null 2>&1 || gh release create obi-local-test --prerelease --title "Obi yerel test" --notes "Obi yerel kişisel asistan test sürümü."
          expected="sha256:$(sha256sum Obi-Yerel-Test.apk | cut -d' ' -f1)"
          for attempt in 1 2 3; do
            if gh release upload obi-local-test Obi-Yerel-Test.apk --clobber; then exit 0; fi
            actual="$(gh api repos/${{ github.repository }}/releases/tags/obi-local-test --jq '.assets[] | select(.name == "Obi-Yerel-Test.apk") | .digest' 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then exit 0; fi
            sleep 3
          done
          exit 1
