name: Kelime Tahtı visual review APK

on:
  push:
    branches: [codex/visual-review-20260926]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Build review APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Prepare review artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Kelime-Tahti-Gorsel-Onizleme.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kelime-Tahti-Gorsel-Onizleme
          path: Kelime-Tahti-Gorsel-Onizleme.apk
          if-no-files-found: error
          retention-days: 7
