name: Prepare Rollback to Last Stable

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Son cihaz testinde onaylanan STABLE sürüm için rollback dalı hazırla. Oyuncu veritabanına dokunulmaz."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prepare-rollback
  cancel-in-progress: false

jobs:
  prepare-rollback:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Find last approved stable tag
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="$(git tag --list 'stable-*' --sort=-creatordate | head -n 1)"
          if [ -z "$TAG" ]; then
            echo "::error::Onaylanmış STABLE sürüm etiketi bulunamadı. Önce cihazda çalışan bir sürümü stable olarak işaretle."
            exit 1
          fi
          TARGET="$(git rev-list -n 1 "$TAG")"
          git cat-file -e "$TARGET^{commit}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Son onaylanmış stable sürüm: $TAG ($TARGET)"

      - name: Create recovery tag for current code
        shell: bash
        run: |
          set -euo pipefail
          TAG="before-rollback-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automatic recovery point before rollback preparation" HEAD
          git push origin "$TAG"

      - name: Prepare rollback branch without changing main
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.sha }}"
          BRANCH="rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git read-tree --reset -u "$TARGET"
          git add -A
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "Kod zaten ${{ steps.target.outputs.tag }} sürümüyle aynı."
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify rollback candidate before publishing branch
        if: ${{ steps.prepare.outputs.no_changes == 'false' }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Commit and publish rollback branch
        if: ${{ steps.prepare.outputs.no_changes == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          TARGET="${{ steps.target.outputs.sha }}"
          BRANCH="${{ steps.prepare.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare safe rollback to $TAG ($TARGET) [admin]"
          git push --set-upstream origin "$BRANCH"

      - name: Summary
        shell: bash
        run: |
          echo "### Rollback hazırlığı" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hedef: ${{ steps.target.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable commit: ${{ steps.target.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.prepare.outputs.no_changes }}" = "true" ]; then
            echo "- Main zaten hedef stable sürümle aynı; dal veya PR gerekmedi." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Hazırlanan dal: \`${{ steps.prepare.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Main değiştirilmedi." >> "$GITHUB_STEP_SUMMARY"
            echo "- Bu dal için PR açılmalı; Final Unified Validation, Android CI ve Frame Provenance Gate yeşil olmadan merge yapılmamalı." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Oyuncu veritabanına dokunulmadı." >> "$GITHUB_STEP_SUMMARY"
