name: Rollback to Last Stable

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Son cihaz testinde onaylanan STABLE sürüme dön. Oyuncu veritabanına dokunulmaz."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rollback-main
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Find last approved stable tag
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="$(git tag --list 'stable-*' --sort=-creatordate | head -n 1)"
          if [ -z "$TAG" ]; then
            echo "::error::Onaylanmış STABLE sürüm etiketi bulunamadı. Önce cihazda çalışan bir sürümü stable olarak işaretle."
            exit 1
          fi
          TARGET="$(git rev-list -n 1 "$TAG")"
          git cat-file -e "$TARGET^{commit}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Son onaylanmış stable sürüm: $TAG ($TARGET)"

      - name: Create recovery tag for current code
        shell: bash
        run: |
          set -euo pipefail
          TAG="before-rollback-$(date -u +%Y%m%d-%H%M%S)"
          git tag -a "$TAG" -m "Automatic recovery point before rollback" HEAD
          git push origin "$TAG"

      - name: Restore code from approved stable
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.sha }}"
          git checkout "$TARGET" -- .
          git reset
          git add -A

      - name: Verify restored app before push
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Commit safe rollback
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          TARGET="${{ steps.target.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Kod zaten $TAG sürümüyle aynı."
            exit 0
          fi
          git commit -m "Safe rollback to $TAG ($TARGET) [admin]"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "### Güvenli geri dönüş tamamlandı" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hedef: ${{ steps.target.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ steps.target.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Oyuncu veritabanı geri sarılmadı veya silinmedi." >> "$GITHUB_STEP_SUMMARY"
          echo "- Geri dönüşten önce mevcut kod için recovery tag oluşturuldu." >> "$GITHUB_STEP_SUMMARY"
