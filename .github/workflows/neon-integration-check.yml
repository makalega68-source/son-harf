name: Neon integration compile check

on:
  push:
    branches: [ fix/full-history-integration ]
  pull_request:
    branches: [ validation/neon-integration ]

permissions:
  contents: read

concurrency:
  group: neon-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Compile Kotlin only
        run: gradle :app:compileDebugKotlin --stacktrace --warning-mode all
