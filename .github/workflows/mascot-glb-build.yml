name: Hero Code Mascot APK Build

on:
  push:
    branches: [ feat/mascot-glb-sceneview-20260822 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero-code-mascot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Apply approved hero code mascot
        run: python3 scripts/apply_hero_code_mascot.py

      - name: Mascot contract checks
        run: |
          set -euxo pipefail
          grep -q 'enabled: Boolean = false' app/src/main/java/com/sonharf/game/MiniMascot3D.kt
          grep -q 'enabled = true' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'MOUTH' app/src/main/java/com/sonharf/game/MiniMascot3D.kt
          grep -q 'TONGUE' app/src/main/java/com/sonharf/game/MiniMascot3D.kt
          ! grep -q 'io.github.sceneview:sceneview:4.17.0' app/build.gradle.kts
          ! grep -q 'SceneView' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'backend.submitWord(active.id, submitted)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --warning-mode all

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all

      - name: Commit tested code mascot source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonharf/game/MiniMascot3D.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "Apply approved hero code mascot"
            git pull --rebase origin feat/mascot-glb-sceneview-20260822
            git push origin HEAD:feat/mascot-glb-sceneview-20260822
          fi

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Hero-Code-Cat-Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Hero-Code-Cat-Test-APK
          path: SonHarf-Hero-Code-Cat-Test.apk
          if-no-files-found: error
