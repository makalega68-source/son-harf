name: Mascot GLB SceneView Build

on:
  push:
    branches: [ feat/mascot-glb-sceneview-20260822 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Install Blender for deterministic mascot asset build
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version | head -n 2

      - name: Fetch CC0 cat rig and compatible animation sources
        run: |
          set -euxo pipefail
          mkdir -p build/mascot-src app/src/main/assets/models
          BASE=https://raw.githubusercontent.com/Mesh2Motion/mesh2motion-assets/main
          curl -fL "$BASE/rig-variations/fox-cat.blend" -o build/mascot-src/fox-cat.blend
          for name in idle idle-alert walk run jump sit sneak fetch howl; do
            curl -fL "$BASE/rigs/fox/animation-fox-$name.blend" -o "build/mascot-src/animation-fox-$name.blend"
          done

      - name: Build white blue-eyed rigged kitten GLB
        run: |
          blender -b --python scripts/build_kitten_glb.py -- \
            --base "$PWD/build/mascot-src/fox-cat.blend" \
            --anim-dir "$PWD/build/mascot-src" \
            --out "$PWD/app/src/main/assets/models/mascot_kitten.glb"
          test -s app/src/main/assets/models/mascot_kitten.glb
          ls -lh app/src/main/assets/models/mascot_kitten.glb

      - name: Mascot integration contract checks
        run: |
          set -euxo pipefail
          grep -q 'io.github.sceneview:sceneview:4.17.0' app/build.gradle.kts
          grep -q 'isOpaque = false' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'animationName = motion.animationName' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'models/mascot_kitten.glb' app/src/main/java/com/sonharf/game/MiniMascotGlobalOverlay.kt
          grep -q 'backend.submitWord(active.id, submitted)' app/src/main/java/com/sonharf/game/SketchGameOverlayV10.kt

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --warning-mode all

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Rigged-Kitten-Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Rigged-Kitten-Test-APK
          path: SonHarf-Rigged-Kitten-Test.apk
          if-no-files-found: error
