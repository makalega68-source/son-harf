name: Build V1 MageCat 2D Animated APK

on:
  push:
    branches: [ apk-test-v1-magecat-restored-20260908 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply test-only Mage Cat size and idle animation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt")
          text = path.read_text(encoding="utf-8")

          import_anchor = "import androidx.activity.compose.BackHandler\n"
          animation_imports = """import androidx.compose.animation.core.RepeatMode
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.tween
          """
          if animation_imports not in text:
              if import_anchor not in text:
                  raise SystemExit("Mage Cat patch failed: import anchor not found")
              text = text.replace(import_anchor, import_anchor + animation_imports, 1)

          function_anchor = "private fun MonsterLiveMatchCard(profile: ProfileDto?, stats: MonsterHomeStats, onPlay: () -> Unit) {\n"
          if text.count(function_anchor) != 1:
              raise SystemExit(f"Mage Cat patch failed: live card function count={text.count(function_anchor)}")

          animation_block = '''    val mascotIdle = rememberInfiniteTransition(label = "mageCatHomeIdle")
              val mascotBob by mascotIdle.animateFloat(
                  initialValue = 0f,
                  targetValue = -7f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(durationMillis = 1450),
                      repeatMode = RepeatMode.Reverse,
                  ),
                  label = "mageCatHomeBob",
              )
              val mascotSway by mascotIdle.animateFloat(
                  initialValue = -2.5f,
                  targetValue = 2.5f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(durationMillis = 1800),
                      repeatMode = RepeatMode.Reverse,
                  ),
                  label = "mageCatHomeSway",
              )
          '''
          text = text.replace(function_anchor, function_anchor + animation_block, 1)

          size_anchor = "modifier = Modifier.size(72.dp),"
          if text.count(size_anchor) < 1:
              raise SystemExit("Mage Cat patch failed: 72dp mascot anchor not found")
          size_replacement = '''modifier = Modifier
                              .offset(x = mascotSway.dp, y = mascotBob.dp)
                              .size(118.dp),'''
          before, marker, after = text.partition(function_anchor)
          after_count = after.count(size_anchor)
          if after_count < 1:
              raise SystemExit("Mage Cat patch failed: mascot size anchor not found after live card function")
          after = after.replace(size_anchor, size_replacement, 1)
          text = before + marker + after

          path.write_text(text, encoding="utf-8")
          PY
      - name: Run regression tests and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-V1-MageCat-2D-Animated.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-V1-MageCat-2D-Animated-APK
          path: SonHarf-V1-MageCat-2D-Animated.apk
          if-no-files-found: error
