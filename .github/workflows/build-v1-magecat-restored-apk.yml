name: Build V1 MageCat 2D Mimics APK

on:
  push:
    branches: [ apk-test-v1-magecat-mimics-20260909 ]
    paths:
      - '.github/workflows/build-v1-magecat-restored-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Route home card to native 2D Mage Cat mimic renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt")
          text = path.read_text(encoding="utf-8")
          old = '''                Image(
                              painter = painterResource(R.drawable.mage_cat_preview_anthracite),
                              contentDescription = sh("Mage Cat maskotu", "Mage Cat mascot"),
                              modifier = Modifier.size(72.dp),
                              contentScale = ContentScale.Fit,
                          )'''
          if text.count(old) != 1:
              raise SystemExit(f"Mage Cat home patch failed: expected one legacy image, found {text.count(old)}")
          new = '''                MageCatHomeMascot(
                              modifier = Modifier.size(MageCatHomeDefaultSize),
                          )'''
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run regression tests and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-V1-MageCat-2D-Mimics.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-V1-MageCat-2D-Mimics-APK
          path: SonHarf-V1-MageCat-2D-Mimics.apk
          if-no-files-found: error

# rebuild: verified complete 2D mimic sheet, legacy preview removed
