name: Apply Screenshot Regressions

on:
  push:
    branches: [ fix/screenshot-regressions-20260906 ]
    paths:
      - '.github/workflows/apply-screenshot-regressions.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/screenshot-regressions-20260906
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply guarded source patches
        run: |
          sed -i 's/val BoardLetterPoint = 8.sp/val BoardLetterPoint: TextUnit = 8.sp/' scripts/apply_screenshot_regressions.py
          sed -i 's/val BoardLetterPoint = 10.sp/val BoardLetterPoint: TextUnit = 10.sp/' scripts/apply_screenshot_regressions.py
          sed -i 's/val BoardBonus = 10.sp/val BoardBonus: TextUnit = 10.sp/' scripts/apply_screenshot_regressions.py
          sed -i 's/val BoardBonus = 12.sp/val BoardBonus: TextUnit = 12.sp/' scripts/apply_screenshot_regressions.py
          sed -i 's/val RackPoint = 9.sp/val RackPoint: TextUnit = 9.sp/' scripts/apply_screenshot_regressions.py
          sed -i 's/val RackPoint = 11.sp/val RackPoint: TextUnit = 11.sp/' scripts/apply_screenshot_regressions.py
          python scripts/apply_screenshot_regressions.py
          git diff --check
      - name: Run full unit tests and debug build
        run: gradle clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Commit only tested fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-screenshot-regressions.yml scripts/apply_screenshot_regressions.py
          git add -A
          git diff --cached --check
          git commit -m "Ekran ve oyun akışı hatalarını düzelt"
          git push origin HEAD:fix/screenshot-regressions-20260906
