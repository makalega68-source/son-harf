name: Apply Screenshot Regressions

on:
  push:
    branches: [ fix/screenshot-regressions-20260906 ]
    paths:
      - '.github/workflows/apply-screenshot-regressions.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/screenshot-regressions-20260906
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply guarded source patches
        run: |
          python scripts/apply_screenshot_regressions_v2.py
          python scripts/fix_screenshot_scope_v3.py
          git diff --check
      - name: Run full unit tests and debug build
        run: gradle clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Commit only tested fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf app/build build
          git rm .github/workflows/apply-screenshot-regressions.yml scripts/apply_screenshot_regressions.py scripts/apply_screenshot_regressions_v2.py scripts/fix_screenshot_scope_v3.py
          git add app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          git add app/src/main/java/com/sonharf/game/LightDuelUi.kt
          git add app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt
          git add app/src/main/java/com/sonharf/game/WordSiegeBoardAccessibility.kt
          git add app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt
          git add app/src/test/java/com/sonharf/game/ScreenshotRegressionFixContractTest.kt
          git add app/src/test/java/com/sonharf/game/ActiveScreenRegressionContractTest.kt
          git add app/src/test/java/com/sonharf/game/BonusFlowReliabilityContractTest.kt
          git diff --cached --check
          git commit -m "Ekran ve oyun akışı hatalarını düzelt"
          git push origin HEAD:fix/screenshot-regressions-20260906
