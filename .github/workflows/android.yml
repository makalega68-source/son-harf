name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main, claude/mascot-animations-behavior-31rof9 ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  actions: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_APK: ${{ contains(github.event.head_commit.message, '[no apk]') }}
      HAS_SIGNING_CONFIG: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 != '' && secrets.SON_HARF_RELEASE_STORE_PASSWORD != '' && secrets.SON_HARF_RELEASE_KEY_ALIAS != '' && secrets.SON_HARF_RELEASE_KEY_PASSWORD != '' }}
      # The signed Google Play bundle (AAB) is built for main, the release-preparation branch and manual runs.
      STORE_BUILD: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/mascot-animations-behavior-31rof9')) }}
      HAS_RELEASE_CONFIG: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 != '' && secrets.SON_HARF_RELEASE_STORE_PASSWORD != '' && secrets.SON_HARF_RELEASE_KEY_ALIAS != '' && secrets.SON_HARF_RELEASE_KEY_PASSWORD != '' && secrets.SON_HARF_ADMOB_APP_ID != '' && secrets.SON_HARF_ADMOB_REWARDED_ID != '' && secrets.SON_HARF_ADMOB_BANNER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Respect source-only request
        shell: bash
        run: |
          if git log -1 --format=%B | grep -Fq '[no apk]'; then
            echo "NO_APK=true" >> "$GITHUB_ENV"
          else
            echo "NO_APK=false" >> "$GITHUB_ENV"
          fi
      - name: Cancel superseded packaging runs
        if: env.NO_APK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 37187664029 37187664037 37187664033; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Verify committed source state
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify Unified Pro source contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/java/com/sonharf/game/MonsterExperienceApp.kt
          test ! -f app/src/main/java/com/sonharf/game/LiveDuelRuntimeShell.kt
          grep -q 'UnifiedProApp(' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'SonHarfCosmetics.restore(context)' app/src/main/java/com/sonharf/game/StableV1App.kt
          grep -q 'SonHarfTopAdBanner(isPremium = isPro)' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          ! grep -RqiE 'ProfHammy|Prof\. Hammy|prof_hammy' app/src/main/java app/src/main/res
          grep -q 'val Background: Color get() = SonHarfTheme.Background' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'lightColorScheme(' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'darkColorScheme(' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          ! grep -q 'MageCat' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.GAME -> OnlineGameScreenV6()' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.SIEGE -> WordSiegeExperienceScreen' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.LETTER -> KelimeAtolyesiScreen' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'UnifiedDestination.VIP -> UnifiedProVipScreen' app/src/main/java/com/sonharf/game/UnifiedProApp.kt
          grep -q 'PremierWordDuelScreen()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          ! grep -q 'ReactiveMageCatOverlay()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          ! grep -q 'PremierBoosterOverlay()' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          ! grep -q 'com.sonharf.game.mascot' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          grep -q 'premierRemainingTurnSeconds' app/src/main/java/com/sonharf/game/PremierWordDuelScreen.kt
          test ! -d app/src/main/java/com/sonharf/game/mascot
          test ! -f app/src/main/res/drawable-nodpi/mage_cat_runtime.webp
          test -f supabase/migrations/20260908155955_unified_pro_boosters_and_turn20.sql
          test -f supabase/migrations/20260909113000_restore_premier_fair_play_v1.sql
          grep -q 'competitive_booster_disabled' supabase/migrations/20260909113000_restore_premier_fair_play_v1.sql

      - name: Verify rewarded-ad callback signatures
        run: node --test supabase/functions/admob-ssv/ssv.test.mjs

      - name: Purge obsolete APK artifacts and duplicate legacy release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.NO_APK != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete mobile-latest --cleanup-tag -y >/dev/null 2>&1 || true
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "son-harf-debug-apk" or .name == "SonHarf-Unified-Pro-APK" or (.name | startswith("son-harf-release-"))) | .id' \
            | while read -r artifact_id; do
                test -n "$artifact_id" || continue
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done

      - name: Compile and test (package only when requested)
        run: |
          set -o pipefail
          tasks=(clean :app:testDebugUnitTest)
          if [ "$NO_APK" != "true" ]; then tasks+=(:app:assembleDebug); fi
          if ! ./gradlew "${tasks[@]}" --stacktrace --warning-mode all 2>&1 | tee build.log; then
            # Surface compiler errors and failing tests as annotations so they are readable without log access.
            summary=$( { grep -E '^e: |FAILED$|Test.*> .* FAILED' build.log; \
              for f in app/build/test-results/testDebugUnitTest/*.xml; do \
                [ -f "$f" ] && grep -A3 '<failure' "$f" | head -8; \
              done; } 2>/dev/null | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
            echo "::error title=Build or test failure::${summary}"
            exit 1
          fi

      - name: Prepare test APK artifact
        if: success() && env.NO_APK != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Final-Test.apk

      - name: Verify APK provenance and integrity
        if: success() && env.NO_APK != 'true'
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo "APK_BYTES=$(stat -c%s SonHarf-Final-Test.apk)"
          sha256sum SonHarf-Final-Test.apk | tee SonHarf-Final-Test.sha256
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs SonHarf-Final-Test.apk

      - name: Upload debug APK artifact
        if: success() && env.NO_APK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-debug-apk
          path: |
            SonHarf-Final-Test.apk
            SonHarf-Final-Test.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Name debug APK Kelime-Tahti-Guncel.apk
        if: success() && env.NO_APK != 'true'
        run: cp SonHarf-Final-Test.apk Kelime-Tahti-Guncel.apk

      - name: Upload Kelime-Tahti-Guncel artifact
        if: success() && env.NO_APK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Tahti-Guncel
          path: Kelime-Tahti-Guncel.apk
          if-no-files-found: error
          retention-days: 7

      # The store build (R8 + resource shrinking) signed with the debug key, so the shrunk app is
      # built and can be tried on a phone before the real signed upload.
      - name: Build store-shrunk check APK
        if: success() && env.NO_APK != 'true'
        run: ./gradlew :app:assembleReleaseCheck --stacktrace --warning-mode all

      - name: Upload store-shrunk check APK
        if: success() && env.NO_APK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Tahti-Yayin-Kontrol
          path: app/build/outputs/apk/releaseCheck/app-releaseCheck.apk
          if-no-files-found: error
          retention-days: 7

      # The same store-shrunk APK signed with the real upload key (test ad IDs, never for the
      # store): proves the signing secrets work and serves the Play developer-verification upload.
      - name: Sign check APK with the upload key
        if: success() && env.STORE_BUILD == 'true' && env.HAS_SIGNING_CONFIG == 'true' && env.NO_APK != 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.SON_HARF_RELEASE_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SON_HARF_RELEASE_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SON_HARF_RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/upload.jks" --ks-key-alias "$SIGN_KEY_ALIAS" \
            --ks-pass env:SIGN_STORE_PASSWORD --key-pass env:SIGN_KEY_PASSWORD \
            --out Kelime-Tahti-Imzali-Dogrulama.apk app/build/outputs/apk/releaseCheck/app-releaseCheck.apk
          "$APKSIGNER" verify --print-certs Kelime-Tahti-Imzali-Dogrulama.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload upload-key signed check APK
        if: success() && env.STORE_BUILD == 'true' && env.HAS_SIGNING_CONFIG == 'true' && env.NO_APK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Tahti-Imzali-Dogrulama
          path: Kelime-Tahti-Imzali-Dogrulama.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build signed release APK and AAB
        if: success() && env.STORE_BUILD == 'true' && env.HAS_RELEASE_CONFIG == 'true' && env.NO_APK != 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 }}
          SON_HARF_RELEASE_STORE_PASSWORD: ${{ secrets.SON_HARF_RELEASE_STORE_PASSWORD }}
          SON_HARF_RELEASE_KEY_ALIAS: ${{ secrets.SON_HARF_RELEASE_KEY_ALIAS }}
          SON_HARF_RELEASE_KEY_PASSWORD: ${{ secrets.SON_HARF_RELEASE_KEY_PASSWORD }}
          SON_HARF_ADMOB_APP_ID: ${{ secrets.SON_HARF_ADMOB_APP_ID }}
          SON_HARF_ADMOB_REWARDED_ID: ${{ secrets.SON_HARF_ADMOB_REWARDED_ID }}
          SON_HARF_ADMOB_BANNER_ID: ${{ secrets.SON_HARF_ADMOB_BANNER_ID }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/son-harf-upload.jks"
          ./gradlew assembleRelease bundleRelease --stacktrace --warning-mode all \
            -PSON_HARF_RELEASE_STORE_FILE="$RUNNER_TEMP/son-harf-upload.jks" \
            -PSON_HARF_RELEASE_STORE_PASSWORD="$SON_HARF_RELEASE_STORE_PASSWORD" \
            -PSON_HARF_RELEASE_KEY_ALIAS="$SON_HARF_RELEASE_KEY_ALIAS" \
            -PSON_HARF_RELEASE_KEY_PASSWORD="$SON_HARF_RELEASE_KEY_PASSWORD" \
            -PSON_HARF_ADMOB_APP_ID="$SON_HARF_ADMOB_APP_ID" \
            -PSON_HARF_ADMOB_REWARDED_ID="$SON_HARF_ADMOB_REWARDED_ID" \
            -PSON_HARF_ADMOB_BANNER_ID="$SON_HARF_ADMOB_BANNER_ID"

      - name: Upload signed release artifacts
        if: success() && env.STORE_BUILD == 'true' && env.HAS_RELEASE_CONFIG == 'true' && env.NO_APK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Report missing release secrets
        if: success() && env.STORE_BUILD == 'true' && env.HAS_RELEASE_CONFIG != 'true' && env.NO_APK != 'true'
        run: echo "::warning::Debug build passed, but signed release AAB was skipped because release signing and/or production AdMob secrets (including banner ID) are not configured."

      - name: Publish stable final-test release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.NO_APK != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view final-test >/dev/null 2>&1 || gh release create final-test --title "Son Harf Final Test" --notes "Son Harf Android final test build."
          gh release upload final-test SonHarf-Final-Test.apk --clobber
