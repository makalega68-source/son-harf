name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all
      - name: Prepare final APK name
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Final-Test.apk
      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-debug-apk
          path: SonHarf-Final-Test.apk
          if-no-files-found: error
      - name: Publish stable final-test release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view final-test >/dev/null 2>&1 || gh release create final-test --title "Son Harf Final Test" --notes "Son Harf Android final test build."
          gh release upload final-test SonHarf-Final-Test.apk --clobber
      - name: Publish direct-download APK in repository
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp SonHarf-Final-Test.apk dist/SonHarf-Final-Test.apk
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_OK.txt
          rm -f dist/BUILD_FAIL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SonHarf-Final-Test.apk dist/BUILD_OK.txt dist/BUILD_FAIL.txt || true
          git diff --cached --quiet || git commit -m "Publish final APK [skip ci]"
          git push
      - name: Publish build failure marker
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          printf 'commit=%s\nfailed_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_FAIL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/BUILD_FAIL.txt
          git diff --cached --quiet || git commit -m "Record Android build failure [skip ci]"
          git push
