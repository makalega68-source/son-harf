name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all
      - name: Prepare final APK name
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Final-Test.apk
      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-debug-apk
          path: SonHarf-Final-Test.apk
          if-no-files-found: error
      - name: Publish stable final-test release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view final-test >/dev/null 2>&1 || gh release create final-test --title "Son Harf Final Test" --notes "Son Harf Android final test build."
          gh release upload final-test SonHarf-Final-Test.apk --clobber
