name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_CONFIG: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 != '' && secrets.SON_HARF_RELEASE_STORE_PASSWORD != '' && secrets.SON_HARF_RELEASE_KEY_ALIAS != '' && secrets.SON_HARF_RELEASE_KEY_PASSWORD != '' && secrets.SON_HARF_ADMOB_APP_ID != '' && secrets.SON_HARF_ADMOB_REWARDED_ID != '' && secrets.SON_HARF_ADMOB_BANNER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Verify committed source state
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Apply requested active UI patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/active-ui-compact-20260905'
        run: |
          python3 scripts/active_ui_compact_patch_20260905.py
          python3 scripts/active_ui_contract_repair_20260905.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'app/src/main/java/com/sonharf/game/LightDuelUi.kt',
              'app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt',
              'app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'UI scope violation: {sorted(changed)}')
          PY
          grep -q 'LightDuelArena(' app/src/main/java/com/sonharf/game/OnlineGameScreenV6.kt
          grep -q 'WordSiegePracticeScreen(' app/src/main/java/com/sonharf/game/WordSiegePanMatch.kt
          ! git diff --name-only | grep -E '(^|/)(data|supabase)/|OnlineGameBackend|WordSiegeBackend|ClassicCompetitionRules|WordSiegeFinalRules'

      - name: Build debug APK with tests
        run: gradle clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all

      - name: Prepare test APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Final-Test.apk

      - name: Verify APK provenance and integrity
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo "APK_BYTES=$(stat -c%s SonHarf-Final-Test.apk)"
          sha256sum SonHarf-Final-Test.apk | tee SonHarf-Final-Test.sha256
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs SonHarf-Final-Test.apk
          unzip -t SonHarf-Final-Test.apk >/dev/null
          unzip -l SonHarf-Final-Test.apk | grep -q 'classes.dex'

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-debug-apk
          path: |
            SonHarf-Final-Test.apk
            SonHarf-Final-Test.sha256
          if-no-files-found: error

      - name: Persist validated active UI only
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'fix/active-ui-compact-20260905'
        run: |
          git checkout 7488d727f87894cc76fd9a55a17e7db8c552f89b -- .github/workflows/android.yml
          rm -f .github/workflows/active-ui-compact-validation.yml scripts/active_ui_compact_patch_20260905.py scripts/active_ui_contract_repair_20260905.py
          git add -A
          python3 - <<'PY'
          import subprocess
          base = '7488d727f87894cc76fd9a55a17e7db8c552f89b'
          allowed = {
              'app/src/main/java/com/sonharf/game/LightDuelUi.kt',
              'app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt',
              'app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt',
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only',base], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'final tree scope violation: {sorted(changed)}')
          PY
          git config user.name 'sonharf-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(ui): compact active duel and siege screens'
          git push origin HEAD:${{ github.head_ref }}

      - name: Build signed release APK and AAB
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_CONFIG == 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 }}
          SON_HARF_RELEASE_STORE_PASSWORD: ${{ secrets.SON_HARF_RELEASE_STORE_PASSWORD }}
          SON_HARF_RELEASE_KEY_ALIAS: ${{ secrets.SON_HARF_RELEASE_KEY_ALIAS }}
          SON_HARF_RELEASE_KEY_PASSWORD: ${{ secrets.SON_HARF_RELEASE_KEY_PASSWORD }}
          SON_HARF_ADMOB_APP_ID: ${{ secrets.SON_HARF_ADMOB_APP_ID }}
          SON_HARF_ADMOB_REWARDED_ID: ${{ secrets.SON_HARF_ADMOB_REWARDED_ID }}
          SON_HARF_ADMOB_BANNER_ID: ${{ secrets.SON_HARF_ADMOB_BANNER_ID }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/son-harf-upload.jks"
          gradle assembleRelease bundleRelease --stacktrace --warning-mode all \
            -PSON_HARF_RELEASE_STORE_FILE="$RUNNER_TEMP/son-harf-upload.jks" \
            -PSON_HARF_RELEASE_STORE_PASSWORD="$SON_HARF_RELEASE_STORE_PASSWORD" \
            -PSON_HARF_RELEASE_KEY_ALIAS="$SON_HARF_RELEASE_KEY_ALIAS" \
            -PSON_HARF_RELEASE_KEY_PASSWORD="$SON_HARF_RELEASE_KEY_PASSWORD" \
            -PSON_HARF_ADMOB_APP_ID="$SON_HARF_ADMOB_APP_ID" \
            -PSON_HARF_ADMOB_REWARDED_ID="$SON_HARF_ADMOB_REWARDED_ID" \
            -PSON_HARF_ADMOB_BANNER_ID="$SON_HARF_ADMOB_BANNER_ID"

      - name: Upload signed release artifacts
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_CONFIG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Report missing release secrets
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_CONFIG != 'true'
        run: echo "::warning::Debug build passed, but signed release AAB was skipped because release signing and/or production AdMob secrets (including banner ID) are not configured."

      - name: Publish stable final-test release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view final-test >/dev/null 2>&1 || gh release create final-test --title "Son Harf Final Test" --notes "Son Harf Android final test build."
          gh release upload final-test SonHarf-Final-Test.apk --clobber
