name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_CONFIG: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 != '' && secrets.SON_HARF_RELEASE_STORE_PASSWORD != '' && secrets.SON_HARF_RELEASE_KEY_ALIAS != '' && secrets.SON_HARF_RELEASE_KEY_PASSWORD != '' && secrets.SON_HARF_ADMOB_APP_ID != '' && secrets.SON_HARF_ADMOB_REWARDED_ID != '' && secrets.SON_HARF_ADMOB_BANNER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Apply actual practice screen fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/turn-timer-siege-camera-readability-20260904'
        run: |
          python3 tools/apply_practice_screen_fix.py
          python3 tools/apply_practice_test_contracts.py
      - name: Test and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee android-build.log
      - name: Prepare QA APK name
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Final-Test.apk
      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-debug-apk
          path: SonHarf-Final-Test.apk
          if-no-files-found: error
      - name: Persist verified practice source changes
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'fix/turn-timer-siege-camera-readability-20260904'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_HEAD_REF}:${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_HEAD_REF}"
          git add app/src/main/java/com/sonharf/game/WordSiegePracticeScreen.kt app/src/main/java/com/sonharf/game/WordSiegePracticeBoard.kt app/src/test/java/com/sonharf/game/WordSiegePracticeBoardContractTest.kt app/src/test/java/com/sonharf/game/WordSiegePracticeVisualContractTest.kt app/src/test/java/com/sonharf/game/WordSiegeFinalRulesTest.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(siege): update actual bot practice screen"
          git push origin "${GITHUB_HEAD_REF}"
      - name: Build signed release APK and AAB
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_CONFIG == 'true'
        run: echo "Release build remains main-only"
