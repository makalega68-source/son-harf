name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_CONFIG: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 != '' && secrets.SON_HARF_RELEASE_STORE_PASSWORD != '' && secrets.SON_HARF_RELEASE_KEY_ALIAS != '' && secrets.SON_HARF_RELEASE_KEY_PASSWORD != '' && secrets.SON_HARF_ADMOB_APP_ID != '' && secrets.SON_HARF_ADMOB_REWARDED_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Test and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee android-build.log

      - name: Prepare QA APK name
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk SonHarf-Final-Test.apk

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-debug-apk
          path: SonHarf-Final-Test.apk
          if-no-files-found: error

      - name: Runtime preview Neris fur lift
        if: success() && github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p artifacts/neris-fur-preview
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 720x1600
            adb shell wm density 280
            adb logcat -c
            adb shell am start -W -n com.sonharf.game/.MascotRuntimeSmokeActivity --es mascot_id mascot_chibi_wizard
            timeout 25 sh -c "until adb logcat -d | grep -q 'MASCOT_RENDER_READY id=mascot_chibi_wizard clip=Idle'; do sleep 1; done"
            sleep 2
            adb exec-out screencap -p > artifacts/neris-fur-preview/neris-fur-idle.png
            adb logcat -d > artifacts/neris-fur-preview/neris-fur-logcat.txt
            grep -q 'CHIBI_LIGHTING_READY' artifacts/neris-fur-preview/neris-fur-logcat.txt
            grep -q 'fur=1.55' artifacts/neris-fur-preview/neris-fur-logcat.txt
            ! grep -Eqi 'FATAL EXCEPTION|Fatal signal|SIGABRT|SIGSEGV|ANR in com\.sonharf\.game' artifacts/neris-fur-preview/neris-fur-logcat.txt
            test $(wc -c < artifacts/neris-fur-preview/neris-fur-idle.png) -gt 20000

      - name: Upload Neris fur preview
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Neris-Fur-Lighten-Preview
          path: artifacts/neris-fur-preview/
          if-no-files-found: warn
          retention-days: 3

      - name: Build signed release APK and AAB
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_CONFIG == 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.SON_HARF_RELEASE_KEYSTORE_B64 }}
          SON_HARF_RELEASE_STORE_PASSWORD: ${{ secrets.SON_HARF_RELEASE_STORE_PASSWORD }}
          SON_HARF_RELEASE_KEY_ALIAS: ${{ secrets.SON_HARF_RELEASE_KEY_ALIAS }}
          SON_HARF_RELEASE_KEY_PASSWORD: ${{ secrets.SON_HARF_RELEASE_KEY_PASSWORD }}
          SON_HARF_ADMOB_APP_ID: ${{ secrets.SON_HARF_ADMOB_APP_ID }}
          SON_HARF_ADMOB_REWARDED_ID: ${{ secrets.SON_HARF_ADMOB_REWARDED_ID }}
          SON_HARF_ADMOB_BANNER_ID: ${{ secrets.SON_HARF_ADMOB_BANNER_ID }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/son-harf-upload.jks"
          gradle assembleRelease bundleRelease --stacktrace --warning-mode all \
            -PSON_HARF_RELEASE_STORE_FILE="$RUNNER_TEMP/son-harf-upload.jks" \
            -PSON_HARF_RELEASE_STORE_PASSWORD="$SON_HARF_RELEASE_STORE_PASSWORD" \
            -PSON_HARF_RELEASE_KEY_ALIAS="$SON_HARF_RELEASE_KEY_ALIAS" \
            -PSON_HARF_RELEASE_KEY_PASSWORD="$SON_HARF_RELEASE_KEY_PASSWORD" \
            -PSON_HARF_ADMOB_APP_ID="$SON_HARF_ADMOB_APP_ID" \
            -PSON_HARF_ADMOB_REWARDED_ID="$SON_HARF_ADMOB_REWARDED_ID" \
            -PSON_HARF_ADMOB_BANNER_ID="$SON_HARF_ADMOB_BANNER_ID"

      - name: Upload signed release artifacts
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_CONFIG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: son-harf-release-v0.8.1
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Report missing release secrets
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_CONFIG != 'true'
        run: echo "::warning::Debug build passed, but signed release AAB was skipped because release signing and/or production AdMob secrets are not configured."

      - name: Publish stable final-test release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view final-test >/dev/null 2>&1 || gh release create final-test --title "Son Harf Final Test" --notes "Son Harf Android final test build."
          gh release upload final-test SonHarf-Final-Test.apk --clobber

      - name: Publish direct-download APK in repository
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp SonHarf-Final-Test.apk dist/SonHarf-Final-Test.apk
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_OK.txt
          rm -f dist/BUILD_FAIL.txt dist/BUILD_FAIL_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SonHarf-Final-Test.apk dist/BUILD_OK.txt
          git add -u dist/BUILD_FAIL.txt dist/BUILD_FAIL_LOG.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Publish final APK [skip ci]"
          git push

      - name: Publish build failure marker
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          printf 'commit=%s\nfailed_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_FAIL.txt
          if [ -f android-build.log ]; then
            tail -n 350 android-build.log > dist/BUILD_FAIL_LOG.txt
          else
            printf 'android-build.log was not produced\n' > dist/BUILD_FAIL_LOG.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/BUILD_FAIL.txt dist/BUILD_FAIL_LOG.txt
          git diff --cached --quiet || git commit -m "Record Android build failure with log [skip ci]"
          git push
