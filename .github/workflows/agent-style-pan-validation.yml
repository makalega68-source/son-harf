name: Agent Style Pan Validation
on:
  push:
    branches:
      - feat/premium-style-private-room-bot-ui-20260831
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is not available on this runner; emulator will use software acceleration."
          fi
      - name: Emulator runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.sonharf.game
            adb shell am start -W -n com.sonharf.game/.MainActivity
            sleep 5
            test -n "$(adb shell pidof com.sonharf.game | tr -d '\r')"
            adb shell dumpsys activity activities | grep -q 'com.sonharf.game/.MainActivity'
            adb exec-out screencap -p > emulator-launch.png
            test -s emulator-launch.png
      - uses: actions/upload-artifact@v4
        with:
          name: SonHarf-Style-Pan-Validation-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            emulator-launch.png
          if-no-files-found: error
          retention-days: 7
